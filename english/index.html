  function topic(id) { return TOPICS.find((t) => t.id === id); }
  function topicOfSkill(id) { return TOPICS.find((t) => t.skills.some((k) => k.id === id)); }

  /* Suitability: "later in your journey" if the skill's earliest stage is beyond the learner's next stage. */
  function suitability(sk, route) {
    const earliest = Math.min(...sk.stages.map(stageIndex));
    return earliest <= stageIndex(route) + 1 ? 'suitable' : 'later';
  }
  function search(q) {
    q = q.trim().toLowerCase();

    return out;
  }

  <script>
/* Question generators: the framework only (the Family Maths engine with the maths templates taken out).
   Skills register templates into TEMPLATES through FMG.skillLib (skills-en.js). Each template has
   make(r, level, opts) → question body, and validate(q). opts.step is the six-step ladder rung (0–5). */
(function (root) {
  'use strict';
  const FMG = root.FMG;
  const { rng } = FMG;

  const LEVELS = ['routine', 'application', 'stretch'];
  const LEVEL_NAMES = { routine: 'Routine', application: 'Application', stretch: 'Stretch' };

  const TEMPLATES = {};
  const BY_SKILL = {};

  /* Build one instance from (template, seed, level). Returns null for an invalid draw. */
  function generate(templateId, seed, level, opts) {
    const t = TEMPLATES[templateId];
    if (!t) return null;
    const r = rng(seed);
    let body = null;
    try { body = t.make(r, level, opts || null); } catch (e) { return null; }
    if (!body) return null;
    const q = Object.assign({ templateId, version: t.version, seed, level, skillId: t.skillId, kind: t.kind, responseType: t.responseType, gcse: false }, body);
    q.fingerprint = `${templateId}|${q.factKey}`;
    try { if (!t.validate(q)) return null; } catch (e) { return null; }
    return q;
  }

  /* How hard an instance is, for stepping stones (easier end) and Stretch+ (harder end): the skill can set q.size,
     otherwise longer answers and prompts count as harder. */
  function size(q) {
    if (typeof q.size === 'number') return q.size;
    const txt = String(q.prompt || '').replace(/<[^>]+>/g, ' ');
    return txt.length / 40;
  }
  function draw1(templateId, level, recent, seedSource, opts) {
    for (let i = 0; i < 60; i++) {
      const seed = seedSource();
      const q = generate(templateId, seed, level, opts);
      if (!q) continue;
      if (recent.includes(q.fingerprint) && i < 40) continue; // after 40 tries, honest repetition is allowed (finite banks)
      return q;
    }
    for (let s = 5000; s < 7000; s++) { const q = generate(templateId, s, level, opts); if (q) return q; }
    return null;
  }
  function draw(templateId, level, recent = [], seedSource = FMG.newSeed, opts) {
    if (!opts || (!opts.gentle && !opts.plus)) return draw1(templateId, level, recent, seedSource, opts);
    const c = [];
    for (let k = 0; k < 4; k++) { const q = draw1(templateId, level, recent.concat(c.map((x) => x.fingerprint)), seedSource, opts); if (q) c.push(q); }
    if (!c.length) return null;
    c.sort((a, b) => size(a) - size(b));
    return opts.plus ? c[c.length - 1] : c[0];
  }

  /* The six-step ladder used by Practice, Endless and Check. Skills name their own steps (FMG.skillLib.LADDER),
     so each rung means something for that kind of English (e.g. "Read it", "Hear it", … "Hardest words"). */
  const STEP_NAMES = ['Routine', 'Stepping stone', 'Application', 'Stepping stone', 'Stretch', 'Stretch+'];
  const STEP_DEFAULT = [
    { level: 'routine', bands: [0] },
    { level: 'application', bands: [0], gentle: true },
    { level: 'application', bands: [0] },
    { level: 'stretch', bands: [0], gentle: true },
    { level: 'stretch', bands: [0] },

/* Evidence and mastery. Attempt records are the evidence; everything here is derived and reproducible.
   Proposed v0.2 policy (spec §7–8), versioned so history can be re-read later. */
(function (root) {
  'use strict';
  const FMG = root.FMG;
  const POLICY_VERSION = 'v0.2-proposed';
  const EARLY_SKILLS = new Set();
  /* Skills whose questions are all tap-to-choose (reading answers, literature knowledge…) cannot ask for a typed answer,
     so the "constructed answer" part of the Secure rule is waived for them (skills-en.js fills this set). */
  const CHOICE_ONLY = new Set();

  /* outcome of one attempt:
     independent — first response correct, no answer-revealing help before it
     supported   — answer-revealing help or solution seen before the first response (or help with no response)
     incorrect   — first mathematical response wrong, without answer-revealing help
     not-taught  — learner marked "not taught yet" */
  function outcome(a) {
    if (a.notTaught) return 'not-taught';
    if (a.revealingHelpBeforeFirst || (a.solutionShown && a.firstCorrect == null)) return 'supported';
    if (a.firstCorrect == null) return a.hints > 0 ? 'supported' : 'open';
    return a.firstCorrect ? 'independent' : 'incorrect';
  }

  const isAssessment = (a) => a.origin === 'check' || a.origin === 'review';

  /* Eligible evidence for Secure: committed Check/Review attempts at this skill and level,
     excluding technical failures/defects and duplicate facts inside one session (spec §8). */
  function eligible(attempts, skillId, level) {
    const rows = attempts
      .filter((a) => a.skillId === skillId && a.level === level && isAssessment(a) && a.committed && !a.excluded)
      .sort((x, y) => x.committedAt - y.committedAt);
    const seen = new Set();
    const out = [];
    for (const a of rows) {
      const key = a.sessionId + '|' + a.factKey;
      if (seen.has(key)) continue; // never count the same fact twice in one session
      seen.add(key);
      out.push(a);
    }
    return out;
  }

  /* Secure rule for a window of ≤10 tasks. Returns {ok, reasons[]} */
  function secureRule(windowRows, early, choiceOnly) {
    const reasons = [];
    const ind = windowRows.filter((a) => outcome(a) === 'independent');
    if (windowRows.length < 10) reasons.push(`${windowRows.length}/10 assessed tasks so far`);
    if (ind.length < 9) reasons.push(`${ind.length}/10 independent (need 9)`);
    const dates = new Set(windowRows.map((a) => a.date));
    if (dates.size < 2) reasons.push('needs a second day');
    if (!windowRows.some((a) => a.kind === 'reasoning' && outcome(a) === 'independent')) reasons.push('needs a successful reasoning task');
    if (!windowRows.some((a) => a.kind === 'transfer' && outcome(a) === 'independent')) reasons.push('needs a successful transfer task');
    if (!choiceOnly && !windowRows.some((a) => a.responseType !== 'choice' && outcome(a) === 'independent')) reasons.push('needs a typed (not multiple-choice) answer');
    if (early) {
      const ctx = new Set(windowRows.filter((a) => outcome(a) === 'independent').map((a) => a.context));

    const bySession = {};

  }

  function skillLevelState(attempts, skillId, level, today) {

    const early = EARLY_SKILLS.has(skillId), choiceOnly = CHOICE_ONLY.has(skillId);
    const mine = attempts.filter((a) => a.skillId === skillId && a.level === level && a.committed);
    const rows = eligible(attempts, skillId, level);
    const window = rows.slice(-10);
    const secure = findSecure(rows, early, choiceOnly);

      counts: countOutcomes(mine),
      assessed: countOutcomes(rows),
      window: { size: window.length, independent: window.filter((a) => outcome(a) === 'independent').length, rule: secureRule(window, early, choiceOnly) },

    if (!secure) return res;

    res.status = 'secure';
    res.secureDate = secure.date;
    const sessions = reviewSessions(attempts, skillId, level).filter((s) => s.at > secure.at);
    const schedule = [1, 7, 30].map((n) => FMG.addDays(secure.date, n));

        const transferOk = five.some((a) => (a.kind === 'transfer' || a.kind === 'reasoning') && outcome(a) === 'independent');

    for (const a of rows) {
      const o = outcome(a);

      if (a.firstCorrect === true) c.firstCorrect++;

  /* Best overall state for a skill across levels (for cards and dashboards). */
  const RANK = { 'not-started': 0, learning: 1, practising: 2, secure: 3, retained: 4 };
  function skillState(attempts, skillId, today) {
    const levels = FMG.gen.LEVELS.map((l) => skillLevelState(attempts, skillId, l, today));
    const best = levels.reduce((b, s) => (RANK[s.status] > RANK[b.status] ? s : b), levels[0]);

  }

  }

  const STATUS_LABEL = { 'not-started': 'Not started', learning: 'Learning', practising: 'Practising', secure: 'Secure', retained: 'Retained' };

  FMG.evidence = { POLICY_VERSION, CHOICE_ONLY, outcome, eligible, secureRule, skillLevelState, skillState, readiness, misconceptions, countOutcomes, STATUS_LABEL };

  if (typeof speechSynthesis !== 'undefined') try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) { /* ignore */ }

  /* ---------- Recorded sounds (IndexedDB: one clip per grapheme) ---------- */
  const DB = 'familyEnglishSounds';
  const open = () => new Promise((res, rej) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore('s'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('s', mode), q = fn(t.objectStore('s')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  let have = new Set();
  const sounds = {
    async load() { try { const keys = await tx('readonly', (s) => s.getAllKeys()); have = new Set(keys || []); } catch (e) { have = new Set(); } return have; },
    has: (g) => have.has(g),
    count: () => have.size,
    async put(g, blob) { await tx('readwrite', (s) => s.put(blob, g)); have.add(g); },
    async del(g) { await tx('readwrite', (s) => s.delete(g)); have.delete(g); },
    async play(g) {
      if (!have.has(g)) return false;
      try { const blob = await tx('readonly', (s) => s.get(g)); if (!blob) return false; voice.stop(); audio = new Audio(URL.createObjectURL(blob)); await audio.play(); return true; } catch (e) { return false; }
    },
    canRecord: () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && root.MediaRecorder),
    async record(ms) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const rec = new MediaRecorder(stream), parts = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) parts.push(e.data); };
      const done = new Promise((res) => { rec.onstop = () => { stream.getTracks().forEach((t) => t.stop()); res(new Blob(parts, { type: rec.mimeType || 'audio/mp4' })); }; });
      rec.start(); setTimeout(() => rec.state !== 'inactive' && rec.stop(), ms || 1600);
      return done;
    },
  };
  sounds.load();
  FMG.voice = voice; FMG.sounds = sounds;
})(typeof window !== 'undefined' ? window : globalThis);

  <!-- English skills on the framework -->
  <script>
/* Family English — the skill framework (the English counterpart of skills.js in Family Maths).
   A skill is registered with FMG.skillLib.add(topicId, def). def:
     id, name, child, stages[], prereqs[], obj, bigIdea, method[], mistake {wrong, fix}, spelling (true when spelling is
     the thing being tested: no slips allowed when typing), steps[6] (ladder rung names), stepsDesc[6],
     gen(r, step) → an English question (eq), reason(r, step) → a "Kit says…" eq, transfer(r, step) → eq, tool.
   An eq is the shape the English question banks already make:
     { qt, prompt, speak, big, sentence, pic, hear, passage, options:[{letter, value}], answerIndex, typable, accept, why,
       item, walk:[{do, math, why}] | mid:{do, math, why}, preferType, size, trace }
   register() turns every skill into three templates, exactly like Family Maths:
     <id>:p  procedure (the step's own question shapes)
     <id>:x  reasoning ("Kit says … Is Kit right?")
     <id>:t  transfer (the same idea in a new format or text, or the harder rung when the skill has no other format)
   and every question carries a worked walk (2–6 steps, the last one gives the answer) for Learn and "Explain it". */
(function (root) {
  'use strict';
  const FMG = root.FMG, esc = FMG.esc;
  const T = FMG.gen.TEMPLATES, BY = FMG.gen.BY_SKILL, CUR = FMG.curriculum;
  const SK = [], LADDER = {};
  FMG.MISC_EXTRA = FMG.MISC_EXTRA || {};
  FMG.SYLLABUS = FMG.SYLLABUS || {};
  const LET = ['A', 'B', 'C', 'D'];
  const STEP_OF_LEVEL = { routine: 0, application: 2, stretch: 4 };
  const stepOf = (level, o) => Math.max(0, Math.min(5, o && o.step != null ? o.step : STEP_OF_LEVEL[level] || 0));
  const plain = (h) => String(h == null ? '' : h).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  const uniq = (a) => a.filter((x, i) => x != null && x !== '' && a.indexOf(x) === i);
  const BAD = /\bundefined\b|\bNaN\b|\[object |\bnull\b/;
  const txt = (h) => plain(h).replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');

  /* ---------- helpers shared by the skill files ---------- */
  /* Four options: the right answer and three different wrong ones (or null). */
  function opts4(rng, right, wrongs) {
    const pool = uniq(wrongs.map((w) => (w == null ? w : String(w)))).filter((w) => w !== String(right));
    const pick = rng.shuffle(pool).slice(0, 3);
    if (pick.length < 3) return null;
    const all = rng.shuffle([String(right)].concat(pick));
    return { options: all.map((v, i) => ({ letter: LET[i], value: v })), answerIndex: all.indexOf(String(right)) };
  }
  const rightOf = (eq) => (eq && eq.options ? String(eq.options[eq.answerIndex].value) : '');
  /* "Kit says…": any question becomes a reasoning question. Kit is right about a third of the time. Every wrong
     option stays wrong: "Yes" when Kit is wrong, and "No, it is <a wrong answer>" in either case. */
  function kitWrap(eq, rng) {
    if (!eq || !eq.options || eq.options.length !== 4 || eq.kind === 'pic') return null;
    const right = rightOf(eq), wrongs = eq.options.map((o) => String(o.value)).filter((v) => v !== right);
    const isRight = rng() < 0.3, claim = isRight ? right : rng.pick(wrongs);
    const yes = 'Yes, Kit is right.', no = (v) => `No, it is “${v}”.`;
    const o = isRight ? opts4(rng, yes, wrongs.map(no)) : opts4(rng, no(right), [yes].concat(wrongs.filter((w) => w !== claim).map(no)));
    if (!o) return null;
    const walk = walkOf(null, eq);
    const mid = walk.slice(1, -1).slice(0, 3);
    return Object.assign({}, eq, o, {
      qt: (eq.qt || 'q') + '-kit', typable: false, accept: null, preferType: false, claim,
      prompt: `${eq.prompt} Kit says the answer is “${claim}”. Is Kit right?`,
      speak: `${plain(eq.speak || eq.prompt)} Kit says the answer is ${claim}. Is Kit right?`,
      why: `${isRight ? 'Kit is right.' : `Kit is wrong: the answer is “${right}”.`} ${eq.why || ''}`.trim(),
      walk: [{ do: 'Read what Kit says', math: `Kit says: “${esc(claim)}”`, why: 'Kit is sometimes right and sometimes wrong. Do not just agree: check it yourself.' }]
        .concat(mid.length ? mid : [{ do: 'Work it out yourself', math: esc(eq.prompt), why: 'Answer the question first, then compare with Kit.' }])
        .concat([{ do: 'Compare with Kit', math: isRight ? `Kit is right: the answer is <b>${esc(right)}</b>.` : `Kit is wrong. The answer is <b>${esc(right)}</b>.`, why: esc(eq.why || '') || 'That is what the question asks for.' }]),
      mid: null,
    });
  }

  /* ---------- question HTML ---------- */
  function passageBox(p) {
    const body = p.kind === 'Poem' ? `<p>${p.text.split(' / ').map(esc).join('<br>')}</p>` : String(p.text).split(/\n\n+/).map((t) => `<p>${esc(t)}</p>`).join('');
    return `<details class="passage" open><summary><b>${esc(p.title)}</b> <span class="small muted">${esc(p.kind || '')}${p.level ? ' · ' + esc(p.level) : ''} · tap to hide or show</span></summary>${body}<button type="button" class="btn sm ghost" data-hear="${esc((p.title + '. ' + p.text).replace(/ \/ /g, ' '))}">🔊 Read it to me</button></details>`;
  }
  const promptHtml = (eq) => `${eq.passage ? passageBox(eq.passage) : ''}<span class="en-q">${esc(eq.prompt)}</span>`;
  function visualOf(eq) {
    if (eq.trace) return { type: 'en-card', note: eq.note || null };
    const v = { type: 'en-card', pic: eq.pic || null, big: eq.big || null, sentence: eq.sentence || null, hear: eq.hear || null, hearLabel: eq.hearLabel || null, snd: eq.snd || null, sndEx: eq.sndEx || null };
    return v.pic || v.big || v.sentence || v.hear || v.snd ? v : null;
  }

  /* ---------- the worked walk (2–6 steps; the last states the answer) ---------- */
  function walkOf(S, eq) {
    if (eq.walk && eq.walk.length >= 2) return eq.walk.slice(0, 6);
    const right = eq.trace ? eq.trace : rightOf(eq);
    const first = eq.passage ? { do: 'Read the question, then look back at the text', math: esc(eq.prompt), why: 'Good readers look back at the text to check, instead of guessing.' }
      : eq.hear && !eq.big && !eq.sentence ? { do: 'Listen carefully', math: `🔊 “${esc(eq.hear)}”`, why: 'Press the speaker to hear it again as many times as you like.' }
        : { do: 'Read the question', math: esc(eq.big ? `${eq.prompt} ${eq.big}` : eq.sentence ? `${eq.prompt} “${eq.sentence}”` : eq.prompt), why: esc((S && S.method && S.method[0]) || 'Know exactly what you are looking for first.') };
    const mid = eq.mid || (S ? { do: 'Use what you know', math: esc(S.bigIdea), why: esc((S.method && S.method[1]) || S.obj) } : null);
    const last = { do: eq.trace ? 'Write it' : 'Answer', math: eq.trace ? `Trace <b>${esc(right)}</b> from the green dot, following the arrow.` : `The answer is <b>${esc(right)}</b>.`, why: esc(eq.why || (S && S.obj) || 'That is what the question asks for.') };
    return [first].concat(mid ? [mid] : [], [last]);
  }

  /* ---------- eq → the app's question body ---------- */
  function body(S, eq, kind) {
    if (!eq) return null;
    const walk = walkOf(S, eq);
    const hint = eq.hint || S.hint || (S.method && S.method[0]) || S.bigIdea;
    const common = {
      context: kind === 'transfer' ? 'transfer' : 'standard',
      prompt: promptHtml(eq), speak: plain(eq.speak || eq.prompt), hear: eq.hear || null, visual: visualOf(eq),
      hints: [{ text: esc(hint), speak: plain(hint), reveals: false }].concat(walk.length > 2 ? [{ text: `${walk[1].do}: ${walk[1].math}`, reveals: true }] : []),
      solution: walk.map((w) => `${w.do}: ${w.math}`),
      _raw: { walk, key: `${eq.item || ''}:${eq.qt || ''}`, eq },
      explain: { steps: walk.map((w) => `${w.do}: ${w.math}`), rule: esc(hint), mistakes: S.mistake ? [{ value: plain(S.mistake.wrong), message: esc(S.mistake.fix) }] : [] },
      size: typeof eq.size === 'number' ? eq.size : undefined,
    };
    if (eq.trace) {
      return Object.assign(common, { factKey: `${kind[0]}:trace:${eq.trace}:${eq.guide ? 'g' : 'n'}`, answer: { type: 'trace', letter: eq.trace, guide: !!eq.guide }, responseType: 'construct', choices: undefined, marks: 1 });
    }
    if (!eq.options || eq.options.length !== 4) return null;
    const labels = eq.options.map((o) => String(o.value));
    const ai = eq.answerIndex, right = labels[ai];
    if (ai == null || ai < 0 || ai > 3) return null;
    const typable = !!eq.typable && !eq.noType;
    const answer = typable
      ? { type: 'text', correct: 'c' + ai, accept: uniq((eq.accept || []).map(String).concat(right)), wrong: labels.filter((_, i) => i !== ai), tolerance: !S.spelling && !eq.strict }
      : { type: 'choice', correct: 'c' + ai };
    return Object.assign(common, {
      factKey: `${kind[0]}:${eq.item || ''}:${eq.qt || ''}:${eq.claim || ''}:${right}`.slice(0, 160),
      answer, choices: labels.map((l, i) => ({ id: 'c' + i, label: l })), choiceKind: eq.kind === 'pic' ? 'pic' : null,
      responseType: typable ? 'construct' : 'choice', preferType: typable && !!eq.preferType, marks: typable ? 2 : 1,
    });
  }

  function validateInstance(q) {
    const raw = q._raw || {}, walk = raw.walk || [];
    if (walk.length < 2 || walk.length > 6) return false;
    if (walk.some((w) => !w || !plain(w.do) || !plain(w.math) || !plain(w.why))) return false;
    const texts = [q.prompt, q.speak].concat(walk.flatMap((w) => [w.do, w.math, w.why]), (q.choices || []).map((c) => c.label));
    if (texts.some((t) => BAD.test(String(t)))) return false;
    const a = q.answer;
    if (a.type === 'trace') return !!(FMG.trace && FMG.trace.L[a.letter]);
    const labels = q.choices.map((c) => c.label);
    if (labels.length !== 4 || new Set(labels).size !== 4 || labels.some((l) => !String(l).trim())) return false;
    if (!q.choices.some((c) => c.id === a.correct)) return false;
    if (!txt(walk[walk.length - 1].math).includes(txt(labels[+a.correct.slice(1)])) && !/Kit is (right|wrong)/.test(txt(walk[walk.length - 1].math))) return false;
    if (a.type === 'text') {
      const M = FMG.marking;
      if (M.markText(labels[+a.correct.slice(1)], a).status !== 'correct') return false;
      if (labels.some((l, i) => i !== +a.correct.slice(1) && M.markText(l, a).status === 'correct')) return false;
    }
    return true;
  }

  /* ---------- lesson pieces for the Learn engine (app.js) ---------- */
  function lessonQ(S, r, step, kind) {
    for (let i = 0; i < 40; i++) {
      const eq = kind === 'transfer' && S.transfer ? S.transfer(r, step) : S.gen(r, step);
      const b = body(S, eq, kind || 'procedure');
      if (!b) continue;
      const q = Object.assign({ templateId: S.id + ':lesson', skillId: S.id }, b);
      if (!validateInstance(q)) continue;
      const a = b.answer;
      const task = a.type === 'trace' ? { type: 'trace', letter: a.letter, guide: a.guide }
        : { type: a.type, correct: a.correct, choices: b.choices, choiceKind: b.choiceKind, accept: a.accept, wrong: a.wrong, tolerance: a.tolerance, explain: plain(eq.why || '') };
      return { q: b.prompt, speak: b.speak, visual: b.visual, walk: b._raw.walk, task, hint: b.hints[0].text, key: b._raw.key };
    }
    return null;
  }

  /* ---------- registration ---------- */
  function register(S) {
    const t = CUR.topic(S.topic);
    if (!t) throw new Error('No topic ' + S.topic + ' for ' + S.id);
    const entry = { id: S.id, name: S.name, childName: S.child || S.name, stages: S.stages, status: 'released', prereqs: S.prereqs || [], tiers: [] };
    const i = t.skills.findIndex((k) => k.id === S.id);
    if (i >= 0) t.skills[i] = entry;
    else { const firstPlanned = t.skills.findIndex((k) => k.status !== 'released'); if (firstPlanned < 0) t.skills.push(entry); else t.skills.splice(firstPlanned, 0, entry); }
    FMG.lessons.OBJECTIVES[S.id] = S.obj;
    const names = S.steps || ['Routine', 'Stepping stone', 'Application', 'Stepping stone', 'Stretch', 'Stretch+'];
    LADDER[S.id] = names.map((name) => ({ name }));
    const desc = S.stepsDesc || [];
    FMG.SYLLABUS[S.id] = S.learn || names.map((n, k) => ({ t: desc[k] ? `${n}: ${desc[k]}` : n, l: Math.floor(k / 2) }));
    const reg = (suffix, kind, make, rt) => {
      const id = `${S.id}:${suffix}`;
      T[id] = { version: 1, skillId: S.id, kind, responseType: rt, make, validate: validateInstance };
      (BY[S.id] = BY[S.id] || []).push(id);
    };
    const reason = S.reason || ((r, step) => kitWrap(S.gen(r, step), r));
    const transfer = S.transfer || ((r, step) => S.gen(r, Math.min(5, step + 2)));
    reg('p', 'procedure', (r, level, o) => body(S, S.gen(r, stepOf(level, o)), 'procedure'), S.trace ? 'construct' : 'choice');
    reg('x', 'reasoning', (r, level, o) => body(S, reason(r, stepOf(level, o)), 'reasoning'), 'choice');
    reg('t', 'transfer', (r, level, o) => body(S, transfer(r, stepOf(level, o)), 'transfer'), 'choice');
    // A skill none of whose questions can be typed (or traced) is "choice only": its Secure rule does not ask for typing.
    let typed = !!S.trace;
    for (let st = 0; st < 6 && !typed; st++) for (let k = 0; k < 6 && !typed; k++) { const eq = S.gen(FMG.rng(101 + st * 13 + k), st); if (eq && eq.typable) typed = true; }
    if (!typed) FMG.evidence.CHOICE_ONLY.add(S.id);
    S.choiceOnly = !typed;
  }

  /* ---------- a bank skill: a skill built from one of the existing English banks ({keys, gens}) ----------
     cfg: { order(key) → difficulty, steps: 6 × { use: 'shown'|'heard'|'other'|'typed'|'kit'|'hard', pool: [lo, hi] },
            transfer: RegExp of qt names for the transfer format, mid(eq, key) → the middle walk step, item(key) }. */
  const DEFAULT_STEPS = [
    { use: 'shown', pool: [0, 0.5] }, { use: 'heard', pool: [0, 0.7] }, { use: 'other', pool: [0, 1] },
    { use: 'typed', pool: [0.2, 1] }, { use: 'kit', pool: [0.3, 1] }, { use: 'hard', pool: [0.6, 1] },
  ];
  function bank(src, cfg = {}) {
    const keys = src.keys.slice();
    const order = cfg.order || ((k) => String(k).length);
    const sorted = keys.map((k, i) => ({ k, d: order(k, i) })).sort((a, b) => a.d - b.d).map((x) => x.k);
    // What each generator makes: probe it on several keys.
    const info = src.gens.map((g, gi) => {
      const f = { kit: 0, heard: 0, typed: 0, n: 0, qt: {} };
      for (let k = 0; k < Math.min(keys.length, 24); k++) for (let s = 1; s <= 2; s++) {
        let eq = null; try { eq = g(keys[(k * 7 + gi) % keys.length], FMG.rng(s * 31 + k), 'big'); } catch (e) { eq = null; }
        if (!eq || !eq.options || eq.options.length !== 4) continue;
        f.n++; f.qt[eq.qt] = 1;
        if (/kit$/.test(eq.qt || '')) f.kit++;
        if (eq.hear && !eq.big && !eq.sentence) f.heard++;
        if (eq.typable && !eq.typeOnly) f.typed++;
      }
      return { gi, n: f.n, kit: f.n && f.kit / f.n > 0.5, heard: f.n && f.heard / f.n > 0.5, typed: f.n && f.typed / f.n > 0.5, qts: Object.keys(f.qt) };
    }).filter((x) => x.n > 0);
    const nonKit = info.filter((x) => !x.kit);
    const pick = (list) => list.length ? list : nonKit;
    const sets = {
      shown: pick(nonKit.filter((x) => !x.heard)), heard: pick(nonKit.filter((x) => x.heard)),
      other: nonKit.length > 1 ? nonKit.filter((x) => x.gi !== nonKit[0].gi) : nonKit, typed: pick(nonKit.filter((x) => x.typed)),
      kit: info.filter((x) => x.kit), hard: nonKit,
    };
    const steps = cfg.steps || DEFAULT_STEPS;
    const transferGens = cfg.transfer ? info.filter((x) => x.qts.some((q) => cfg.transfer.test(q))) : [];
    function make(r, gens, pool, extra) {
      const lo = Math.floor(pool[0] * sorted.length), hi = Math.max(lo + 1, Math.ceil(pool[1] * sorted.length));
      const keyPool = sorted.slice(lo, hi);
      for (let i = 0; i < 40; i++) {
        const key = r.pick(keyPool.length ? keyPool : sorted), g = r.pick(gens);
        if (!g) return null;
        let eq = null; try { eq = src.gens[g.gi](key, r, 'big'); } catch (e) { eq = null; }
        if (!eq || !eq.options || eq.options.length !== 4 || eq.typeOnly) continue;
        eq = Object.assign({}, eq, { item: cfg.item ? cfg.item(key) : `${src.id}:${key}`, key, size: sorted.indexOf(key) / sorted.length });
        if (cfg.mid && !eq.walk) { const m = cfg.mid(eq, key); if (m) eq.mid = m; }
        if (extra) Object.assign(eq, extra(eq));
        return eq;
      }
      return null;
    }
    const names = steps.map((st, k) => st.name || ({ shown: 'Choose', heard: sets.heard.some((x) => x.heard) ? 'Hear it' : 'More to choose', other: nonKit.length > 1 ? 'Other ways' : 'All items', typed: sets.typed.some((x) => x.typed) ? 'Type it' : 'Harder ones', kit: 'Kit says', hard: 'Hardest' }[st.use] || ['Routine', 'Stepping stone', 'Application', 'Stepping stone', 'Stretch', 'Stretch+'][k]));
    const desc = steps.map((st) => st.desc || ({ shown: 'the easier items, shown on the screen', heard: sets.heard.some((x) => x.heard) ? 'listen to the word or sentence' : 'more of the easier items', other: nonKit.length > 1 ? 'every item, asked in other ways' : 'every item in the list', typed: sets.typed.some((x) => x.typed) ? 'type the answer (A–D is still there if you need it)' : 'the harder items', kit: 'is Kit right?', hard: 'the hardest items, any kind of question' }[st.use] || ''));
    return {
      info, sets, sorted, names, desc,
      gen(r, step) {
        const st = steps[Math.max(0, Math.min(5, step))];
        if (st.qt) { const gs = info.filter((x) => x.qts.some((q) => st.qt.test(q))); if (gs.length) { const eq = make(r, gs, st.pool, (e) => ({ preferType: (st.use === 'typed' || st.use === 'hard') && !!e.typable })); return st.use === 'kit' && !gs.some((x) => x.kit) ? eq && kitWrap(eq, r) : eq; } }
        if (st.use === 'kit') {
          if (sets.kit.length) return make(r, sets.kit, st.pool);
          const eq = make(r, sets.other.length ? sets.other : nonKit, st.pool); return eq && kitWrap(eq, r);
        }
        const prefer = st.use === 'typed' || st.use === 'hard';
        return make(r, sets[st.use] && sets[st.use].length ? sets[st.use] : nonKit, st.pool, (eq) => ({ preferType: prefer && !!eq.typable }));
      },
      reason(r, step) {
        const pool = steps[Math.max(0, Math.min(5, step))].pool;
        if (sets.kit.length) return make(r, sets.kit, pool);
        const eq = make(r, nonKit, pool); return eq && kitWrap(eq, r);
      },
      transfer: transferGens.length ? (r, step) => make(r, transferGens, steps[Math.max(0, Math.min(5, step))].pool, (eq) => ({ preferType: !!eq.typable })) : null,
    };
  }

  FMG.skillLib = {
    SK, LADDER, opts4, kitWrap, rightOf, walkOf, body, bank, lessonQ, passageBox, plain, txt, uniq, validateInstance,
    add(topic, def) { const S = Object.assign({ topic }, def); SK.push(S); register(S); return S; },
    get(id) { return SK.find((s) => s.id === id); },
    // the app's "I don't understand" asks for a similar example
    example(id, seed, step) { const S = SK.find((s) => s.id === id); return S ? lessonQ(S, FMG.rng(seed), step || 0, 'procedure') : null; },
  };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* Family English — phonics skills (topics 1–4), built from the Little Wandle units in phonics-data.js and the
   107 question shapes in english.js. The six-step ladder chooses the question SHAPE and the WORDS:
     Routine: shown on screen, choose · stepping stone: heard (listen, no word shown) · Application: pictures, odd one out,
     "which is true" · stepping stone: change a sound / fill the gap (typing preferred) · Stretch: "Kit says…" and typed
     spelling · Stretch+: the hardest words of the skill (most sounds, latest units), any shape. */
(function (root) {
  'use strict';
  const FMG = root.FMG, E = FMG.english, P = E.P, L = FMG.skillLib, esc = FMG.esc;
  const U = (ids) => ids.map((id) => E.unit(id));
  const range = (a, b) => P.UNITS.slice(E.uIndex[a], E.uIndex[b] + 1);
  const show = E.show;
  const POOLS = [[0, 0.45], [0, 0.6], [0, 1], [0.15, 1], [0.3, 1], [0.65, 1]];
  const slice = (arr, step) => { const [lo, hi] = POOLS[step]; const a = Math.floor(lo * arr.length), b = Math.max(a + 1, Math.ceil(hi * arr.length)); return arr.slice(a, b); };
  const ok4 = (q) => q && q.options && q.options.length === 4 && new Set(q.options.map((o) => o.value)).size === 4;
  /* Call a shape. 'q:<qt>' asks the original generator again until it makes that shape. */
  function shape(table, key, args, rng, viaFn) {
    if (key.startsWith('q:')) { const want = key.slice(2); for (let i = 0; i < 8; i++) { const q = viaFn(...args, rng, 'big'); if (q && q.qt === want) return q; } return null; }
    const f = table[key]; if (!f) return null;
    try { return f(...args, rng, 'big'); } catch (e) { return null; }
  }
  const soundsMid = (w, uid) => ({ do: 'Say each sound, then push them together', math: `${esc(w)}: ${esc(E.segStr(E.split(w, uid)))}`, why: 'Letters that make one sound together (like sh or igh) count as one sound.' });

  /* ================= Words: blending and segmenting (topic 2) ================= */
  const WORD_STEPS = [
    ['blend', 'segment', 'first_show', 'last_show', 'sounds_show', 'vowel_show', 'q:readpic'],
    ['first_heard', 'last_heard', 'middle_heard', 'sounds_heard', 'beats_heard', 'vowel_heard', 'read_heard', 'rhyme_heard', 'q:spell'],
    ['first_pic', 'last_pic', 'sounds_pic', 'rhyme_pic', 'picspell', 'first_rev', 'last_rev', 'sounds_rev', 'vowel_rev', 'first_nrev', 'vowel_nrev', 'rhymeodd', 'first_true', 'vowel_true', 'rhyme_true', 'q:picword', 'q:rhyme'],
    ['swap', 'swap_last', 'swap_mid', 'addsound', 'takeaway', 'missing', 'q:spell'],
    ['first_kit', 'last_kit', 'sounds_kit', 'vowel_kit', 'seg_kit', 'rhyme_kit', 'spell_kit', 'q:spell'],
    ['first_pic', 'sounds_rev', 'vowel_nrev', 'swap', 'missing', 'seg_kit', 'spell_kit', 'q:spell', 'segment', 'blend'],
  ];
  const KIT_WORD = ['first_kit', 'last_kit', 'sounds_kit', 'vowel_kit', 'seg_kit', 'rhyme_kit', 'spell_kit'];
  function wordSkill(topic, def, unitIds) {
    const units = unitIds;
    const items = units.flatMap((u) => E.wordsOf(u).map((w) => ({ u, w, d: E.split(w, u.id).length * 2 + w.length + E.uIndex[u.id] * 0.4 }))).sort((a, b) => a.d - b.d);
    const sentences = P.SENTENCES.map((s, i) => ({ s, i })).filter((x) => units.some((u) => u.id === x.s.u));
    const wordOf = (val) => items.find((x) => x.w === val);
    function make(r, step, fmts, prefer) {
      const pool = slice(items, step);
      for (let k = 0; k < 60; k++) {
        const it = r.pick(pool), f = r.pick(fmts);
        const q = shape(E.XW, f, [it.u, it.w], r, E.qWord);
        if (!ok4(q)) continue;
        const right = String(q.options[q.answerIndex].value), mw = wordOf(right) || it;
        return Object.assign({}, q, { item: `w:${it.u.id}:${it.w}`, size: it.d, mid: soundsMid(mw.w, mw.u.id), preferType: !!(prefer && q.typable) });
      }
      return null;
    }
    return L.add(topic, Object.assign({
      steps: ['Read it', 'Hear it', 'Pictures and more', 'Change a sound', 'Kit says', 'Hardest words'],
      stepsDesc: ['the word is on the screen; choose the answer', 'listen to the word (it is not shown)', 'pictures, “which word…?”, odd one out', 'swap, add or take away a sound; fill the missing letters', 'is Kit right? Plus typed spelling', 'the longest words of these units, any kind of question'],
      method: ['Say each sound in the word', 'Push the sounds together to read it (blending)', 'Split a word into its sounds to spell it (segmenting)', 'Letters that make one sound together stay together'],
      mistake: { wrong: 'Counting every letter as a sound: ship = s, h, i, p (4)', fix: 'sh is one sound, so ship has 3 sounds: sh – i – p.' },
      spelling: true, tool: 'soundmat',
      gen: (r, step) => make(r, step, WORD_STEPS[step], step >= 3),
      reason: (r, step) => make(r, Math.max(1, step), KIT_WORD, false),
      transfer: sentences.length ? (r, step) => {
        for (let k = 0; k < 30; k++) {
          const x = r.pick(sentences), f = r.pick(['fill', 'heard', 'order', 'q:sentence']);
          const q = shape(E.XS, f, [x.i], r, E.qSentence);
          if (ok4(q)) return Object.assign({}, q, { item: `s:${x.i}`, mid: { do: 'Read the whole sentence, sound by sound where you need to', math: `“${esc(x.s.s)}”`, why: 'The same sounds you blend in single words work inside sentences.' } });
        }
        return null;
      } : null,
    }, def));
  }

  /* ================= Graphemes: letters and sounds (topic 1) ================= */
  const G_STEPS = [['q:gap', 'q:has'], ['gstart', 'gend', 'gmid', 'gap_heard'], ['gpic', 'godd', 'has_true'], ['q:gap', 'gap_heard', 'gstart', 'gend'], ['has_kit'], ['q:gap', 'gap_heard', 'gpic', 'godd', 'has_kit', 'gstart']];
  function graphemeSkill(topic, def, unitIds) {
    const items = unitIds.flatMap((u) => u.gr.map((g, i) => ({ u, g, d: E.uIndex[u.id] * 10 + i })));
    const gMid = (g) => { const ex = P.G[g][0]; return { do: 'Find the sound in a word you know', math: `${esc(show(g))} as in ${esc(ex)}: ${esc(E.segStr(E.split(ex, 'u21')))}`, why: `Say it as a pure sound (“${esc(P.G[g][2])}”), not “${esc(show(g))}-uh”.` }; };
    function make(r, step, fmts, prefer) {
      const pool = slice(items, step);
      for (let k = 0; k < 60; k++) {
        const it = r.pick(pool), f = r.pick(fmts);
        const q = shape(E.XG, f, [it.u, it.g], r, E.qGrapheme);
        if (!ok4(q)) continue;
        return Object.assign({}, q, { item: `g:${it.u.id}:${it.g}`, size: it.d, mid: gMid(it.g), snd: it.g, sndEx: P.G[it.g][0], preferType: !!(prefer && q.typable) });
      }
      return null;
    }
    return L.add(topic, Object.assign({
      steps: ['See the sound', 'Hear the sound', 'Pictures and odd one out', 'Type the letters', 'Kit says', 'Newest sounds mixed'],
      stepsDesc: ['the letters are on the screen', 'listen for the sound at the start, middle or end of a word', 'pictures, odd one out, which is true', 'type the missing letters', '“the word has…”: is Kit right?', 'the newest sounds of these units, any kind of question'],
      method: ['Look at the letters', 'Say the pure sound they make', 'Listen for it in words: at the start, in the middle or at the end'],
      mistake: { wrong: 'Saying “muh” for m', fix: 'Say a pure sound: “mmm”, with no “uh” on the end.' },
      spelling: true, tool: 'soundmat',
      gen: (r, step) => make(r, step, G_STEPS[step], step === 3 || step === 5),
      reason: (r, step) => make(r, step, ['has_kit'], false),
      transfer: (r, step) => {
        const pool = slice(items, step);
        for (let k = 0; k < 40; k++) {
          const it = r.pick(pool);
          const ws = E.allWords().filter((x) => E.uIndex[x.u] <= E.uIndex[it.u.id] && E.split(x.w, x.u).includes(it.g));
          if (!ws.length) continue;
          const x = r.pick(ws), u = E.unit(x.u);
          const q = shape(E.XW, r.pick(['q:spell', 'picspell', 'read_heard']), [u, x.w], r, E.qWord);
          if (ok4(q)) return Object.assign({}, q, { item: `w:${u.id}:${x.w}`, mid: soundsMid(x.w, u.id), preferType: !!q.typable });
        }
        return null;
      },
    }, def));
  }

  /* ================= Letter names, shapes and capitals (topic 1) ================= */
  function lettersSkill() {
    const items = range('u01', 'u07').flatMap((u) => u.gr.filter((g) => g.length === 1).map((g, i) => ({ u, g, d: E.uIndex[u.id] * 10 + i })));
    const STEPS = [['capital'], ['lookalike'], ['small'], ['abc'], null, ['capital', 'small', 'abc', 'lookalike']];
    const mid = (g) => ({ do: 'Look at the shape of the letter', math: `small ${esc(g)} · capital ${esc(g.toUpperCase())}`, why: 'A small letter and its capital make the same sound. Some letters look alike (b and d), so look carefully.' });
    function make(r, step, fmts) {
      const pool = step === 5 ? items : slice(items, step);
      for (let k = 0; k < 60; k++) {
        const it = r.pick(pool), q = shape(E.XG, r.pick(fmts), [it.u, it.g], r, null);
        if (ok4(q)) return Object.assign({}, q, { item: `g:${it.u.id}:${it.g}`, size: it.d, mid: mid(it.g) });
      }
      return null;
    }
    return L.add('letters-sounds', {
      id: 'ph-letters', name: 'Letter shapes, capitals and the alphabet', child: 'Letters and capitals', stages: ['eyfs', 'ks1'],
      obj: 'Match small letters and capitals, tell look-alike letters apart and know alphabet order.',
      bigIdea: 'Every letter has a small shape and a capital shape; both make the same sound.',
      method: ['Look at the whole shape: tall, round, or with a tail', 'Match the small letter to its capital', 'Say the alphabet to find what comes next'],
      mistake: { wrong: 'Mixing up b and d', fix: 'b: the bat comes first, then the ball. d: the drum (round) comes first, then the stick.' },
      steps: ['Capitals', 'Find the letter', 'Small letters', 'Alphabet order', 'Kit says', 'All letters mixed'],
      stepsDesc: ['find the capital for a small letter', 'find the letter that makes the sound you hear', 'find the small letter for a capital', 'which letter comes next', 'is Kit right?', 'every letter, every kind of question'],
      tool: 'soundmat',
      gen: (r, step) => (step === 4 ? L.kitWrap(make(r, 2, ['capital', 'small', 'abc']), r) : make(r, step, STEPS[step])),
      reason: (r, step) => L.kitWrap(make(r, Math.min(step, 3), ['capital', 'small', 'abc']), r),
      transfer: (r, step) => make(r, step, ['gstart', 'gend']),
    });
  }

  /* ================= Tricky words (topic 3) ================= */
  const T_STEPS = [['ttrue', 'tletters', 'twrong'], ['tfind', 'q:tricky', 'tfirstl', 'tlast'], ['tabc', 'tsent', 'twrong', 'ttrue'], ['tgap', 'tletters'], ['tkit'], ['q:tricky', 'tgap', 'tkit', 'tsent', 'twrong']];
  function trickySkill(topic, def, unitIds) {
    const items = unitIds.flatMap((u) => E.trickyOf(u).map((t, i) => ({ u, t, d: E.uIndex[u.id] * 10 + t.length })));
    const mid = (t) => ({ do: 'Spell it letter by letter', math: `${esc(t)}: ${esc(t.split('').join(' '))}`, why: 'Tricky words have a part that does not match the sounds you know, so we learn that part by heart.' });
    function make(r, step, fmts, prefer) {
      const pool = slice(items, step);
      for (let k = 0; k < 60; k++) {
        const it = r.pick(pool), q = shape(E.XT, r.pick(fmts), [it.u, it.t], r, E.qTricky);
        if (ok4(q)) return Object.assign({}, q, { item: `t:${it.u.id}:${it.t}`, size: it.d, mid: mid(it.t), preferType: !!(prefer && q.typable) });
      }
      return null;
    }
    return L.add(topic, Object.assign({
      steps: ['Read it', 'Hear it', 'Find and order', 'Fill the gap', 'Kit says', 'Spell it'],
      stepsDesc: ['the word is on the screen', 'listen and find the word', 'alphabetical order, sentences, spot the mistake', 'the missing letter', '“Kit wrote…”: is it spelt right?', 'listen and spell the word'],
      method: ['Read the word', 'Find the tricky part (the part that does not sound as you expect)', 'Say the letters in order, then write it from memory'],
      mistake: { wrong: 'Spelling said as “sed”', fix: 'said has the tricky part “ai” for the e sound: s – ai – d.' },
      spelling: true,
      gen: (r, step) => make(r, step, T_STEPS[step], step >= 3),
      reason: (r, step) => make(r, step, ['tkit'], false),
      transfer: (r, step) => make(r, step, ['tsent', 'q:tricky', 'tabc'], true),
    }, def));
  }

  /* ================= Sentences (topic 4) ================= */
  function sentenceSkill() {
    const items = P.SENTENCES.map((s, i) => ({ s, i, d: E.uIndex[s.u] * 3 + s.s.split(' ').length }));
    items.sort((a, b) => a.d - b.d);
    const STEPS = [['q:sentence', 'words'], ['heard', 'fill'], ['order', 'end', 'caps'], ['words', 'fill'], ['caps_kit'], ['q:sentence', 'order', 'fill', 'caps_kit', 'heard']];
    function make(r, step, fmts, prefer) {
      const pool = slice(items, step);
      for (let k = 0; k < 60; k++) {
        const it = r.pick(pool), q = shape(E.XS, r.pick(fmts), [it.i], r, E.qSentence);
        if (ok4(q)) return Object.assign({}, q, { item: `s:${it.i}`, size: it.d, preferType: !!(prefer && q.typable),
          mid: { do: 'Read the sentence, pointing to each word', math: `“${esc(it.s.s)}”`, why: 'Read every word: little words like “on” and “in” change the meaning.' } });
      }
      return null;
    }
    return L.add('fluency', {
      id: 'fl-sent', name: 'Read and understand sentences', child: 'Reading sentences', stages: ['eyfs', 'ks1'],
      obj: 'Read short sentences made of taught sounds and tricky words, and show you understand them.',
      bigIdea: 'A sentence is a group of words that makes sense; read every word, then think about what it means.',
      method: ['Read each word: blend the ones you need to', 'Read the whole sentence again smoothly', 'Think: who, what, where?', 'A sentence starts with a capital letter and ends with a full stop'],
      mistake: { wrong: 'Guessing a word from its first letter', fix: 'Blend all the way through the word, then check the sentence makes sense.' },
      steps: ['Read and answer', 'Listen', 'Order and punctuate', 'Count and fill', 'Kit says', 'Longest sentences'],
      stepsDesc: ['read the sentence and answer a question about it', 'listen to the sentence', 'which order makes sense; capital letters and full stops', 'how many words; the missing word', '“Kit wrote…”: is it written the right way?', 'the longest sentences, any kind of question'],
      gen: (r, step) => make(r, step, STEPS[step], step === 3 || step === 5),
      reason: (r, step) => make(r, step, ['caps_kit'], false),
    });
  }

  /* ================= Real and alien words (topic 2, phonics check) ================= */
  function alienSkill() {
    const PH = [['p2'], ['p2', 'p3'], ['p3'], ['p4'], ['p5'], ['p4', 'p5']];
    const make = (r, step) => {
      for (let k = 0; k < 30; k++) {
        const sid = r.pick(PH[step]), n = P.ALIEN[sid].split(' ').length, i = r.int(0, n - 1);
        const q = E.qAlien(sid, i, r);
        if (ok4(q)) return Object.assign({}, q, { size: step * 10 + i / n, mid: { do: 'Read every word with your sounds', math: q.options.map((o) => esc(E.segStr(E.split(o.value, 'u21')))).join(' · '), why: 'All of them can be read with phonics. A real word means something; an alien word does not.' } });
      }
      return null;
    };
    return L.add('blending', {
      id: 'ph-alien', name: 'Real and alien words (phonics check)', child: 'Alien words', stages: ['ks1'], prereqs: ['bl-p4'],
      obj: 'Read real and made-up (alien) words with phonics, as in the Year 1 phonics screening check.',
      bigIdea: 'If you can say the sounds and blend them, you can read any word, even a made-up one.',
      method: ['Say each sound', 'Blend the sounds into a word', 'Ask: does it mean something? Then it is real'],
      mistake: { wrong: 'Turning an alien word into a real word (reading “vap” as “van”)', fix: 'Read exactly the sounds that are there: v – a – p.' },
      steps: ['Phase 2', 'Phases 2–3', 'Phase 3', 'Phase 4', 'Phase 5', 'Phases 4–5 mixed'], stepsDesc: ['first sounds', 'adding digraphs', 'digraphs and trigraphs', 'sounds next to each other (blan, strom)', 'new spellings (blay, phid)', 'the hardest mix, like section 2 of the check'],
      gen: make,
      transfer: (r, step) => {
        const sid = ['p2', 'p2', 'p3', 'p4', 'p5', 'p5'][step];
        const us = E.stageUnits(sid).filter((u) => E.wordsOf(u).length);
        for (let k = 0; k < 30; k++) { const u = r.pick(us), w = r.pick(E.wordsOf(u)), q = shape(E.XW, 'blend', [u, w], r, null); if (ok4(q)) return Object.assign({}, q, { item: `w:${u.id}:${w}`, mid: soundsMid(w, u.id) }); }
        return null;
      },
    });
  }

  /* ================= Register ================= */
  const g = (id, name, child, stages, obj, bigIdea, ids, prereqs) => graphemeSkill('letters-sounds', { id, name, child, stages, obj, bigIdea, prereqs: prereqs || [] }, U(ids));
  lettersSkill();
  g('ph-p2a', 'Phase 2 sounds: s a t p … h b f l', 'First sounds', ['eyfs'], 'Know the first 20 sounds and the letters that spell them.', 'Each sound has a letter (or two) that spells it: s says “sss”.', ['u01', 'u02', 'u03', 'u04', 'u05']);
  g('ph-p2b', 'Phase 2 sounds: ff ll ss j … sh th ng nk', 'More first sounds', ['eyfs'], 'Know the rest of Phase 2, including the first digraphs: two letters, one sound.', 'Two letters can make one sound: s + h = sh.', ['u06', 'u07', 'u08', 'u09'], ['ph-p2a']);
  g('ph-p3', 'Phase 3 sounds: ai ee igh oa … air er', 'Digraphs and trigraphs', ['eyfs'], 'Know the Phase 3 digraphs and trigraphs.', 'Two or three letters can make one sound: i + g + h = igh.', ['u11', 'u12', 'u13', 'u14'], ['ph-p2b']);
  g('ph-p5', 'Phase 5 sounds: ay ou ie ea … au ey', 'New ways to spell sounds', ['ks1'], 'Know the Phase 5 graphemes: new ways to spell sounds you already know.', 'A sound can be spelt in more than one way: ai and ay both say “ay”.', ['u18', 'u19', 'u20'], ['ph-p3']);
  g('ph-split', 'Split digraphs a-e e-e i-e o-e u-e', 'Magic e', ['ks1'], 'Read and spell words with split digraphs.', 'Two letters can make one sound even when another letter sits between them: c-a-k-e, a…e says “ay”.', ['u21'], ['ph-p5']);
  const w = (id, name, child, stages, obj, ids, prereqs) => wordSkill('blending', { id, name, child, stages, obj, bigIdea: 'To read, push the sounds together. To spell, pull the word apart into its sounds.', prereqs: prereqs || [] }, U(ids));
  w('bl-p2', 'Blend and segment Phase 2 words', 'Reading sat, ship, cats', ['eyfs'], 'Blend and segment short words made of Phase 2 sounds.', ['u01', 'u02', 'u03', 'u04', 'u05', 'u06', 'u07', 'u08', 'u09', 'u10'], ['ph-p2a']);
  w('bl-p3', 'Blend and segment Phase 3 words', 'Reading rain, moon, chair', ['eyfs'], 'Read and spell words with Phase 3 digraphs and trigraphs.', ['u11', 'u12', 'u13', 'u14'], ['bl-p2']);
  w('bl-p4', 'Words like tent, frog and train (Phase 4)', 'Reading frog and tent', ['eyfs', 'ks1'], 'Blend and segment words with sounds next to each other (adjacent consonants).', ['u15', 'u16', 'u17'], ['bl-p3']);
  w('bl-p5', 'Blend and segment Phase 5 words', 'Reading day, bird, cake', ['ks1'], 'Read and spell words with Phase 5 graphemes and split digraphs.', ['u18', 'u19', 'u20', 'u21'], ['bl-p4']);
  alienSkill();
  const t = (id, name, child, stages, ids, prereqs) => trickySkill('tricky-words', { id, name, child, stages, obj: `Read and spell the tricky words of ${name.replace('Tricky words, ', '')}.`, bigIdea: 'Most of a tricky word follows the sounds you know; one part is tricky, so learn that part by heart.', prereqs: prereqs || [] }, U(ids));
  t('tr-p2', 'Tricky words, Phase 2', 'First tricky words', ['eyfs'], ['u03', 'u06', 'u07', 'u08']);
  t('tr-p34', 'Tricky words, Phases 3–4', 'More tricky words', ['eyfs'], ['u11', 'u12', 'u13', 'u15', 'u16', 'u17'], ['tr-p2']);
  t('tr-p5', 'Tricky words, Phase 5', 'Year 1 tricky words', ['ks1'], ['u18', 'u19', 'u20', 'u21', 'u22'], ['tr-p34']);
  sentenceSkill();
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* Family English — spelling, grammar, punctuation and vocabulary skills (topics 3, 7 and 11–17), built from the
   34 KS1–KS2 skills in spag.js. Each becomes a released skill with the framework's six-step ladder:
     Routine: easier items, shown, choose · stepping stone: listen (spelling) or more easy items · Application: every
     item, other question shapes · stepping stone: type it where typing makes sense · Stretch: "Kit says…" ·
     Stretch+: the hardest items (longest words, latest in the list), typing preferred.
   Spelling skills never allow slips when typing; vocabulary skills allow one small slip. */
(function (root) {
  'use strict';
  const FMG = root.FMG, G = FMG.spag, S = FMG.SPAG, L = FMG.skillLib, esc = FMG.esc;

  function spagSkill(srcId, topic, def, cfg = {}) {
    const src = G.skill(srcId);
    if (!src) throw new Error('No spag skill ' + srcId);
    const b = L.bank({ id: srcId, keys: src.keys, gens: src.gens }, Object.assign({
      item: (k) => `k:${srcId}:${k}`,
      mid: def.ruleOf ? (eq, k) => ({ do: 'Use the rule', math: esc(def.ruleOf(k, eq)), why: esc(def.method[1] || def.bigIdea) }) : (eq) => ({ do: 'Think about the rule', math: esc(def.bigIdea), why: esc(def.method[1] || def.obj) }),
    }, cfg));
    return L.add(topic, Object.assign({
      steps: b.names, stepsDesc: b.desc,
      gen: b.gen, reason: b.reason, transfer: b.transfer || undefined,
    }, def));
  }
  const tail = (w) => (/e$/.test(w) ? 'it ends in e' : /[^aeiou]y$/.test(w) ? 'it ends in a consonant then y' : /[aeiou][^aeiouwxy]$/.test(w) && w.length <= 4 ? 'short vowel, one consonant' : 'no change needed');
  const suffixRule = (sfx) => (k) => `${k} + ${sfx}: ${tail(k)}`;
  const sfxMethod = ['Find the root word', 'Look at how it ends: a final e? consonant + y? a short vowel and one consonant?', 'Drop the e, change y to i, double the last letter, or just add the ending'];

  // ---------- Topic 12: prefixes, suffixes and word families ----------
  spagSkill('ing', 'affixes', { id: 'gps-ing', name: 'Adding -ing', child: 'Adding -ing', stages: ['ks1'], spelling: true,
    obj: 'Add -ing to verbs, using the rules for dropping e and doubling.', bigIdea: 'Add -ing to a verb. Sometimes the root changes first: make → making (drop the e), hop → hopping (double the letter).',
    method: sfxMethod, mistake: { wrong: 'hop + ing = hoping', fix: 'hop has a short vowel and one consonant, so double the p: hopping. (hoping comes from hope.)' }, ruleOf: suffixRule('ing') }, { transfer: /-root$/ });
  spagSkill('ed', 'affixes', { id: 'gps-ed', name: 'Adding -ed (past tense)', child: 'Adding -ed', stages: ['ks1'], spelling: true,
    obj: 'Add -ed to regular verbs to make the past tense, using the spelling rules.', bigIdea: '-ed shows it already happened. The same rules apply: drop the e (baked), double (hopped), y to i (cried).',
    method: sfxMethod, mistake: { wrong: 'cry + ed = cryed', fix: 'cry ends in a consonant then y, so change y to i: cried.' }, ruleOf: suffixRule('ed') }, { transfer: /-root$/ });

  <script>
/* Family English — reading for meaning (topics 5–10). The 12 original passages (spag-data.js, more-texts.js) and the
   five GCSE Language extracts (gcse-data.js) become skills by question kind. The text is always on screen above the
   question. The ladder climbs through harder texts:
     Routine: Year 1–2 texts · stepping stone: Year 1–2 and 3–4 · Application: Year 3–4 · stepping stone: Year 3–4 and 5–6 ·
     Stretch: Year 5–6 · Stretch+: Year 5–6 and GCSE extracts (where the kind of question exists there).
   "Kit says…" is the reasoning question; the transfer question uses a different kind of text (poem, play script, letter,
   information) from the stories most questions use. Reading answers are phrases, so they are A–D only. */
(function (root) {
  'use strict';
  const FMG = root.FMG, L = FMG.skillLib, esc = FMG.esc;
  const PS = FMG.SPAG.PASSAGES, X = FMG.GCSE.EXTRACTS;
  const LEVELS = ['Year 1–2', 'Year 3–4', 'Year 5–6', 'GCSE'];
  const STEP_LEVELS = [[0], [0, 1], [1], [1, 2], [2], [2, 3]];
  const STOP = new Set('the and that this with from they them their there what when where which while have were your into than then very some does about would could should because after before every’s'.split(' '));
  const words = (s) => String(s).toLowerCase().replace(/[^a-z’'\s-]/g, ' ').split(/\s+/).filter((w) => w.length >= 3 && !STOP.has(w));
  /* The sentence of the text that best matches the question and its answer: "look back at the text". */
  function bestSentence(text, q, a) {
    const sents = String(text).replace(/ \/ /g, '. ').split(/(?<=[.!?”])\s+|\n\n+/).map((x) => x.trim()).filter((x) => x.length > 3);
    const aw = new Set(words(a)), qw = new Set(words(q));
    let best = sents[0], score = -1;
    for (const s of sents) { const w = words(s); const sc = w.filter((x) => aw.has(x)).length * 2 + w.filter((x) => qw.has(x)).length; if (sc > score) { score = sc; best = s; } }
    return best.length > 240 ? best.slice(0, 237) + '…' : best;
  }
  const MID = {
    retrieval: ['Find the place in the text', 'The answer is written in the text: find the words from the question, then read around them.'],
    sequence: ['Find each event in the text', 'Put the events in the order the text tells them.'],
    inference: ['Look for clues in the text', 'The text does not say it straight out: put the clues together like a detective.'],
    vocabulary: ['Read the words around it', 'The rest of the sentence tells you what the word means here.'],
    'author’s language': ['Look closely at the writer’s words', 'Ask what picture or feeling the words create.'],
    'author’s choice': ['Ask why the writer chose this', 'Writers choose words and layout on purpose, to make the reader think or feel something.'],
    'text type': ['Look at how the text is set out', 'Stories, information, letters, poems and play scripts each have their own features.'],
    'fact and opinion': ['Ask: can this be checked?', 'A fact can be proved; an opinion is what someone thinks or feels.'],
  };
  /* All questions, tagged with level, kind and passage. */
  const BANK = [];
  PS.forEach((p) => p.qs.forEach(([q, a, w, kind], i) => BANK.push({ lv: LEVELS.indexOf(p.level), kind, q, a, w, i, p: { id: p.id, title: p.title, kind: p.kind, level: p.level, text: p.text } })));
  X.filter((x) => x.paper === 1).forEach((x) => (x.q1 || []).forEach(([q, a, w], i) => BANK.push({ lv: 3, kind: 'retrieval', q, a, w, i, p: { id: x.id, title: x.title, kind: x.kind, level: 'GCSE Language Paper 1', text: x.text } })));

  function eqOf(it, r) {
    const o = L.opts4(r, it.a, it.w); if (!o) return null;
    const [d, why] = MID[it.kind] || MID.retrieval;
    return Object.assign({ qt: `read-${it.kind.replace(/\W+/g, '')}`, item: `r:${it.p.id}:${it.i}`, prompt: it.q, speak: it.q, passage: it.p, size: it.lv * 10 + it.i,
      why: `${it.kind[0].toUpperCase() + it.kind.slice(1)} question. The answer is: ${it.a}.`,
      mid: { do: d, math: `“${esc(bestSentence(it.p.text, it.q, it.a))}”`, why } }, o);
  }
  function pickFrom(r, kinds, step, filter) {
    const want = STEP_LEVELS[step];
    let pool = BANK.filter((x) => kinds.includes(x.kind) && want.includes(x.lv) && (!filter || filter(x)));
    // nearest level that has this kind of question
    for (let d = 1; !pool.length && d < 4; d++) pool = BANK.filter((x) => kinds.includes(x.kind) && want.some((l) => Math.abs(x.lv - l) === d) && (!filter || filter(x)));
    if (!pool.length) pool = BANK.filter((x) => kinds.includes(x.kind));
    for (let k = 0; k < 20; k++) { const e = eqOf(r.pick(pool), r); if (e) return e; }
    return null;
  }

  /* SVG pointer position in viewBox units */
  function svgPt(svg, e) {

  /* Drag with pointer capture on a persistent element. h: { down(pt,e) -> false to ignore, move(pt,e), up(e) } */
  function dragger(el, h, toPt) {
    const P = toPt || ((e) => svgPt(el, e));
    let id = null;
    el.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      if (h.down && h.down(P(e), e) === false) return;

  <script>
/* Family English — the English screens kept from Family English v1, now inside the Family Maths shell:
   - #/exams                         the Exams screen (a simple hub by stage; the full hub is design phase 5)

   - #/read, #/read/<id>             reading comprehension with the text above the questions
   - #/xmix/<y2|y34|y56|ks3>         mixed practice rounds (KS1, KS2, KS3)

(function (root) {

  const LET = ['A', 'B', 'C', 'D'];
  function record(rec) {
    const p = A().profile();
    saved(store().commit((d) => { d.exams = Array.isArray(d.exams) ? d.exams : []; d.exams.push(Object.assign({ id: FMG.uid('x'), profileId: p.id, date: FMG.today(), at: Date.now() }, rec)); if (d.exams.length > 600) d.exams = d.exams.slice(-600); }));

  const shell = (inner, o) => A().shell(inner, o);
  const bar = (pct) => `<div class="bar" style="margin-top:.3rem"><span style="width:${pct}%"></span></div>`;

  /* ---------- A round of questions from the v1 banks: A–D, with Type it where the question can be typed ---------- */
  function qHtml(q, typing) {
    const big = q.sentence ? `<p class="en-sentence">${esc(q.sentence)}</p>` : q.big ? `<div class="en-big">${esc(q.big)}</div>` : '';
    return `<div class="qcard">
      ${q.pic ? `<div class="en-pic" aria-hidden="true">${q.pic}</div>` : ''}${big}
      <div class="prompt">${esc(q.prompt)}</div>
      <div class="row center">${q.hear ? `<button class="btn sm ghost" data-hear="${esc(q.hear)}">🔊 Hear it</button>` : ''}<button class="btn sm ghost" data-hear="${esc(q.speak || q.prompt)}">🗣️ Read it to me</button></div>

  /* o: { qs | next(), label, back, mode, onEnd(results), above(), bind(draw), after(ok) } */
  function runRound(o) {

        <div class="next-row"><button class="btn primary big" id="next" hidden>${o.qs && S.i === o.qs.length - 1 ? 'See how I did' : 'Next question'}</button></div></div>`, { back: o.back, title: o.title || '', cls: 'focus' });
      if (o.bind) o.bind(draw);
      $$('[data-am]').forEach((b) => (b.onclick = () => { S.typeMode = b.dataset.am === 'type'; draw(q); }));
      if (q.hear) setTimeout(() => sayIfOn(q.speak || q.hear), 250); else if (band() !== 'big') setTimeout(() => sayIfOn(q.speak || q.prompt), 250);
      let answered = false;
      const done = (ok, given, idx, msg) => {

  /* Long answers: write, then mark against the level bands (self or parent). Drafts are kept on this device. */

  /* ---------- Flashcards (Early Years, kept as they were) ---------- */
  function cardsHome() {

        <div class="row center flnav"><button class="btn big ghost" id="prev" ${i ? '' : 'disabled'} aria-label="Previous card">‹</button><span class="muted">${i + 1} / ${set.cards.length}</span><button class="btn big primary" id="nx" aria-label="Next card">${i < set.cards.length - 1 ? '›' : '↺'}</button></div>`, { back: '#/cards', title: set.name, cls: 'focus' });

      $('#prev').onclick = () => { i--; draw(); }; $('#nx').onclick = () => { i = (i + 1) % set.cards.length; draw(); };

    const te = (e) => { if (sx == null || !$('.flash')) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) { const b = dx < 0 ? $('#nx') : $('#prev'); if (b && !b.disabled) b.click(); } };

  R(/^#\/find\/(\w+)$/, (cid) => {

        <div class="findgrid">${pick.map((c, k) => `<button class="findc" data-k="${k}" aria-label="${esc(c[0])}">${c[1]}</button>`).join('')}</div>
        <p class="center muted">${score} ⭐</p>`, { back: '#/cards', title: 'Find it', cls: 'focus' });
      say(`Where is the ${target[0]}?`);
      $$('[data-k]').forEach((b) => (b.onclick = () => {
        const c = pick[+b.dataset.k];
        if (c === target) { score++; b.classList.add('right'); say(rng1(['Yes! The ' + c[0] + '!', 'Well done! ' + c[0] + '!', 'Clever! That is the ' + c[0] + '.'])); setTimeout(draw, 1800); }
        else { b.classList.add('nope'); say(`That is the ${c[0]}. Where is the ${target[0]}?`); setTimeout(() => b.classList.remove('nope'), 700); }

  /* ---------- Parent area: voice and recorded sounds ---------- */

        <div class="recs">${all.map((g) => `<div class="rec"><b>${esc(E.show(g))}</b><small>${esc(P.G[g][2])} · ${esc(P.G[g][0])}</small><span>${SND && SND.has(g) ? `<button class="btn sm ghost" data-play="${esc(g)}" aria-label="Play ${esc(E.show(g))}">▶</button><button class="btn sm ghost" data-del="${esc(g)}" aria-label="Delete ${esc(E.show(g))}">🗑</button>` : ''}<button class="btn sm rec-b" data-rec="${esc(g)}" aria-label="Record ${esc(E.show(g))}" ${SND && SND.canRecord() ? '' : 'disabled'}>●</button></span></div>`).join('')}</div></section>

  <script>
/* Exam ladder for one skill: #/exams/ladder/<skillId> (the "Exam questions" mode on a skill page).
   The same idea as Family Maths: climb through the real tests — Phonics check → KS1 → KS2 SATs → 11+ → KS3 → GCSE.
   A skill's ladder follows its learning strand (e.g. -ing → -ed → -er → -est → suffixes → prefixes), keeping the stages
   where that strand is actually tested. Rungs the skill has no questions for are greyed out, and the level is always shown.
   3 full-mark answers in a row moves up a rung; 2 misses in a row moves back down. Questions are the skills' own
   questions at the rung's difficulty, asked exam-style: typed first where typing makes sense, one try plus a retry,
   marks shown. Progress is remembered per learner and skill on this device. Full papers (phonics check, SATs-style
   paper, GCSE papers) are linked from the rung. Exam answers are not used for Secure (only Check and Review are). */
(function (root) {
  'use strict';
  const FMG = (root.FMG = root.FMG || {});
  if (typeof document === 'undefined') return;
  const CUR = FMG.curriculum, esc = FMG.esc;
  const A = () => FMG.app;

  const STRANDS = [
    ['ph-letters', 'ph-p2a', 'ph-p2b', 'ph-p3', 'ph-p5', 'ph-split'],
    ['bl-p2', 'bl-p3', 'bl-p4', 'bl-p5', 'ph-alien'],
    ['tr-p2', 'tr-p34', 'tr-p5', 'gps-common2'],
    ['gps-ing', 'gps-ed', 'gps-er', 'gps-est', 'gps-suffix', 'gps-prefix'],
    ['gps-plural', 'gps-tion'],
    ['gps-homo2', 'gps-homo4'], ['gps-y34list', 'gps-y56list'],
    ['gps-class2', 'gps-class4', 'gps-class6'], ['gps-article'], ['gps-pronoun'],
    ['gps-types', 'gps-conj', 'gps-relative', 'ks3-sentforms'], ['gps-standard'],
    ['gps-past', 'gps-tense', 'gps-tense6', 'gps-modal', 'gps-voice'],
    ['gps-caps', 'gps-contract', 'gps-apos', 'gps-speech', 'gps-fronted', 'ks3-punct'],
    ['gps-ant', 'gps-syn', 'ks3-vocab'], ['rd-vocab', 'ks3-vocab'],
    ['rd-language', 'ks3-devices', 'ks3-structure'],
    ['ks3-poetry', 'lit-poems'],
  ];
  const RUNGS = [
    { g: 'phon', name: 'Phonics check', long: 'Year 1 phonics check', step: 4, paper: ['#/check', 'Full phonics check (40 words)'] },
    { g: 'ks1', name: 'KS1', long: 'KS1 (Year 2)', step: 3, paper: ['#/xmix/y2', 'Year 2 mixed round'] },
    { g: 'ks2', name: 'KS2 SATs', long: 'KS2 SATs (Year 6)', step: 4, paper: null },
    { g: 'e11', name: '11+', long: '11+', step: 5, paper: null },
    { g: 'ks3', name: 'KS3', long: 'KS3 (Years 7–9)', step: 4, paper: ['#/xmix/ks3', 'KS3 mixed round'] },
    { g: 'gcse', name: 'GCSE', long: 'GCSE', step: 5, paper: ['#/gcse', 'GCSE papers and essays'] },
  ];
  const ROUTE_RUNG = { eyfs: 'phon', ks1: 'phon', lks2: 'ks2', uks2: 'ks2', e11: 'e11', ks3: 'ks3', 'gcse-lang': 'gcse', 'gcse-lit': 'gcse' };
  const NO_EXAM = new Set(['handwriting']);   // trace-and-write: no exam-style questions yet
  const PHONICS_CHECK = new Set(['letters-sounds', 'blending']);
  const ELEVEN = new Set(['vocabulary', 'homophones-lists', 'retrieval', 'inference', 'spelling-rules', 'affixes']);
  const UP = 3, DOWN = 2;

  function rungsOf(k) {
    const t = CUR.topicOfSkill(k.id); if (!t || NO_EXAM.has(t.id)) return [];
    const out = new Set();
    k.stages.forEach((s) => {
      if (s === 'eyfs' || s === 'ks1') out.add(PHONICS_CHECK.has(t.id) ? 'phon' : 'ks1');
      else if (s === 'lks2' || s === 'uks2') { out.add('ks2'); if (s === 'uks2' && ELEVEN.has(t.id)) out.add('e11'); }
      else if (s === 'e11') out.add('e11');
      else if (s === 'ks3') out.add('ks3');
      else out.add('gcse');
    });
    return Array.from(out);
  }
  const ksPaper = (k) => { const t = CUR.topicOfSkill(k.id).id; return ['retrieval', 'inference', 'vocabulary', 'language-structure', 'text-types'].includes(t) ? ['#/read', 'SATs-style reading texts'] : ['#/paper', 'SATs-style grammar, punctuation and spelling paper']; };
  function strandOf(id) { const s = STRANDS.find((x) => x.includes(id)); return s ? s.slice(s.indexOf(id)) : [id]; }
  const CACHE = {};
  function steps(skillId) {
    if (CACHE[skillId]) return CACHE[skillId];
    const chain = strandOf(skillId).map((id) => CUR.skill(id)).filter((k) => k && k.status === 'released' && FMG.gen.BY_SKILL[k.id]);
    const out = [];
    for (const R of RUNGS) {
      const ks = chain.filter((k) => rungsOf(k).includes(R.g)).slice(0, 2);
      if (!ks.length) continue;
      out.push({ g: R.g, name: R.name, long: R.long, step: R.step, skills: ks.map((k) => k.id), topics: ks.map((k) => k.name), paper: R.g === 'ks2' ? ksPaper(ks[0]) : R.g === 'e11' ? ['#/exams', '11+ practice on the Exams page'] : R.paper });
    }
    return (CACHE[skillId] = out);
  }
  const key = (skillId) => `fe2.ladder.${(A().profile() || {}).id || 'x'}.${skillId}`;
  function load(skillId) { try { return JSON.parse(localStorage.getItem(key(skillId)) || 'null'); } catch (e) { return null; } }
  function save(skillId, s) { try { localStorage.setItem(key(skillId), JSON.stringify(s)); } catch (e) { /* private mode */ } }
  function startIndex(S, route) { const order = RUNGS.map((r) => r.g), want = order.indexOf(ROUTE_RUNG[route] || 'ks2'); let i = 0; S.forEach((s, k) => { if (order.indexOf(s.g) <= want) i = k; }); return i; }
  function state(skillId) {
    const S = steps(skillId); let s = load(skillId);
    if (!s || s.i == null || s.i >= S.length) s = { i: startIndex(S, (A().profile() || {}).route), streak: 0, miss: 0, top: -1 };
    return s;
  }

  function open(skillId) {
    const S = steps(skillId), k = CUR.skill(skillId);
    if (!k || !S.length) return A().go(k ? `#/skill/${skillId}` : '#/exams');
    const s = state(skillId); save(skillId, s);
    const cfg = {
      home: skillId, back: `#/skill/${skillId}`,
      step: () => S[s.i].step,
      pick: (sess) => { const st = S[s.i]; return { skillId: st.skills[Math.floor(Math.random() * st.skills.length)], step: st.step }; },
      level: () => S[s.i].long,
      bar() {
        const st = S[s.i], dots = Array.from({ length: UP }, (_, j) => `<i class="${j < s.streak ? 'on' : ''}"></i>`).join('');
        return `<section class="card xl-bar" aria-label="Exam ladder">
          <div class="xl-head"><b>Exam ladder</b><span class="small muted">${UP} right first time in a row moves you up · ${DOWN} misses in a row moves you back</span></div>
          <ol class="xl-rungs">${RUNGS.map((R) => { const j = S.findIndex((t) => t.g === R.g);
            if (j < 0) return `<li class="off"><button type="button" disabled title="No ${esc(R.long)} questions for this skill">${esc(R.name)}</button></li>`;
