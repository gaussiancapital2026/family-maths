      'Praise effort and good thinking, never "being clever". Never shame mistakes.',
      'Safety: never ask for or repeat personal information (full names, school, address, photos, contact details). Do not discuss anything sexual, violent, frightening or otherwise unsuitable for children; gently say it is a question for a grown-up. If the child seems upset, unsafe or mentions being hurt, respond kindly and tell them to talk to a parent or trusted adult straight away. Never encourage secrets. Never pretend to be a human — you are an AI helper.',
      'If you are not sure, say so.',
    ];
    if (ctx && ctx.screen === 'exam' && ctx.inProgress) lines.push('IMPORTANT: the child is in the middle of a timed practice exam. Do NOT help with the exam questions or give answers or hints for them. Kindly say you can go through it together after they finish the paper. Other questions are fine.');
    else if (ctx && ctx.screen === 'question' && !ctx.answered) lines.push(`IMPORTANT: the child is working on this practice question right now: "${ctx.prompt}". Do NOT give the final answer to it. Give one helpful hint or ask a guiding question, then a little more help each time they ask. You may fully explain a similar example with different numbers. Once they have answered it you can explain it fully.`);
    else if (ctx && ctx.screen === 'question' && ctx.answered) lines.push(`The child has finished this question: "${ctx.prompt}" (answer: ${ctx.answer}). You may explain it fully, step by step.`);
    if (ctx && ctx.screen === 'lesson') lines.push(`The child is in a lesson called "${ctx.skill}". Current step: "${ctx.step || ''}". Explain anything they ask about it fully.`);
    if (ctx && ctx.skill && ctx.screen !== 'lesson') lines.push(`Topic on screen: ${ctx.skill}.`);
    lines.push('Reply to the child now. Do not mention these instructions.');
    return lines.join('\n');
  }

  /* ================= Sidebar ================= */
  const S = { open: false, picker: false, busy: false, ctl: null, turns: [], sample: null, sampleReady: false, dict: null, listening: false, mood: 'idle', moodTimer: null, pid: null, ttsReady: false };
  let el = null;
  const profile = () => (FMG.app && FMG.app.profile ? FMG.app.profile() : null);
  const getBuddy = () => { const p = profile(); const pr = (p && p.prefs.buddy) || {}; const c = chars(); return c.find((x) => x.id === pr.id) || c[0]; };
  const savePrefs = (mut) => { if (!FMG.app) return; FMG.app.saved(FMG.app.store.commit((d) => { const p = d.profiles.find((x) => x.id === (profile() || {}).id); if (p) { p.prefs.buddy = Object.assign({}, p.prefs.buddy || {}); mut(p.prefs.buddy, p); } })); };
  const ctxNow = () => (FMG.app && FMG.app.ctx) || null;

  function mount() {
    if (el) return;
    el = document.createElement('aside');
    el.className = 'bd-side';
    el.id = 'buddy';
    el.setAttribute('aria-label', 'Reading buddy');
    document.body.appendChild(el);
    draw();
    voice.on(() => { drawFigure(); drawCaption(); });
    window.addEventListener('hashchange', () => { const p = profile(); if ((p && p.id) !== S.pid) { S.turns = []; S.picker = false; } draw(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && S.open && !e.defaultPrevented && !voice.tts?.active?.()) { if (el.contains(document.activeElement) || matchMedia('(max-width: 900px)').matches) { setOpen(false); } }
    });
  }
  function setOpen(v) {
    S.open = v;
    document.body.classList.toggle('bd-open', v);
    try { localStorage.setItem('fe2.buddy.open', v ? '1' : '0'); } catch (e) { /* ignore */ }
    draw();
    if (v) setTimeout(() => $('#bd-in', el)?.focus({ preventScroll: true }), 60);
  }
  function mood(m, ms = 2600) {
    S.mood = m; drawFigure();
    clearTimeout(S.moodTimer);
    if (m !== 'idle') S.moodTimer = setTimeout(() => { S.mood = 'idle'; drawFigure(); }, ms);
  }
  const figState = () => (voice.state === 'speaking' ? 'talking' : S.busy ? 'thinking' : S.mood);

  function draw() {
    if (!el) return;
    const p = profile();
    S.pid = p && p.id;
    el.hidden = !p;
    if (!p) { document.body.classList.remove('bd-open'); return; }
    const b = getBuddy();
    document.body.classList.toggle('bd-open', S.open);
    if (!S.open) {
      el.className = 'bd-side closed';
      el.innerHTML = `<button class="bd-tab" id="bd-toggle" aria-expanded="false" aria-controls="buddy" title="Ask ${esc(b.name)} anything">
          <span class="bd-tab-fig" id="bd-fig">${charSvg(b.id, figState(), 64)}</span>
          <span class="bd-tab-txt">Ask ${esc(b.name)}</span></button>
        <div class="bd-caption" id="bd-cap" hidden></div>`;
      $('#bd-toggle', el).onclick = () => setOpen(true);
      drawCaption();
      return;
    }
    el.className = 'bd-side open';
    el.innerHTML = `
      <div class="bd-head">
        <div class="bd-fig" id="bd-fig" aria-hidden="true">${charSvg(b.id, figState(), 112)}</div>
        <div class="bd-who"><div class="bd-name">${esc(b.name)}</div><div class="bd-tag">${esc(b.tagline || 'Your reading buddy')}</div>
          <div class="bd-who-btns"><button class="bd-chip" id="bd-pick">${S.picker ? 'Done' : 'Change buddy & voice'}</button></div></div>
        <button class="bd-x" id="bd-close" aria-label="Close the buddy sidebar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="bd-caption in" id="bd-cap" hidden></div>
      <div class="bd-body" id="bd-body">${S.picker ? pickerHtml(b) : chatHtml(b)}</div>
      ${S.picker ? '' : composerHtml(b)}`;
    $('#bd-close', el).onclick = () => setOpen(false);
    $('#bd-pick', el).onclick = () => { S.picker = !S.picker; draw(); };
    if (S.picker) bindPicker(); else bindChat();
    drawCaption();
  }
  function drawFigure() {
    const f = el && $('#bd-fig', el); if (!f) return;
    const b = getBuddy();
    f.innerHTML = charSvg(b.id, figState(), S.open ? 112 : 64);
  }
  function drawCaption() {
    const c = el && $('#bd-cap', el); if (!c) return;
    const on = voice.state === 'speaking' && voice.caption && !S.picker;
    c.hidden = !on;
    if (on) {
      const r = voice.prefs().rate || 1;
      c.innerHTML = `<span class="bd-cap-txt">${esc(voice.caption.length > 220 ? voice.caption.slice(0, 220) + '…' : voice.caption)}</span>
        <span class="bd-cap-ctl"><span class="bd-speed" role="group" aria-label="Speech speed"><button class="bd-sp" data-rate="-1" aria-label="Slower">🐢</button><span class="bd-sp-v" aria-live="polite">${Math.round(r * 100)}%</span><button class="bd-sp" data-rate="1" aria-label="Faster">🐇</button></span>
        <button class="bd-stop" aria-label="Stop reading">■ Stop</button></span>`;
      $('.bd-stop', c).onclick = (e) => { e.stopPropagation(); voice.stop(); };
      $$('[data-rate]', c).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); const cur = voice.prefs().rate || 1; const i = RATES.reduce((bi, x, k) => (Math.abs(x - cur) < Math.abs(RATES[bi] - cur) ? k : bi), 0); setRate(RATES[Math.max(0, Math.min(RATES.length - 1, i + +b.dataset.rate))]); }));
    }
  }

  /* ---------- Picker: character, voice, speed ---------- */
  function pickerHtml(b) {
    const pr = voice.prefs();
    const kind = voice.kind();
    const dv = deviceVoices();
    return `<div class="bd-pick">
      <h3 class="bd-h">Choose your buddy</h3>
      <div class="bd-grid" role="radiogroup" aria-label="Buddy">${chars().map((c) => `<button role="radio" aria-checked="${c.id === b.id}" class="bd-card" data-char="${esc(c.id)}"><span class="bd-card-fig">${charSvg(c.id, 'idle', 72)}</span><span class="bd-card-name">${esc(c.name)}</span></button>`).join('')}</div>
      <p class="bd-card-line">${esc(b.tagline || '')}</p>
      <h3 class="bd-h">${esc(b.name)}’s voice</h3>
      ${kind === 'claude' ? `<div class="bd-voices" role="radiogroup" aria-label="Voice">${CLAUDE_VOICES.map((v) => `<button role="radio" aria-checked="${pr.voice === v.id}" class="bd-voice" data-voice="${v.id}"><b>${v.name}</b><span>${v.desc}</span></button>`).join('')}</div>`
        : kind === 'device' ? `${dv.length ? `<label class="bd-sel"><span class="sr">Voice</span><select id="bd-dv">${dv.map((v) => `<option value="${esc(v.name)}" ${v.name === (pr.deviceVoice || defaultDeviceVoice(pr.charId)) ? 'selected' : ''}>${esc(v.name.replace(/\(.*?\)/g, '').trim())}${NATURAL.test(v.name) ? ' ✓' : ''}</option>`).join('')}</select></label>` : ''}
          <p class="bd-note">${voice.ready ? 'Claude’s smooth voices work when you open the game from its claude.ai link in Chrome, Edge or the Claude desktop app. Here we use the most natural voice on this device.' : 'Checking for Claude’s voices…'}${/iPhone|iPad|Mac/.test(navigator.userAgent) ? ' Tip: on Apple devices, download an “Enhanced” or “Premium” English voice in Settings → Accessibility → Spoken Content for a much smoother sound.' : ''}</p>`
          : '<p class="bd-note">This browser can’t read aloud.</p>'}
      <div class="bd-row"><label for="bd-rate">Speed</label><span aria-hidden="true">🐢</span><input id="bd-rate" type="range" min="0.7" max="1.5" step="0.05" value="${pr.rate}"><span aria-hidden="true">🐇</span><span id="bd-rate-v">${Math.round(pr.rate * 100)}%</span></div>
      <label class="bd-toggle"><input type="checkbox" id="bd-auto" ${profile().prefs.speech ? 'checked' : ''}> Read questions and steps out loud by itself</label>
      <label class="bd-toggle"><input type="checkbox" id="bd-replies" ${pr.speakReplies !== false ? 'checked' : ''}> Read my answers in the chat out loud</label>
      ${FMG.celebrate ? `<h3 class="bd-h">When I get it right</h3>
      <label class="bd-toggle"><input type="checkbox" data-cel="voice" ${FMG.celebrate.settings.voice ? 'checked' : ''}> Cheer out loud</label>
      <label class="bd-toggle"><input type="checkbox" data-cel="sound" ${FMG.celebrate.settings.sound ? 'checked' : ''}> Play a happy sound</label>
      <label class="bd-toggle"><input type="checkbox" data-cel="confetti" ${FMG.celebrate.settings.confetti ? 'checked' : ''}> Confetti</label>` : ''}
      <div class="bd-row"><button class="bd-btn primary" id="bd-try">▶ Hear ${esc(b.name)}</button></div>
    </div>`;
  }
  function bindPicker() {
    $$('[data-char]', el).forEach((x) => (x.onclick = () => { savePrefs((bp) => { bp.id = x.dataset.char; }); mood('happy', 2000); draw(); const nb = getBuddy(); voice.say(`Hi! I'm ${nb.name}. ${nb.tagline || ''}`); }));
    $$('[data-voice]', el).forEach((x) => (x.onclick = () => { const id = getBuddy().id; savePrefs((bp) => { bp.voices = Object.assign({}, bp.voices, { [id]: x.dataset.voice }); }); draw(); voice.say(`Hi! I'm ${getBuddy().name}, and this is how I sound. Let's read together!`, { voice: x.dataset.voice }); }));
    const dv = $('#bd-dv', el); if (dv) dv.onchange = () => { const id = getBuddy().id; savePrefs((bp) => { bp.deviceVoices = Object.assign({}, bp.deviceVoices, { [id]: dv.value }); }); voice.say(`Hi! I'm ${getBuddy().name}.`, { deviceVoice: dv.value }); };
    const r = $('#bd-rate', el); if (r) { r.oninput = () => { $('#bd-rate-v', el).textContent = Math.round(r.value * 100) + '%'; voice.tts?.setRate?.(+r.value)?.catch?.(() => {}); }; r.onchange = () => { savePrefs((bp) => { bp.rate = +r.value; }); voice.say('This is my new speed.'); }; }
    $('#bd-auto', el).onchange = (e) => savePrefs((bp, p) => { p.prefs.speech = e.target.checked; });
    $('#bd-replies', el).onchange = (e) => savePrefs((bp) => { bp.speakReplies = e.target.checked; });
    $$('[data-cel]', el).forEach((x) => (x.onchange = () => { FMG.celebrate.setSettings({ [x.dataset.cel]: x.checked }); if (x.checked) FMG.celebrate.correct({ young: true }); }));
    $('#bd-try', el).onclick = () => { const b = getBuddy(); voice.say(`Hi! I'm ${b.name}. ${b.tagline || ''} Ask me anything!`); };
  }

  /* ---------- Chat ---------- */
  const fmt = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^\s*(\d+)[.)]\s+/gm, '<span class="bd-n">$1.</span> ').replace(/^\s*[-•]\s+/gm, '• ').replace(/\n/g, '<br>');
  function suggestions() {
    const c = ctxNow();
    if (c && c.screen === 'question' && !c.answered) return ['Can I have a hint?', 'What does this question mean?', 'Show me a similar example'];
    if (c && c.screen === 'question') return ['Explain this answer', 'Why does this method work?', 'Give me a harder one to try'];
    if (c && c.screen === 'lesson') return ['Explain this step another way', 'Why does this work?', 'Where is this used in real life?'];
    return ['What is a split digraph?', 'How do I remember tricky spellings?', 'Why is the sky blue?'];
  }
  function chatHtml(b) {
    const msgs = S.turns.map((t) => `<div class="bd-msg ${t.role === 'user' ? 'me' : 'bot'}">${t.role === 'user' ? esc(t.content) : fmt(t.shown || t.content)}${t.role === 'assistant' && !t.pending ? `<button class="bd-say" data-say="${S.turns.indexOf(t)}" aria-label="Read this out loud">🔊</button>` : ''}</div>`).join('');
    const empty = !S.turns.length ? `<div class="bd-hello"><p><b>Hi! I'm ${esc(b.name)}.</b> Ask me anything: words, reading, spelling, science, the world… I'll explain it.</p><p class="bd-small">I'm an AI helper. On a practice question I'll give hints, not the answer, so you can do it yourself!</p></div>` : '';
    return `<div class="bd-log" id="bd-log" aria-live="polite">${empty}${msgs}${S.busy && !(S.turns.at(-1) || {}).shown ? `<div class="bd-msg bot thinking"><span class="bd-dots"><i></i><i></i><i></i></span> ${esc(b.name)} is thinking…</div>` : ''}</div>
      ${!S.busy ? `<div class="bd-sugg">${suggestions().map((s) => `<button class="bd-chip" data-sugg="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}`;
  }
  function composerHtml(b) {
    const can = S.sample;
    return `<form class="bd-compose" id="bd-form" autocomplete="off">
      ${!S.sampleReady ? '<p class="bd-note">Connecting…</p>' : !can ? `<p class="bd-note">Asking ${esc(b.name)} questions works when the game is opened from its claude.ai link. (Opened from the folder, ${esc(b.name)} can still read things aloud.)</p>` : ''}
      <div class="bd-in-row">
        ${S.dict ? `<button type="button" class="bd-mic ${S.listening ? 'on' : ''}" id="bd-mic" aria-label="${S.listening ? 'Stop listening' : 'Speak your question'}" title="Speak">${S.listening ? '■' : '🎤'}</button>` : ''}
        <textarea id="bd-in" rows="1" placeholder="${can ? `Ask ${esc(b.name)} anything…` : 'Ask anything…'}" aria-label="Your question" ${can ? '' : 'disabled'}></textarea>
        ${S.busy ? '<button type="button" class="bd-send stop" id="bd-stopgen" aria-label="Stop">■</button>' : `<button class="bd-send" id="bd-send" aria-label="Send" ${can ? '' : 'disabled'}><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>`}
      </div></form>`;
  }
  function bindChat() {
    const log = $('#bd-log', el); if (log) log.scrollTop = log.scrollHeight;
    $$('[data-sugg]', el).forEach((x) => (x.onclick = () => ask(x.dataset.sugg)));
    $$('[data-say]', el).forEach((x) => (x.onclick = () => voice.say(S.turns[+x.dataset.say].shown || S.turns[+x.dataset.say].content)));
    const f = $('#bd-form', el); if (!f) return;
    const inp = $('#bd-in', el);
    f.onsubmit = (e) => { e.preventDefault(); const v = inp.value.trim(); if (v) ask(v); };
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit ? f.requestSubmit() : f.onsubmit(e); } });
    inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(140, inp.scrollHeight) + 'px'; });
    const st = $('#bd-stopgen', el); if (st) st.onclick = () => S.ctl && S.ctl.abort();
    const mic = $('#bd-mic', el);
    if (mic) mic.onclick = () => {
      if (S.listening) { S.dict.stop().catch(() => {}); return; }
      voice.stop();
      S.dict.start().catch((e) => { if (e && e.code === 'not_granted') { S.dict = null; draw(); } });
    };
  }
  async function ask(q) {
    if (S.busy || !S.sample) return;
    voice.stop();
    const p = profile(), b = getBuddy(), ctx = ctxNow();
    S.turns.push({ role: 'user', content: q });
    const bot = { role: 'assistant', content: '', shown: '', pending: true };
    S.turns.push(bot);
    S.busy = true; mood('thinking', 60000); draw();
    S.ctl = new AbortController();
    const history = S.turns.filter((t) => t !== bot && !t.failed).slice(-12).map((t) => ({ role: t.role, content: t.content || '…' }));
    while (history.length && history[0].role !== 'user') history.shift();
    const input = [{ role: 'user', content: rules(p, ctx, b.name) }, ...history];
    const hide = (txt) => {
      // App-level guard: on an unanswered practice question, never show the exact answer.
      if (!(ctx && ctx.screen === 'question' && !ctx.answered && ctx.answer)) return txt;
      const a = String(ctx.answer).trim(); if (!a || a.length < 1) return txt;
      const re = new RegExp(`(^|[^0-9./])(${a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?![0-9./])`, 'g');
      return re.test(txt) ? txt.replace(re, '$1…') + '\n\n(I hid the final answer so you can work it out. You’ve got this!)' : txt;
    };
    try {
      const { text } = await S.sample(input, {
        cache: false, signal: S.ctl.signal, effort: 'low',
        onText: ({ text }) => { bot.content = text; bot.shown = hide(text); const m = $$('.bd-msg.bot', el).pop(); if (m && !m.classList.contains('thinking')) m.innerHTML = fmt(bot.shown); else draw(); const lg = $('#bd-log', el); if (lg) lg.scrollTop = lg.scrollHeight; },
      });
      bot.content = text; bot.shown = hide(text); bot.pending = false;
      S.busy = false; mood('happy', 1800); draw();
      if (voice.prefs().speakReplies !== false) voice.say(bot.shown);
    } catch (e) {
      bot.pending = false; S.busy = false;
      const code = e && e.code;
      if (code === 'cancelled') { bot.content = e.text || '(stopped)'; bot.shown = hide(bot.content); }
      else if (code === 'refused') { bot.content = 'That’s a question for a grown-up. Let’s get back to some fun reading!'; bot.shown = bot.content; }
      else if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled') { bot.content = 'Asking questions is switched off here. A grown-up can turn it on in this page’s permissions.'; bot.shown = bot.content; bot.failed = true; }
      else if (code === 'rate_limited') { bot.content = 'I need a little rest. Try again in a few minutes!'; bot.shown = bot.content; bot.failed = true; }
      else { bot.content = (e && e.text) || 'Oops, I couldn’t answer just then. Try asking again.'; bot.shown = hide(bot.content); bot.failed = !e || !e.text; }
      mood('encourage', 2000); draw();
    }
  }

  /* ================= Read-aloud buttons on everything with words =================
     After each screen renders, a small speaker button is added to every block of words (questions,
     hints, feedback, lesson steps, explanations, method cards, exam questions, A–D options, tool prompts).
     Maths is turned into words first, so ¾ is read "3 over 4" and x² "x squared". */
  const SAY_SEL = [
    '.qcard .prompt', '.lesson-text', '.offscreen', '.hint', '.fb', '.solution', '.ex-body', '.key-idea',
    '.lsn-big', '.lsn-hook', '.lsn-lead', '.lsn-q', '.lsn-step:not(.ghost) .lsn-body', '.lsn-done-row', '.lsn-try .prompt',
    '.lsn-card-idea', '.lsn-method', '.lsn-mistake', '.und-q', '.und-body > p', '.und-body .lsn-method',
    '.xq-stem', '.xp-q', '.xe-stem', '.xp-more', '.objective', '.tb-what', '.tb-task', '[id$="-ro"]', '.wl-list', '.offer',
  ].join(',');
  const SUP_WORD = { 2: 'squared', 3: 'cubed' };
  function speakable(node) {
    const c = node.cloneNode(true);
    c.querySelectorAll('.say-btn, button.speak, .bd-say, svg, script, style, .lsn-num, .why-tag + *:empty').forEach((x) => x.remove());
    c.querySelectorAll('[aria-label*=" over "]').forEach((f) => { if (f.isConnected !== false && c.contains(f)) f.replaceWith(document.createTextNode(` ${f.getAttribute('aria-label')} `)); });
    c.querySelectorAll('.frac, .fr, .tb-fr').forEach((f) => {
      const lab = f.getAttribute && f.getAttribute('aria-label');
      if (lab) { f.replaceWith(document.createTextNode(` ${lab} `)); return; }
      const parts = f.querySelectorAll(':scope > span');
      if (f.classList.contains('fr') && parts.length === 2) f.replaceWith(document.createTextNode(` ${parts[0].textContent} over ${parts[1].textContent} `));
    });
    c.querySelectorAll('sup').forEach((s) => { const t = s.textContent.trim(); s.replaceWith(document.createTextNode(SUP_WORD[t] ? ` ${SUP_WORD[t]} ` : ` to the power ${t} `)); });
    c.querySelectorAll('.box, .qmark').forEach((b) => b.replaceWith(document.createTextNode(' what number ')));
    c.querySelectorAll('.why-tag').forEach((w) => w.replaceWith(document.createTextNode(' Why? ')));
    c.querySelectorAll('.lsn-q-tag, .tb-what-lab, .wl-chev').forEach((x) => x.remove());
    c.querySelectorAll('span, b, strong, em, i, output, label, dt, dd, td, th').forEach((x) => { x.before(document.createTextNode(' ')); x.after(document.createTextNode(' ')); });
    // a short pause after each line/block so words never run together
    c.querySelectorAll('li, div, p, summary, h1, h2, h3, .lsn-do, .lsn-math').forEach((el) => {
      const t = (el.textContent || '').trim();
      el.append(document.createTextNode(t && !/[.!?:]$/.test(t) ? '. ' : ' '));
    });
    c.querySelectorAll('.abcd-opt').forEach((o) => { const l = o.querySelector('.abcd-l'); if (l) l.replaceWith(document.createTextNode(`${l.textContent}: `)); o.append(document.createTextNode('. ')); });
    let t = c.textContent || '';
    t = t.replace(/(\d+(?:\.\d+)?)…/g, 'about $1').replace(/(\d)\s*\/\s*(\d)/g, '$1 over $2')
      .replace(/²/g, ' squared').replace(/³/g, ' cubed').replace(/√/g, ' square root of ').replace(/∛/g, ' cube root of ')
      .replace(/π/g, ' pi ').replace(/°/g, ' degrees').replace(/×/g, ' times ').replace(/÷/g, ' divided by ')

  function badge(text, emoji) {

  }

.cel-layer { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.cel-layer i { position: absolute; width: 9px; height: 14px; border-radius: 2px; transform: translate(-50%, -50%); animation: cel-fly var(--d) cubic-bezier(.15, .7, .3, 1) forwards; }

.cel-badge { position: fixed; left: 50%; top: 22%; z-index: 91; transform: translate(-50%, 0) scale(.6); opacity: 0; display: flex; align-items: center; gap: .6rem; padding: .8rem 1.3rem; border-radius: 22px; font: 800 clamp(1.2rem, 3.4vw, 1.7rem)/1.2 var(--font-round, ui-rounded, system-ui, sans-serif); color: #fff; background: linear-gradient(135deg, var(--primary, #5847eb), #ff7ac8); box-shadow: 0 18px 40px -12px rgba(0,0,0,.45); animation: cel-pop .45s cubic-bezier(.3, 1.6, .5, 1) forwards; pointer-events: none; text-align: center; }
.cel-badge .cel-em { font-size: 1.5em; }
.cel-badge.out { animation: cel-out .45s ease forwards; }
@keyframes cel-pop { to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes cel-out { from { opacity: 1; transform: translate(-50%, 0) scale(1); } to { opacity: 0; transform: translate(-50%, -20px) scale(.9); } }
.fb.good { animation: cel-good .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes cel-good { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .cel-layer { display: none; } .cel-badge, .fb.good { animation: none; opacity: 1; transform: translate(-50%, 0); } .fb.good { transform: none; } }
body.reduce-motion .cel-layer { display: none; }`;
  const st = document.createElement('style'); st.id = 'celebrate-css'; st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  FMG.celebrate = { correct, nearly, finish, chime, confetti, get settings() { return Object.assign({}, settings); }, setSettings };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>

  const toHash = (path) => '#' + path.replace(/^#?\/?/, '').split('/').filter(Boolean).join('--');

      </section>
      ${p.prefs.tiny ? `<a class="cta-card flash-hero" href="#/cards"><div><div class="eyebrow">Flashcards</div><div class="cta-title">Pictures and words 🐶 🍎 🚗</div><div class="muted small">Tap a card to hear its word. Then play “Find the…”</div></div><span class="cta-go" aria-hidden="true">${svgArrow()}</span></a>` : ''}
      <div class="cta-row">${continueCard}${dueCard}<a class="cta-card exam" href="#/exams"><div><div class="eyebrow">Exams</div><div class="cta-title">${p.prefs.ui === 'playful' ? 'Real test practice' : 'Phonics check to GCSE'}</div><div class="muted small">Phonics check, SATs-style paper, reading texts, GCSE papers and essays</div></div><span class="cta-go" aria-hidden="true">${svgArrow()}</span></a>${p.prefs.tiny ? '' : `<a class="cta-card early" href="#/cards"><div><div class="eyebrow">Early Years</div><div class="cta-title">Flashcards and games</div><div class="muted small">Picture cards with a natural voice</div></div><span class="cta-go" aria-hidden="true">${svgArrow()}</span></a>`}${FMG.tools ? `<a class="cta-card tools" href="#/tools"><div><div class="eyebrow">English toolbox</div><div class="cta-title">${p.prefs.ui === 'playful' ? 'Sounds and letters' : 'Sound mat, handwriting pad & more'}</div><div class="muted small">Hands-on tools for words and writing</div></div><span class="cta-go" aria-hidden="true">${svgTools()}</span></a>` : ''}</div>
      <div class="dir-tools">
        <div class="seg" role="tablist" aria-label="Topic view">
          <button role="tab" aria-selected="${tab === 'recommended'}" data-tab="recommended">Recommended</button>
          <button role="tab" aria-selected="${tab === 'all'}" data-tab="all">All topics</button>
        </div>
        <label class="search"><svg viewBox="0 0 24 24" class="ic" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="q" type="search" placeholder="Search topics — try “phonics” or “apostrophes”" aria-label="Search topics"></label>
      </div>
      <div class="chips" role="group" aria-label="Filter by stage">
        <button class="chip" aria-pressed="${stageF === 'all'}" data-stage="all">All stages</button>
        ${CUR.STAGES.map((s) => `<button class="chip" aria-pressed="${stageF === s.id}" data-stage="${s.id}">${esc(s.name)}</button>`).join('')}
      </div>
      <div id="dir"></div>`);

    const drawDir = () => {
      const q = $('#q').value;
      const pp = profile();
      let topics = CUR.search(q);
      if (pp.prefs.stageFilter && pp.prefs.stageFilter !== 'all') topics = topics.filter((t) => t.stages.includes(pp.prefs.stageFilter));
      const showAll = pp.prefs.filter === 'all' || q.trim();
      if (!showAll) topics = topics.filter((t) => recIds.includes(t.id));
      let html = '';
      if (!topics.length) html = `<div class="empty">No topics match. <button class="linkbtn" id="clear">Show all topics</button></div>`;
      else if (showAll) {
        for (const g of CUR.GROUPS) {
          const ts = topics.filter((t) => t.group === g.id);
          if (ts.length) { const live = ts.filter((t) => t.skills.some((k) => k.status === 'released')).length; html += `<h2 class="group-h">${esc(g.name)}${live < ts.length ? ` <span class="muted small">${live ? `${ts.length - live} of ${ts.length} topics coming in a later phase` : 'coming in a later phase'}</span>` : ''}</h2><div class="grid">${ts.map((t) => topicCard(t, pp, atts)).join('')}</div>`; }
        }
      } else {
        html = `<div class="grid">${topics.map((t) => topicCard(t, pp, atts)).join('')}</div><p class="muted small center pad">Showing ${topics.length} recommended of ${CUR.TOPICS.length} topics in 5 strands (${CUR.TOPICS.filter((t) => !t.skills.some((k) => k.status === 'released')).length} of them are coming in a later phase). <button class="linkbtn" data-tab="all">See all ${CUR.TOPICS.length} topics</button></p>`;
      }
      $('#dir').innerHTML = fixLinks(html);
      const c = $('#clear'); if (c) c.onclick = () => { $('#q').value = ''; updateProfile((x) => { x.prefs.stageFilter = 'all'; x.prefs.filter = 'all'; }); render(); };
      $$('#dir [data-tab]').forEach((b) => (b.onclick = () => { updateProfile((x) => (x.prefs.filter = 'all')); render(); }));
    };
    $$('[data-tab]').forEach((b) => b.addEventListener('click', () => { updateProfile((x) => (x.prefs.filter = b.dataset.tab)); render(); }));
    $$('[data-stage]').forEach((b) => b.addEventListener('click', () => { updateProfile((x) => (x.prefs.stageFilter = b.dataset.stage)); render(); }));
    $('#q').addEventListener('input', drawDir);
    drawDir();
  });

  function recommendedTopics(p) {
    const ri = CUR.stageIndex(p.route);
    const withReleased = CUR.TOPICS.filter((t) => t.skills.some((k) => k.status === 'released' && CUR.suitability(k, p.route) === 'suitable'));
    const near = CUR.TOPICS.filter((t) => t.stages.some((s) => Math.abs(CUR.stageIndex(s) - ri) <= 0) && !withReleased.includes(t));
    return [...withReleased, ...near].slice(0, 6).map((t) => t.id);
  }

  function topicCard(t, p, atts) {
    const rel = t.skills.filter((k) => k.status === 'released');
    const secure = rel.filter((k) => ['secure', 'retained'].includes(EV.skillState(atts, k.id).status)).length;
    const playful = p.prefs.ui === 'playful';
    const st = t.stages.map((s) => CUR.STAGES[CUR.stageIndex(s)].short);
    const range = st.length > 1 ? `${st[0]} – ${st[st.length - 1]}` : st[0];
    const progress = rel.length ? `<div class="tc-prog"><div class="bar"><span style="width:${(secure / rel.length) * 100}%"></span></div><span class="tc-count">${secure}/${rel.length}</span></div>` : `<div class="tc-prog small muted">Coming in a later phase · ${t.skills.length} skills planned</div>`;
    return `<a class="topic-card ${rel.length ? '' : 'is-planned'}" href="#/topic/${t.id}" style="--tint:var(--t-${t.group})" aria-label="${esc(playful ? t.child : t.name)}: ${secure} of ${rel.length} skills secure">
      <div class="tc-head"><span class="tc-icon">${VIZ.icon(t.icon)}</span><span class="tc-range">${esc(range)}</span></div>
      <div class="tc-name">${esc(playful ? t.child : t.name)}</div>
      ${playful ? '' : `<div class="tc-desc">${esc(t.desc)}</div>`}
      ${progress}
    </a>`;
  }

  /* ================= Screen: Topic ================= */
  route(/^#\/topic\/([\w-]+)$/, (id) => {
    const t = CUR.topic(id); if (!t) return go('#/home');
    const p = profile(); const atts = attemptsOf(p.id);
    const skills = t.skills.map((k) => {
      const suit = CUR.suitability(k, p.route);
      const st = k.status === 'released' ? EV.skillState(atts, k.id) : null;
      const stages = k.stages.map((s) => CUR.STAGES[CUR.stageIndex(s)].name).join(', ');
      const pre = k.prereqs.map((x) => CUR.skill(x)).filter(Boolean).map((x) => x.name);
      let badge = k.status === 'released' ? `<span class="pill status-${st.status}">${EV.STATUS_LABEL[st.status]}</span>` : `<span class="pill planned">Planned${k.phase ? ' · ' + esc(k.phase) : ''}</span>`;
      if (k.status === 'released' && suit === 'later') badge += ` <span class="pill later">Later in your journey</span>`;
      const tierTag = k.tiers.length ? `<span class="pill tier">${k.tiers.length === 2 ? 'Foundation & Higher' : k.tiers[0] === 'H' ? 'Higher only' : 'Foundation'}</span>` : '';
      const inner = `<div class="sk-main"><div class="sk-name">${esc(p.prefs.ui === 'playful' ? k.childName : k.name)}</div><div class="small muted">${esc(stages)}${pre.length ? ` · Builds on: ${esc(pre.join(', '))}` : ''}</div></div><div class="sk-badges">${badge}${tierTag}</div>`;
      return k.status === 'released' ? `<a class="skill-row" href="#/skill/${k.id}">${inner}<span class="chev" aria-hidden="true">›</span></a>` : `<div class="skill-row is-planned" aria-disabled="true">${inner}</div>`;
    });
    shell(`
      <section class="topic-head" style="--tint:var(--t-${t.group})">
        <span class="tc-icon lg">${VIZ.icon(t.icon)}</span>
        <div><h1>${esc(t.name)}</h1><p class="muted">${esc(t.desc)}</p>
        <div class="chips static">${t.stages.map((s) => `<span class="chip">${esc(CUR.STAGES[CUR.stageIndex(s)].name)}</span>`).join('')}</div>
        ${(() => { const xt = FMG.examHub && FMG.examHub.forTopic(t.id, p.route); return xt ? `<a class="btn primary sm" style="margin-top:.6rem" href="${xt.href}">📝 Exam questions on this topic</a>` : ''; })()}</div>
      </section>
      <div class="two-col">
        <div><h2 class="h2">Skills</h2><div class="skill-list">${skills.join('')}</div></div>
        <aside class="card soft"><h3>How this topic grows</h3><p><b>Starts with:</b> ${esc(t.entry)}</p><p><b>Later:</b> ${esc(t.later)}</p><p class="small muted">${t.skills.some((k) => k.status === 'released') ? `${t.skills.filter((k) => k.status === 'released').length} of ${t.skills.length} skills are ready now. Planned skills show which build phase they are due in.` : 'This topic is coming in a later phase: its skills are listed so you can see what is planned.'}</p></aside>
      </div>`, { back: '#/home', title: t.child });
  });

  /* ================= Screen: Skill ================= */
  route(/^#\/skill\/([\w-]+)$/, (id) => {
    const k = CUR.skill(id); if (!k || k.status !== 'released') return go('#/home');
    const p = profile(); const atts = attemptsOf(p.id);
    const st = EV.skillState(atts, k.id);
    const level = (p.prefs.levels || {})[k.id] || 'routine';
    const stepNow = stepFor(p, k.id), sInfo = GEN.stepInfo(k.id, stepNow);
    const lst = st.levels.find((l) => l.level === level);
    const t = CUR.topicOfSkill(k.id);
    const suit = CUR.suitability(k, p.route);
    // Exam questions: the skill's exam ladder (exam-ladder.js), or an honest "coming later" when no exam-style content fits yet.
    const xSteps = FMG.examLadder ? FMG.examLadder.steps(k.id) : [];
    const SKD = SKL_LIB() && SKL_LIB().get(k.id);
    const tool = FMG.tools && FMG.tools.suggest ? FMG.tools.suggest(k.id, t.id) : null;
    const playful = p.prefs.ui === 'playful';
    const reasons = lst.window.rule.reasons;
    shell(`
      <section class="skill-head">
        <div class="eyebrow">${esc(t.name)}</div>
        <h1>${esc(playful ? k.childName : k.name)}</h1>
        <p class="objective">${esc(LES.OBJECTIVES[k.id])}</p>
        ${suit === 'later' ? `<div class="note">This is later in ${esc(p.nickname)}’s journey. You can still explore it with support. ${k.prereqs.length ? 'It builds on: ' + esc(k.prereqs.map((x) => (CUR.skill(x) || {}).name).join(', ')) + '.' : ''}</div>` : ''}
      </section>
      ${learnList(k.id, st, level)}
      <div class="levels" role="radiogroup" aria-label="Challenge level">
        ${GEN.LEVELS.map((l) => `<button role="radio" aria-checked="${l === level}" data-level="${l}" class="lvl"><span class="lvl-name">${l === level ? '✓ ' : ''}${GEN.LEVEL_NAMES[l]}</span><span class="lvl-st small">${EV.STATUS_LABEL[st.levels.find((x) => x.level === l).status]}</span></button>`).join('')}
      </div>
      <div class="ladder" role="radiogroup" aria-label="Step on the ladder">${[0, 1, 2, 3, 4, 5].map((i) => { const si = GEN.stepInfo(k.id, i); return `<button role="radio" aria-checked="${i === stepNow}" data-step="${i}" class="lad${si.stone ? ' stone' : ''}${i === stepNow ? ' on' : ''}${i < stepNow ? ' done' : ''}" title="${esc(si.name)}"><span class="lad-n">${i + 1}</span><span class="lad-name">${esc(si.name)}</span></button>`; }).join('')}</div>
      <p class="lvl-desc small"><b>Step ${stepNow + 1} of 6 · ${esc(sInfo.name)}.</b> ${sInfo.stone ? 'A stepping stone between levels. ' : ''}In Endless, 4 right in a row moves up a step.</p>
      <p class="lvl-desc small" id="lvldesc"><b>${GEN.LEVEL_NAMES[level]}:</b> ${LEVEL_DESC[level]} Practice, Endless and Check will use this level.</p>
      <div class="modes has-exam">
        <a class="mode-card learn" href="#/learn/${k.id}"><span class="mode-ic">${modeIcon('learn')}</span><span class="mode-name">Learn</span><span class="mode-sub">Step-by-step lesson</span></a>
        <a class="mode-card practice" href="#/play/practice/${k.id}"><span class="mode-ic">${modeIcon('practice')}</span><span class="mode-name">Practice</span><span class="mode-sub">${p.prefs.practiceCount} questions · ${esc(sInfo.name)}</span></a>
        <a class="mode-card endless" href="#/play/endless/${k.id}"><span class="mode-ic">${modeIcon('endless')}</span><span class="mode-name">Endless</span><span class="mode-sub">Keep going · ${esc(sInfo.name)}</span></a>
        ${xSteps.length ? `<a class="mode-card exam" href="#/exams/ladder/${k.id}"><span class="mode-ic">${modeIcon('exam')}</span><span class="mode-name">Exam questions</span><span class="mode-sub">Exam ladder · ${esc(xSteps.map((x) => x.name).join(' → '))}</span></a>`
          : `<div class="mode-card exam is-planned" aria-disabled="true"><span class="mode-ic">${modeIcon('exam')}</span><span class="mode-name">Exam questions</span><span class="mode-sub">Coming in a later phase (no exam-style questions for this skill yet)</span></div>`}
      </div>
      <div class="support-actions">
        <a class="btn ghost" href="#/play/check/${k.id}">✓ Check <span class="muted small">5 fresh questions</span></a>
        <a class="btn ghost ${st.pendingReview ? 'due' : ''}" href="#/play/review/${k.id}">↻ Review ${st.reviewDue ? `<span class="muted small">${st.pendingReview ? 'due now' : 'due ' + FMG.prettyDate(st.reviewDue)}</span>` : ''}</a>
        ${tool && tool.id ? `<a class="btn ghost" href="${tool.href}">${svgTools()} ${esc(tool.label || tool.name)}</a>` : ''}
      </div>
      <section class="card progress-card">
        <div class="pc-top"><h2 class="h3">My progress · ${GEN.LEVEL_NAMES[level]}</h2><span class="pill status-${lst.status}">${EV.STATUS_LABEL[lst.status]}</span></div>
        <div class="meter" aria-label="${lst.window.independent} of 10 independent in recent checks">${Array.from({ length: 10 }, (_, i) => `<span class="${i < lst.window.independent ? 'on' : i < lst.window.size ? 'tried' : ''}"></span>`).join('')}</div>
        <p class="small muted">${lst.status === 'secure' || lst.status === 'retained'
          ? `Secure since ${FMG.prettyDate(lst.secureDate)}.${lst.retainedDate ? ` Retained ${FMG.prettyDate(lst.retainedDate)}.` : ''}${lst.reviewDue ? ` Next review ${FMG.prettyDate(lst.reviewDue)}.` : ''}`
          : `Checks and reviews build evidence. Next small goal: ${esc(reasons[0] || 'keep going!')}.`}</p>
        ${st.readiness.ready ? '<p class="small ok-text">✓ Ready to try the next skill (from a 4/5 check).</p>' : ''}
        ${lst.needsReview ? '<p class="small warn-text">Needs review: a recent retention check was tricky. Your earlier achievement is kept.</p>' : ''}
      </section>`, { back: `#/topic/${t.id}`, title: t.child });
    $$('[data-level]').forEach((b) => b.addEventListener('click', () => {
      const lv = b.dataset.level;
      saved(updateProfile((x) => { x.prefs.levels = x.prefs.levels || {}; x.prefs.levels[k.id] = lv; x.prefs.steps = x.prefs.steps || {}; x.prefs.steps[k.id] = GEN.stepOfLevel(lv); }));
      keepScroll = true; render();
      const nb = $(`[data-level="${lv}"]`); if (nb) { nb.focus({ preventScroll: true }); nb.classList.add('pop'); }
    }));
    $$('[data-step]').forEach((b) => b.addEventListener('click', () => {
      saved(saveStep(k.id, +b.dataset.step));
      keepScroll = true; render();
      const nb = $(`[data-step="${b.dataset.step}"]`); if (nb) nb.focus({ preventScroll: true });
    }));
    $$('[data-goto-level]').forEach((b) => b.addEventListener('click', () => { const r = $(`.levels [data-level="${b.dataset.gotoLevel}"]`); if (r) r.click(); }));
  });
  /* "What you'll learn": the topics inside this skill, in learning order, tagged by level (data: js/syllabus.js). */
  function learnList(id, st, level) {
    const list = (FMG.SYLLABUS || {})[id];
    if (!list || !list.length) return '';
    const L = GEN.LEVELS, cur = L.indexOf(level);
    const done = (l) => { const s = st.levels.find((x) => x.level === L[l]); return !!s && (s.status === 'secure' || s.status === 'retained'); };
    const used = L.filter((_, i) => list.some((t) => t.l === i)).length;
    const rows = list.map((t, i) => {
      const d = done(t.l), on = t.l <= cur, first = i === 0 || list[i - 1].l !== t.l;
      const head = first ? `<li class="wl-lv${t.l === cur ? ' on' : ''}"><button type="button" data-goto-level="${L[t.l]}">${GEN.LEVEL_NAMES[L[t.l]]}${d ? ' <span class="wl-ok">✓ Secure</span>' : t.l === cur ? ' <span class="wl-cur">Your level</span>' : ''}</button></li>` : '';
      return `${head}<li class="wl-t${d ? ' done' : ''}${on ? ' on' : ''}${t.l > cur && !d ? ' later' : ''}"><span class="wl-n" aria-hidden="true">${d ? '✓' : i + 1}</span><span class="wl-x">${esc(t.t)}</span></li>`;
    }).join('');
    const upTo = list.filter((t) => t.l <= cur).length;
    const foot = upTo >= list.length ? `${GEN.LEVEL_NAMES[level]} covers every topic in this skill.` : `${GEN.LEVEL_NAMES[level]} covers topic${upTo > 1 ? 's 1–' + upTo : ' 1'}. Choose a higher level for the rest.`;
    return `<details class="card wl" open>
      <summary><span class="wl-h"><span class="h3">What you’ll learn</span><span class="small muted">${list.length} topics · ${used} level${used > 1 ? 's' : ''}</span></span><span class="wl-chev" aria-hidden="true"></span></summary>
      <ol class="wl-list">${rows}</ol>
      <p class="small muted wl-foot">${foot}</p>
    </details>`;
  }
  /* The six-step ladder (Routine, stepping stone, Application, stepping stone, Stretch, Stretch+). */
  function stepFor(p, skillId) {
    const st = (p.prefs.steps || {})[skillId];
    return st != null ? st : GEN.stepOfLevel((p.prefs.levels || {})[skillId] || 'routine');
  }
  function saveStep(skillId, step) {
    return updateProfile((x) => { x.prefs.steps = x.prefs.steps || {}; x.prefs.steps[skillId] = step; x.prefs.levels = x.prefs.levels || {}; x.prefs.levels[skillId] = GEN.levelOfStep(step); });
  }
  const LEVEL_DESC = {
    routine: 'Core questions: shown on the screen, the easier words and texts.',
    application: 'Other ways of asking: listening, pictures, odd one out, harder words and texts.',
    stretch: 'The hardest: typing the answer, “Kit says…”, the longest words and the hardest texts.',
  };
  function modeIcon(m) {
    const P = { learn: '<path d="M4 6.5C6.5 5 9.5 5 12 6.5v12c-2.5-1.5-5.5-1.5-8 0zM20 6.5C17.5 5 14.5 5 12 6.5v12c2.5-1.5 5.5-1.5 8 0z"/>', practice: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', exam: '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12.5l1.5 1.5 3-3.5M9.5 17.5h5"/>', endless: '<path d="M7.5 9.5a3.5 3.5 0 1 0 0 5c2-1.4 3-3.6 4.5-5 1.5-1.4 2.5-3.6 4.5-5a3.5 3.5 0 1 1 0 5" transform="translate(0 2.5)"/>' };
    return `<svg viewBox="0 0 24 24" class="ic" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[m]}</svg>`;
  }

  /* ================= Attempts ================= */
  function newAttempt(q, origin, sessionId) {
    const p = profile();
    return {
      id: FMG.uid('a'), profileId: p.id, skillId: q.skillId, level: q.level, origin, sessionId,
      templateId: q.templateId, templateVersion: q.version, seed: q.seed, kind: q.kind, responseType: q.responseType,
      context: q.context, factKey: q.factKey, startedAt: FMG.clock.now(), committed: false, committedAt: null, date: null,
      firstResponse: null, firstCorrect: null, hints: 0, revealingHelpBeforeFirst: false, solutionShown: false,
      finalResponse: null, finalCorrect: null, tags: [], notTaught: false, policy: EV.POLICY_VERSION,
    };
  }
  function commitAttempt(att) {
    if (!att.committed) { att.committed = true; att.committedAt = FMG.clock.now(); att.date = FMG.today(); }
    const res = store.upsertAttempt(att);
    saved(res);
    return res;
  }

  /* ================= Lesson player ================= */
  route(/^#\/learn\/([\w-]+)$/, (id) => startLesson(id, true));
  /* ================= Learn engine: accumulating worked examples (docs/lesson-engine.md) =================
     A lesson plan has: hook, bigIdea, example {q, visual, walk}, yourTurn {q, visual, walk, task}, tries [...],
     method, mistake. Steps are never replaced: Next adds one step, the diagram beside it updates in sync. */
  let lessonKeys = null;
  const SKL = () => (FMG.skillLib && FMG.skillLib.SK) || [];
  const plainText = (h) => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  function walkOf(o) {
    if (o && Array.isArray(o.walk) && o.walk.length) return o.walk;
    return ((o && o.steps) || []).map((s) => ({ math: s }));
  }
  /* Lesson plan from the skill's own generator (skills-en.js lessonQ): example and "your turn" at Routine,
     then one ordinary try at Application and one transfer try. */
  function planFromSkill(id, seed) {
    const S = SKL_LIB() && SKL_LIB().get(id);
    if (!S) return null;
    const r = FMG.rng(seed);
    const piece = (step, kind) => SKL_LIB().lessonQ(S, r, step, kind);
    const ex = piece(0), yt = piece(0), tr = piece(2), tf = piece(2, 'transfer');
    if (!ex || !yt) return null;
    const lastWhy = (o) => { const w = o.walk; return w.length ? plainText(w[w.length - 1].why || '') : ''; };
    const rec = (task, kind) => Object.assign({}, task, { record: true, kind });
    return {
      plan: true, title: S.name, early: S.stages && S.stages[0] === 'eyfs',
      bigIdea: esc(S.bigIdea || S.obj), objective: S.obj,
      example: { q: ex.q, speak: ex.speak, visual: ex.visual, walk: ex.walk },
      yourTurn: { q: yt.q, speak: yt.speak, visual: yt.visual, walk: yt.walk, task: Object.assign({}, yt.task, { record: false }), why: lastWhy(yt) },
      tries: [tr && { phase: 'Try on your own', q: tr.q, speak: tr.speak, visual: tr.visual, task: rec(tr.task, 'procedure') },
        tf && { phase: 'Try it a new way', q: tf.q, speak: tf.speak, visual: tf.visual, task: rec(tf.task, 'transfer') }].filter(Boolean),
      method: (S.method || []).map(esc), mistake: S.mistake ? { wrong: esc(S.mistake.wrong), fix: esc(S.mistake.fix) } : null, rule: ex.hint,
    };
  }

    const stageBar = () => `<nav class="lsn-stages" aria-label="Lesson stages">${STAGES.map((s, i) => `<button class="lsn-stage ${i < st.stage ? 'done' : i === st.stage ? 'cur' : ''}" data-stage="${i}" ${i > st.stage ? 'disabled' : ''} aria-current="${i === st.stage ? 'step' : 'false'}"><span class="ls-dot">${i < st.stage ? '✓' : i + 1}</span><span class="ls-name">${s.name}</span></button>`).join('')}</nav>`;
    const stepLi = (w, i, cls) => `<li class="lsn-step ${cls}" data-view="${i + 1}" style="--d:${i}">
        <span class="lsn-num" aria-hidden="true">${i + 1}</span>

    const board = (o, shown, extra, opts = {}) => {

            ${(plan.hook && plan.hook.visual) || ex.visual ? `<figure class="lsn-vis solo" id="stage">${VIZ.render((plan.hook && plan.hook.visual) || ex.visual, {})}</figure>` : ''}

            <div class="lsn-kicker">Method card</div>

      shell(`<div class="lsn">${stageBar()}${body}<div id="undbox"></div><div class="lsn-nav">${nav}</div></div>`, { back: `#/skill/${id}`, title: plan.title, cls: 'lesson-page' });
      FMG.app.ctx = { screen: 'lesson', skill: plan.title, step: s === 'watch' && st.k ? plainText([ex.walk[st.k - 1].do, ex.walk[st.k - 1].math].filter(Boolean).join(': ')) : s === 'try' ? plainText(tries[st.tryIdx].q) : plainText(ex.q) };

        mountUnderstand(ubox, () => understandWays(id, null, { example: ex.walk && ex.walk.length ? { q: ex.q, visual: ex.visual, walk: ex.walk } : null, bigIdea: plan.bigIdea, method: plan.method, mistake: plan.mistake }), () => { ub.textContent = 'I don’t understand'; });
        ubox.scrollIntoView({ block: 'start', behavior: 'smooth' });

      $$('[data-stage]').forEach((b) => (b.onclick = () => { st.stage = +b.dataset.stage; st.view = null; keepScroll = false; draw(); }));

        if (e.target.closest('summary, details, button, input, a')) return;
        const v = +li.dataset.view; const cur = STAGES[st.stage].id === 'watch' ? st.k : null;
        st.view = st.view === v || v === cur ? null : v; draw();
      }));
      const lt = $('#latest'); if (lt) lt.onclick = () => { st.view = null; draw(); };
      const prev = $('#prev');
      if (prev) prev.onclick = () => {
        st.view = null;

        st.view = null;

      const an = $('#another'); if (an) an.onclick = () => startLesson(id, false);
      if (s === 'turn' && !st.turnDone && yt.task) {
        const last = yt.walk[yt.walk.length - 1] || {};
        mountLessonTask({ phase: 'Your turn', text: yt.q, visual: yt.visual }, yt.task, () => {
          st.turnDone = true;
          setTimeout(() => { draw(); const why = last.why || yt.why; if (why) speakIfOn(plainText(why)); }, 650);
        }, sessionId, id);
      }
      if (s === 'try') { const t = tries[st.tryIdx]; if (t.task) mountLessonTask({ phase: t.phase, text: t.q, visual: t.visual }, t.task, () => {}, sessionId, id); }
      if (s === 'idea') speakIfOn(plainText(plan.bigIdea));
      if (focusNext) {
        const cur = $('.lsn-step.cur'); if (cur) { const r = cur.getBoundingClientRect(); if (r.bottom > innerHeight - 90 || r.top < 70) cur.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }

    };
    const speakStep = (w, force) => { if (!w) return; const t = plainText([w.do, w.math, w.why].filter(Boolean).join('. ')); if (force) speech.say(t); else speakIfOn(t); };
    // Arrow keys move through the lesson (not while typing an answer).
    const onKey = (e) => {
      if (!$('.lsn')) { document.removeEventListener('keydown', onKey); return; }
      if (e.target.closest && e.target.closest('input, textarea, select, .cz-calc, [class*="cz-"]')) return;

    document.addEventListener('keydown', onKey);
    draw();
  }
  const svgArrowR = () => '<svg viewBox="0 0 24 24" class="ic" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  /* ================= "I don't understand" =================
     Never gives this question's answer away: it explains a SIMILAR example (new numbers), and
     "Explain it differently" moves through genuinely different ways of seeing it. */
  function understandWays(skillId, avoidKey, extra = {}) {
    const S = SKL().find((s) => s.id === skillId);
    let o = null;
    if (S && SKL_LIB()) {
      for (let i = 0; i < 12 && !o; i++) { const c = SKL_LIB().example(skillId, FMG.newSeed(), 0); if (c && c.key !== avoidKey) o = c; }
    }
    o = o || extra.example || null;
    const ways = [];
    const walk = o ? walkOf(o) : [];
    if (walk.length) ways.push({ id: 'walk', name: 'Step by step', icon: '①' });
    const pics = o ? ((o.pics && o.pics.length ? o.pics : (o.pic ? [o.pic] : [])).filter(Boolean)) : [];
    if (pics.length) ways.push({ id: 'pic', name: 'As a picture', icon: '◐' });
    if (o && o.alt && o.alt.length) ways.push({ id: 'alt', name: 'Another way to think', icon: '↺' });
    const bigIdea = esc((S && S.bigIdea) || extra.bigIdea || (S && S.obj) || '');
    if (bigIdea) ways.push({ id: 'idea', name: 'The big idea', icon: '★' });
    const tool = FMG.tools && FMG.tools.suggest ? (() => { try { return FMG.tools.suggest(skillId, S && S.topic); } catch (e) { return null; } })() : null;
    if (tool && tool.id) ways.push({ id: 'tool', name: 'Try it hands-on', icon: '✋' });
    const mis = (S && S.mistake) || extra.mistake;
    return { S, o, walk, pics, ways, bigIdea, tool, method: ((S && S.method) || extra.method || []).map((x) => (S && S.method ? esc(x) : x)), mistake: mis && S && S.mistake ? { wrong: esc(mis.wrong), fix: esc(mis.fix) } : mis, check: o && o.check };
  }
  function understandPanel(U, st) {
    if (!U.ways.length) return `<section class="und"><p>Let's ask a grown-up to help with this one, or open the lesson for this skill.</p></section>`;
    const w = U.ways[st.i % U.ways.length];
    let body = '';
    if (w.id === 'walk') {
      const n = Math.max(1, Math.min(st.k, U.walk.length));
      let v = U.o.visual; for (let i = 0; i < n; i++) if (U.walk[i].see) v = U.walk[i].see;
      body = `<div class="und-q"><span class="lsn-q-tag">A similar one</span>${U.o.q}</div>
        <div class="ex-walk">${v ? `<figure class="lsn-vis">${VIZ.render(v, {})}</figure>` : ''}
        <ol class="lsn-steps">${U.walk.slice(0, n).map((x, i) => `<li class="lsn-step ${i === n - 1 ? 'cur' : 'past'}"><span class="lsn-num" aria-hidden="true">${i + 1}</span><div class="lsn-body">${x.do ? `<div class="lsn-do">${x.do}</div>` : ''}<div class="lsn-math">${x.math}</div>${x.why ? `<div class="lsn-why"><span class="why-tag">Why?</span> ${x.why}</div>` : ''}</div></li>`).join('')}</ol></div>
        <div class="ex-ctl">${n < U.walk.length ? `<button class="btn primary sm" data-und-step>Next step (${n}/${U.walk.length})</button><button class="btn ghost sm" data-und-all>Show all</button>` : `<span class="small muted">Now try yours the same way.</span>`}</div>`;
    } else if (w.id === 'pic') {
      const k = st.p % U.pics.length, cur = U.pics[k];
      body = `<div class="und-q"><span class="lsn-q-tag">A similar one</span>${U.o.q}</div>
        ${U.pics.length > 1 ? `<div class="pic-sw">${U.pics.map((x, i) => `<button class="pic-tab" aria-selected="${i === k}" data-und-pic="${i}">${esc(x.title || 'Picture ' + (i + 1))}</button>`).join('')}</div>` : ''}
        <figure class="lsn-vis solo">${VIZ.render(cur, {})}</figure>`;
    } else if (w.id === 'alt') {
      body = `<div class="und-q"><span class="lsn-q-tag">A similar one</span>${U.o.q}</div><ol class="lsn-method">${U.o.alt.map((x) => `<li>${x}</li>`).join('')}</ol>`;
    } else if (w.id === 'idea') {
      body = `<p class="lsn-card-idea">${U.bigIdea}</p>
        ${U.method ? `<h3 class="h3" style="margin-top:.8rem">The method</h3><ol class="lsn-method">${U.method.map((x) => `<li>${x}</li>`).join('')}</ol>` : ''}
        ${U.mistake ? `<div class="lsn-mistake" style="margin-top:.8rem"><div><span class="mk bad">✗</span> ${U.mistake.wrong}</div><div><span class="mk good">✓</span> ${U.mistake.fix}</div></div>` : ''}`;
    } else if (w.id === 'tool') {
      body = `<p>Sometimes it clicks when you can move things around yourself.</p><a class="btn primary" href="${toHash('/tool/' + U.tool.id + (U.tool.preset ? '/' + U.tool.preset : ''))}">${svgTools()} ${esc(U.tool.label || 'Open the tool')}</a><p class="small muted" style="margin-top:.6rem">Your question will still be here when you come back with the back button.</p>`;
    }
    return `<section class="und" aria-label="Help me understand">
      <div class="und-head"><div><div class="lsn-kicker">Let's look at it ${st.i === 0 ? 'together' : 'another way'}</div>
        <div class="und-ways" role="tablist">${U.ways.map((x, i) => `<button role="tab" class="und-way" aria-selected="${i === st.i % U.ways.length}" data-und-way="${i}"><span aria-hidden="true">${x.icon}</span> ${x.name}</button>`).join('')}</div></div>
        <button class="iconbtn" data-und-close aria-label="Close">✕</button></div>
      <div class="und-body">${body}</div>
      <div class="und-foot"><button class="btn primary" data-und-next>Explain it differently ${svgArrowR()}</button>${U.o ? `<button class="btn ghost sm" data-und-new>Another example</button>` : ''}</div>
    </section>`;
  }
  /* Mount the panel into `box`; `regen` builds a fresh U (new similar example); onOpen runs once. */
  function mountUnderstand(box, makeU, onClose) {
    let U = makeU();
    const st = { i: 0, k: 1, p: 0 };
    const draw = () => {
      box.innerHTML = understandPanel(U, st);
      const on = (sel, fn) => { const b = $(sel, box); if (b) b.onclick = fn; };
      on('[data-und-next]', () => { st.i = (st.i + 1) % Math.max(1, U.ways.length); st.k = 1; st.p = 0; draw(); box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
      on('[data-und-new]', () => { U = makeU(); st.k = 1; st.p = 0; st.i = st.i % Math.max(1, U.ways.length); draw(); });
      on('[data-und-step]', () => { st.k++; draw(); });
      on('[data-und-all]', () => { st.k = 99; draw(); });
      on('[data-und-close]', () => { box.innerHTML = ''; if (onClose) onClose(); });
      $$('[data-und-way]', box).forEach((b) => (b.onclick = () => { st.i = +b.dataset.undWay; st.k = 1; st.p = 0; draw(); }));
      $$('[data-und-pic]', box).forEach((b) => (b.onclick = () => { st.p = +b.dataset.undPic; draw(); }));
      const t = $('.und-body', box); if (t) speakIfOn(plainText(t.textContent).slice(0, 400));
    };
    draw();
  }

  function startOldLesson(id, L, steps) {

    const done = {};
    const draw = () => {
      const s = steps[i];
      const task = s.task;
      const st = Object.assign({}, s.state || {}, { added: (s.state && s.state.added) || 0 });
      shell(`
        <div class="lesson">
          <div class="steps" aria-label="Step ${i + 1} of ${steps.length}">${steps.map((x, j) => `<span class="${j < i ? 'done' : j === i ? 'cur' : ''}" title="${esc(x.phase)}"></span>`).join('')}</div>
          <div class="phase">${esc(s.phase)}</div>
          <h1 class="lesson-text">${s.text}</h1>
          ${L.early || s.speak ? `<button class="iconbtn speak" id="say" aria-label="Hear it again">${svgSpeaker()}</button>` : ''}
          <div class="stage ${s.highlightEmpty ? 'hl-empty' : ''}" id="stage">${VIZ.render(s.visual, { ...st, interactive: task && task.type === 'tap-fill' })}</div>
          <div id="task"></div>
          <div class="lesson-nav">
            <button class="btn ghost" id="prev" ${i === 0 ? 'disabled' : ''}>Back</button>
            <button class="btn ghost" id="replay">Replay</button>
            ${i < steps.length - 1 ? `<button class="btn primary" id="next">Next</button>` : `<div class="end-actions"><button class="btn ghost" id="another">Another example</button><a class="btn primary" href="#/play/practice/${id}">Practise</a></div>`}
          </div>

      if ($('#say')) $('#say').onclick = () => { if (FMG.speakHighlight) FMG.speakHighlight.next($('#say').parentElement); speech.say(s.speak || s.text); };

  function mountLessonTask(step, task, onDone, sessionId, skillId) {
    const box = $('#task');
