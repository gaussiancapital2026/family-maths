    let att = task.record ? newAttempt(fakeQ, 'learn', sessionId) : null;
    const feedback = (ok, msg) => {
      box.querySelector('.fb')?.remove();
      box.insertAdjacentHTML('beforeend', `<div class="fb ${ok ? 'good' : 'try'}" role="status">${msg}</div>`);
      if (ok && FMG.celebrate) { const pl = profile(); const cheer = FMG.celebrate.correct({ name: pl.nickname, young: pl.prefs.ui === 'playful' || pl.route === 'eyfs' || pl.route === 'ks1', from: box.querySelector('.fb') }); const fbEl = box.querySelector('.fb'); if (fbEl) fbEl.insertAdjacentHTML('afterbegin', `<b>${cheer}</b> `); }
      else if (FMG.buddy) FMG.buddy.react(ok ? 'good' : 'try');
      if (ok) onDone();
    };
    const record = (ok, resp) => { if (!att) return; if (att.firstCorrect == null) { att.firstCorrect = ok; att.firstResponse = resp; } att.finalCorrect = ok; att.finalResponse = resp; commitAttempt(att); };

    if (task.type === 'tap-fill') {
      let added = 0;
      const stage = $('#stage');
      const redraw = () => { stage.innerHTML = VIZ.render(step.visual, { added, interactive: true }); bindCells(); };
      const bindCells = () => {
        $$('[data-cell]', stage).forEach((c) => (c.onclick = () => { const idx = +c.dataset.cell; const v = step.visual; if (idx < v.have + added) added = Math.max(0, idx - v.have); else added = idx - v.have + 1; redraw(); }));
        $$('[data-scatter]', stage).forEach((c) => (c.onclick = () => { added = Math.max(0, Math.min(5, added + +c.dataset.scatter)); redraw(); }));
      };
      bindCells();
      box.innerHTML = `<div class="tap-actions"><button class="btn round big good" id="tick" aria-label="Done">✓</button></div>`;
      $('#tick').onclick = () => {
        const total = step.visual.have + added;
        const ok = added === task.target;
        record(ok, String(added));
        feedback(ok, ok ? `Yes! ${step.visual.have} and ${added} make 5. ⭐` : total > 5 ? 'Too many — that’s more than five. Take some away.' : `Not five yet — count again. There ${5 - total === 1 ? 'is 1 empty space' : `are ${5 - total} empty spaces`}.`);
        if (!ok) speakIfOn(total > 5 ? 'Too many. Take some away.' : 'Not five yet. Count again.');
      };
      return;
    }
    if (task.type === 'pick') {
      box.innerHTML = pickPad(task.pickMin || 0, task.pickMax);
      $$('[data-pick]', box).forEach((b) => (b.onclick = () => {
        const ok = MARK.mark(b.dataset.pick, { type: 'number', answer: task.answer }).status === 'correct';
        $$('[data-pick]', box).forEach((x) => x.classList.remove('right', 'wrong'));
        b.classList.add(ok ? 'right' : 'wrong');
        record(ok, b.dataset.pick);
        feedback(ok, ok ? 'Yes! ⭐' : `Not quite. ${task.hint || 'Try again.'}`);
        if (!ok) speakIfOn('Not quite. ' + (task.hint || 'Try again.'));
      }));
      return;
    }
    if (task.type === 'trace') {
      box.innerHTML = `<div class="tr-wrap"><div id="lpad"></div><div class="small" id="ltfb" aria-live="polite"></div></div>`;
      let tries = 0;
      FMG.trace.mount($('#lpad', box), task.letter, { guide: task.guide !== false, onStroke: (nn, of, ok, why) => { if (ok) { $('#ltfb', box).textContent = nn < of ? `Lovely! Now stroke ${nn + 1} of ${of}.` : ''; return; } tries++; $('#ltfb', box).textContent = why === 'start' ? 'Start at the green dot.' : 'Nearly! Follow the grey line from the green dot.'; },
        onDone: () => { record(tries === 0, `trace ${task.letter}`); feedback(true, `Beautiful ${esc(task.letter)}! ✓`); } });
      return;
    }
    if (task.type === 'text' && (box.dataset.am || defaultAnswerMode('learn')) === 'type') {
      box.innerHTML = textBox() + `<div class="ans-foot">${answerModeSwitch('type')}</div>`;
      $$('[data-am]', box).forEach((b) => (b.onclick = () => { if (b.dataset.am === 'abcd') { box.dataset.am = 'abcd'; updateProfile((x) => { x.prefs.answerMode = 'abcd'; }); mountLessonTask(step, task, onDone, sessionId, skillId); } }));
      const inp = $('#ans', box); setTimeout(() => inp.focus({ preventScroll: true }), 30);
      const go2 = () => { const r = MARK.mark(inp.value, { type: 'text', accept: task.accept, wrong: task.wrong, tolerance: task.tolerance }); if (r.status === 'unclear') return feedback(false, r.message); const ok = r.status === 'correct'; record(ok, inp.value); feedback(ok, ok ? `Yes. ${r.message ? r.message + ' ' : ''}${esc(task.explain || '')}` : 'Not quite. Have another look and try again.'); };
      $('#go', box).onclick = go2; inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go2(); });
      return;
    }
    if (task.type === 'choice' || task.type === 'text') {
      box.innerHTML = `<div class="abcd ${task.choiceKind === 'pic' ? 'pics' : ''}">${task.choices.map((c, i) => `<button type="button" class="abcd-opt" data-c="${c.id}"><span class="abcd-l" aria-hidden="true">${LETTERS[i] || i + 1}</span><span class="abcd-v">${esc(c.label)}</span></button>`).join('')}</div>${task.type === 'text' ? `<div class="ans-foot">${answerModeSwitch('abcd')}</div>` : ''}`;
      if (task.type === 'text') $$('[data-am]', box).forEach((b) => (b.onclick = () => { if (b.dataset.am === 'type') { box.dataset.am = 'type'; updateProfile((x) => { x.prefs.answerMode = 'type'; }); mountLessonTask(step, task, onDone, sessionId, skillId); } }));
      bindLetterKeys(box, '[data-c]');
      $$('[data-c]', box).forEach((b) => (b.onclick = () => {
        const ok = b.dataset.c === task.correct;
        b.classList.add(ok ? 'right' : 'wrong'); if (!ok) b.disabled = true;
        if (att && att.firstCorrect == null) att.responseType = 'choice';
        record(ok, b.textContent.trim().slice(1));
        feedback(ok, ok ? `Yes. ${esc(task.explain || '')}` : (task.wrongMsg || 'Not quite. Have another look and try again.'));
      }));
      return;
    }
    // number / solutions: A–D by default (learner can switch to typing)
    const tspec = task.type === 'solutions' ? { type: 'solutions', answer: task.answer } : { type: 'number', answer: task.answer, pi: task.pi };
    const lopts = abcdOptions(tspec, (task.answer && task.answer.n ? task.answer.n : 3) * 17 + (step.phase || '').length, step.text || '');
    const lmode = defaultAnswerMode('learn');
    if (lopts && (box.dataset.am || lmode) === 'abcd') {
      box.innerHTML = `${abcdHtml(lopts)}<div class="ans-foot">${answerModeSwitch('abcd')}</div>`;
      $$('[data-abcd]', box).forEach((b) => (b.onclick = () => {
        const o = lopts[+b.dataset.abcd];
        b.classList.add(o.correct ? 'right' : 'wrong'); if (!o.correct) b.disabled = true;
        if (att && att.firstCorrect == null) att.responseType = 'choice';
        record(o.correct, o.typed);
        feedback(o.correct, o.correct ? 'Correct! ✓' : `Not quite. ${task.hint ? 'Hint: ' + task.hint : 'Have another look.'}`);
      }));
      bindLetterKeys(box, '[data-abcd]');
      $$('[data-am]', box).forEach((b) => (b.onclick = () => { if (b.dataset.am === 'type') { box.dataset.am = 'type'; updateProfile((x) => { x.prefs.answerMode = 'type'; }); mountLessonTask(step, task, onDone, sessionId, skillId); $('#ans', box)?.focus(); } }));
      return;
    }
    box.innerHTML = answerBox(task.pi ? 'e.g. 14π' : 'Your answer', { pi: task.pi }) + (lopts ? `<div class="ans-foot">${answerModeSwitch('type')}</div>` : '');
    $$('[data-am]', box).forEach((b) => (b.onclick = () => { if (b.dataset.am === 'abcd') { box.dataset.am = 'abcd'; updateProfile((x) => { x.prefs.answerMode = 'abcd'; }); mountLessonTask(step, task, onDone, sessionId, skillId); } }));
    const inp = $('#ans', box);
    bindPreview(inp);
    const submit = () => {
      const spec = task.type === 'solutions' ? { type: 'solutions', answer: task.answer, variable: 'x' } : { type: 'number', answer: task.answer, exact: true, requireForm: task.requireForm, pi: task.pi };
      const r = MARK.mark(inp.value, spec);
      if (r.status === 'unclear') return feedback(false, r.message);
      const ok = r.status === 'correct';
      record(ok, inp.value);
      let msg = ok ? 'Correct! ✓' : (r.message || null);
      if (!ok && task.wrongHelp) { const p = MARK.parseNumber(MARK.normalise(inp.value).replace(/^x\s?=\s?/, '')); msg = (p && p.q && task.wrongHelp(p.q)) || msg; }
      if (!ok && !msg) msg = `Not quite. Hint: ${task.hint}`;
      feedback(ok, msg);
    };
    $('#go', box).onclick = submit;
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    bindKeypad(box, inp);
  }

  function pickPad(min, max) {
    return `<div class="pickpad" role="group" aria-label="Tap a number">${Array.from({ length: max - min + 1 }, (_, i) => `<button type="button" class="pick" data-pick="${min + i}">${min + i}</button>`).join('')}</div>`;
  }
  /* Typed English answers: a plain text box (no number keypad). */
  function textBox(placeholder = 'Type your answer') {
    return `<div class="answer"><div class="ans-row"><input id="ans" class="ans-input text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" placeholder="${placeholder}" aria-label="Your answer"><button class="btn primary" id="go">Check</button></div></div>`;
  }
  function answerBox(placeholder = 'Your answer', opts = {}) {
    return `<div class="answer">
      <div class="ans-row"><input id="ans" class="ans-input" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="${placeholder}" aria-label="Your answer"><button class="btn primary" id="go">Check</button></div>
      <div class="preview" id="preview" aria-live="polite"></div>
      <div class="keypad" aria-label="Keypad">${['7', '8', '9', '/', '4', '5', '6', '−', '1', '2', '3', opts.pi ? 'π' : 'x =', '0', '.', ' ', '⌫'].map((k) => `<button type="button" class="key ${k === ' ' ? 'space' : ''}" data-k="${k}" aria-label="${k === ' ' ? 'space' : k === '⌫' ? 'delete' : k}">${k === ' ' ? '␣' : k}</button>`).join('')}</div>
    </div>`;
  }
  function bindKeypad(box, inp) {
    $$('[data-k]', box).forEach((b) => (b.onclick = () => {
      const k = b.dataset.k;
      if (k === '⌫') inp.value = inp.value.slice(0, -1);
      else inp.value += k === '−' ? '-' : k === 'x =' ? 'x = ' : k;
      inp.dispatchEvent(new Event('input'));
      inp.focus({ preventScroll: true });
    }));
  }
  function bindPreview(inp) {
    const pv = $('#preview');
    inp.addEventListener('input', () => {
      const s = MARK.normalise(inp.value).replace(/^x\s?=\s?/, '');
      const p = MARK.parseNumber(s);
      pv.innerHTML = p && p.q && (p.form === 'fraction' || p.form === 'mixed') ? `You wrote: ${p.form === 'mixed' ? `${p.whole} ` : ''}${FMG.fracTxt(p.rawN, p.rawD)}` : '';
    });
    setTimeout(() => inp.focus({ preventScroll: true }), 30);
  }

  /* ================= Question sessions: practice / endless / check / review / gcse ================= */
  route(/^#\/play\/(practice|endless|check|review)\/([\w-]+)$/, (mode, id) => startSession(mode, id));

  function startSession(mode, skillId, xcfg) {
    const p = profile();
    if (!CUR.skill(skillId) || CUR.skill(skillId).status !== 'released') return go('#/home');
    const level = mode === 'gcse' ? 'stretch' : (p.prefs.levels || {})[skillId] || 'routine';
    const count = mode === 'practice' ? p.prefs.practiceCount : mode === 'gcse' ? 3 : 5;
    const step = mode === 'gcse' ? 4 : stepFor(p, skillId), info = GEN.stepInfo(skillId, step);
    const plan = mode === 'endless' ? null : GEN.blueprint(skillId, mode, { count, bands: info.bands });
    const recent = attemptsOf(p.id).filter((a) => a.skillId === skillId).sort((a, b) => b.committedAt - a.committedAt).slice(0, 20).map((a) => `${a.templateId}|${a.factKey}`);
    // In Check/Review avoid recently seen procedural instances; facts may recur across sessions.
    const S = { id: FMG.uid('s'), mode, skillId, level, plan, i: 0, results: [], recent, streak: { good: 0, bad: 0 }, levelNow: level, step, paused: false, offered: null, exam: xcfg || null };
    if (xcfg) { S.step = xcfg.step(); S.levelNow = GEN.levelOfStep(S.step); S.plan = null; }
    if (mode === 'practice' || mode === 'endless') S.levelNow = info.level;
    else if (mode !== 'gcse') S.levelNow = GEN.levelOfStep(step);
    nextQuestion(S);
  }

  function nextQuestion(S) {
    const total = S.plan ? S.plan.length : null;
    if (S.plan && S.i >= S.plan.length) return summary(S);
    const info = GEN.stepInfo(S.skillId, S.step);
    const ladderMode = S.mode === 'practice' || S.mode === 'endless';
    if (S.exam) { const x = S.exam.pick(S); S.skillId = x.skillId; S.step = x.step; S.levelNow = GEN.levelOfStep(x.step); }
    const tid = S.plan ? S.plan[S.i] : GEN.endlessTemplate(S.skillId, S.i + (S.eoff = S.eoff ?? Math.floor(Math.random() * 997)), info.bands);
    const q = GEN.draw(tid, S.levelNow, S.recent, undefined, ladderMode ? { gentle: info.gentle, plus: info.plus, step: S.step } : { step: S.step });
    if (!q) { S.i++; if (S.i > 200) return summary(S); return nextQuestion(S); }
    S.recent.unshift(q.fingerprint); S.recent = S.recent.slice(0, 80);
    S.q = q;
    S.att = newAttempt(q, S.mode, S.id);
    S.part = 0; S.tries = 0; S.hintIdx = 0; S.done = false; S.added = 0; S.showSol = false; S.exTab = 'steps'; S.exStep = 1; S.exPic = 0; S.shownHints = []; S.visualStage = undefined; S.undOpen = false; if (S.mode === 'check' || S.mode === 'review' || S.mode === 'exam') S.ansMode = S.ansMode || 'type';
    if (q.preferType && !S.ansModeChosen) S.qAnsMode = 'type'; else S.qAnsMode = null;
    drawQuestion(S, total);
  }

  function drawQuestion(S, total) {
    const q = S.q, p = profile();
    const playful = p.prefs.ui === 'playful';
    const k = CUR.skill(S.skillId);
    const label = { practice: 'Practice', endless: 'Endless', check: 'Check', review: 'Review', exam: 'Exam question' }[S.mode];
    const prog = total ? `<div class="qprog" aria-label="Question ${S.i + 1} of ${total}">${Array.from({ length: total }, (_, j) => `<span class="${j < S.i ? (S.results[j] === 'independent' ? 'good' : 'done') : j === S.i ? 'cur' : ''}"></span>`).join('')}</div>`
      : `<div class="qcount">${S.i + 1}</div>`;
    const gcseTags = q.gcse ? `<div class="gcse-tags"><span class="pill tier">Foundation & Higher</span><span class="pill">${q.calculator}</span><span class="pill">${q.ao.join(' · ')}</span><span class="pill">${q.marks} marks</span><span class="pill subtle">${esc(q.objective)}</span></div>` : '';
    const part = q.parts ? q.parts[S.part] : null;
    shell(`
      <div class="qwrap">
        <div class="qtop">
          <span class="qmode">${label}${S.mode === 'check' || S.mode === 'review' ? ' <span class="muted small">· first answers count</span>' : ''}${(S.mode === 'endless' || S.mode === 'practice') ? ` <span class="step-chip" title="Step ${S.step + 1} of 6">${S.step + 1}/6 · ${esc(GEN.stepInfo(S.skillId, S.step).name)}</span>` : ''}</span>
          ${prog}
          ${(S.mode === 'endless' || S.mode === 'practice') && !S.done ? `<button class="btn ghost sm pass-btn" id="pass" title="Pass on this one and go to the next question">Pass ${svgArrowR()}</button>` : ''}
          ${S.mode === 'endless' ? `<button class="btn ghost sm" id="pause">Pause</button>` : ''}
          <button class="btn ghost sm" id="finish">${S.mode === 'endless' ? 'Finish' : 'Stop'}</button>
        </div>
        ${S.offered ? `<div class="offer">${S.offered}</div>` : ''}
        ${S.exam ? S.exam.bar(S) : ''}${S.exam ? `<div class="gcse-tags"><span class="pill tier">${esc(S.exam.level(S))}</span><span class="pill">${q.marks || 1} mark${(q.marks || 1) > 1 ? 's' : ''}</span><span class="pill subtle">${esc(k.name)}</span></div>` : ''}
        <div class="qcard">
          <div class="prompt ${playful ? 'big' : ''}">${q.prompt}${part ? `<div class="part-label">${part.label} <span class="muted small">[${part.marks}]</span></div>` : ''}</div>
          <button class="iconbtn speak" id="say" aria-label="Hear the question" title="Read it to me">${svgSpeaker()}</button>
          ${q.visual ? `<div class="stage" id="stage">${VIZ.render(q.visual, {})}</div>` : '<div id="stage"></div>'}
          <div id="resp"></div>
          <div id="fb" role="status" aria-live="polite"></div>
          <div class="help-row" id="help"></div>
          <div id="undbox"></div>
        </div>
      </div>`, { back: S.exam ? S.exam.back : `#/skill/${S.skillId}`, title: playful ? k.childName : k.name, cls: 'focus' });
    if (S.exam && S.exam.bind) S.exam.bind(S);

    if ($('#say')) { const sp = q.speak || plainText(q.prompt); const hl = () => FMG.speakHighlight && FMG.speakHighlight.next($('.qcard .prompt')); $('#say').onclick = () => { hl(); speech.say(sp); }; hl(); speakIfOn(sp); }
    FMG.app.ctx = { screen: 'question', skill: k.name, prompt: plainText(q.prompt.replace(/<details[\s\S]*?<\/details>/, '')).slice(0, 400), answered: !!S.done, answer: answerText(q, part) };
    $('#finish').onclick = () => summary(S);
    if ($('#pause')) $('#pause').onclick = () => pauseOverlay(S);
    // Pass: move on without answering (not recorded as right or wrong; the streak is kept)
    if ($('#pass')) $('#pass').onclick = () => { speech.stop(); if (!S.done) S.results[S.i] = 'passed'; S.passed = (S.passed || 0) + 1; S.i++; nextQuestion(S); };
    drawResponse(S);
    drawHelp(S);
  }

  /* ================= A–D options =================
     Every typed number answer can also be answered by choosing A, B, C or D: the right answer plus three
     plausible wrong ones (the skill's known misconceptions first, then near-misses). Choice answers are
     recorded as responseType 'choice', so they never award Secure on their own (spec §8). */
  const LETTERS = ['A', 'B', 'C', 'D'];
  let abcdKeys = null;
  const decOf = (v) => (v.d === 1 ? String(v.n) : (FMG.skillLib && FMG.skillLib.decStr(v)) || null);
  // asFrac: show every option as a fraction (when the question is about fractions), otherwise as decimals.
  const qTxt = (v, asFrac) => String(v.d === 1 ? String(v.n) : asFrac ? `${v.n}/${v.d}` : decOf(v) || `${v.n}/${v.d}`).replace('−', '-');
  const qHtml = (v, pi, asFrac) => { const dec = v.d === 1 ? String(v.n) : asFrac ? null : decOf(v); const core = dec ? String(dec).replace('-', '−') : FMG.fracHTML(v); return pi ? (v.eq(Q.of(1)) ? 'π' : v.eq(Q.of(-1)) ? '−π' : core + 'π') : core; };
  function abcdOptions(spec, seed, prompt) {
    if (!spec || (spec.type !== 'number' && spec.type !== 'solutions')) return null;
    const r = FMG.rng((seed || 1) * 31 + 7);
    const key = (vals) => vals.map((v) => v.n + '/' + v.d).sort().join('|');
    if (spec.type === 'number') {
      let v; try { v = Q.of(spec.answer); } catch (e) { return null; }
      const cands = [];
      for (const m of spec.misconceptions || []) { try { cands.push(Q.of(m.value)); } catch (e) { /* skip */ } }
      const isInt = v.d === 1, pr = String(prompt || '');
      const promptFrac = /class="(fr|frac)|\d\s*\/\s*\d|[½⅓⅔¼¾⅕⅙⅛]/.test(pr) && !/\d\.\d/.test(pr);
      const asFrac = !isInt && (spec.requireForm === 'fraction' || (spec.requireForm !== 'decimal' && (promptFrac || !decOf(v))));
      const decimalish = !isInt && !asFrac;
      const near = isInt
        ? [v.add(Q.of(1)), v.sub(Q.of(1)), v.add(Q.of(10)), v.sub(Q.of(10)), v.mul(Q.of(2)), v.mul(Q.of(10)), v.add(Q.of(2)), v.mul(Q.of(-1))]
        : decimalish ? [v.mul(Q.of(10)), v.div(Q.of(10)), v.add(new Q(1, 10)), v.sub(new Q(1, 10)), v.add(Q.of(1)), v.mul(Q.of(2)), v.add(new Q(1, 100)), v.sub(new Q(1, 100)), v.add(Q.of(2))]
          : [new Q(v.d, v.n), new Q(v.n + 1, v.d), new Q(v.n, v.d + 1), new Q(Math.max(1, v.n - 1), v.d), v.mul(Q.of(2)), v.add(Q.of(1)), new Q(v.n + 2, v.d), new Q(v.n, v.d + 2), v.div(Q.of(2)), new Q(v.n * 2 + 1, v.d * 2)];
      for (let i = near.length - 1; i > 0; i--) { const j = r.int(0, i); [near[i], near[j]] = [near[j], near[i]]; }
      const seen = new Set([key([v])]), wrong = [];
      for (const c of cands.concat(near)) {
        if (wrong.length >= 3 || !c || !isFinite(c.valueOf())) continue;
        if (v.valueOf() >= 0 && c.valueOf() < 0 && !cands.includes(c)) continue;
        if (decimalish && c.d !== 1 && !decOf(c)) continue;              // keep every option a tidy decimal
        if (isInt && c.d !== 1 && !cands.includes(c)) continue;          // whole-number answers get whole-number options
        if (asFrac && c.d === 1 && !cands.includes(c) && wrong.length < 2) continue;
        const k = key([c]); if (seen.has(k)) continue; seen.add(k); wrong.push(c);
      }
      if (wrong.length < 3) return null;
      const opts = [{ v, correct: true }].concat(wrong.map((w) => ({ v: w, correct: false })));
      for (let i = opts.length - 1; i > 0; i--) { const j = r.int(0, i); [opts[i], opts[j]] = [opts[j], opts[i]]; }
      return opts.map((o) => ({ html: qHtml(o.v, spec.pi, asFrac), typed: qTxt(o.v, asFrac) + (spec.pi ? 'π' : ''), correct: o.correct }));
    }
    // solutions: x = a or x = b
    let vals; try { vals = (Array.isArray(spec.answer) ? spec.answer : [spec.answer]).map((x) => Q.of(x)); } catch (e) { return null; }
    const variants = [vals.map((x) => x.mul(Q.of(-1))), vals.map((x, i) => (i === 0 ? x : x.mul(Q.of(-1)))), vals.map((x, i) => (i === 0 ? x.mul(Q.of(-1)) : x)), vals.map((x) => x.add(Q.of(1))), vals.map((x) => x.mul(Q.of(2)))];
    const seen = new Set([key(vals)]), wrong = [];
    for (const w of variants) { const k = key(w); if (wrong.length < 3 && !seen.has(k)) { seen.add(k); wrong.push(w); } }
    if (wrong.length < 3) return null;
    const lab = (arr) => arr.map((x) => `x = ${qHtml(x)}`).join(' or ');
    const typ = (arr) => arr.map((x) => `x = ${qTxt(x)}`).join(' or ');
    const opts = [{ a: vals, correct: true }].concat(wrong.map((w) => ({ a: w, correct: false })));
    for (let i = opts.length - 1; i > 0; i--) { const j = r.int(0, i); [opts[i], opts[j]] = [opts[j], opts[i]]; }
    return opts.map((o) => ({ html: lab(o.a), typed: typ(o.a), correct: o.correct }));
  }
  const abcdHtml = (opts, kind) => `<div class="abcd ${kind === 'pic' ? 'pics' : ''}" role="group" aria-label="Choose A, B, C or D">${opts.map((o, i) => `<button type="button" class="abcd-opt" data-abcd="${i}" aria-label="${LETTERS[i]}: ${esc(o.typed)}"><span class="abcd-l" aria-hidden="true">${LETTERS[i]}</span><span class="abcd-v">${o.html}</span></button>`).join('')}</div>`;
  /* Letter keys A–D press the matching option while it's on screen (not while typing in a box). */
  function bindLetterKeys(box, sel) {
    if (abcdKeys) document.removeEventListener('keydown', abcdKeys);
    abcdKeys = (e) => {
      if (!document.body.contains(box)) { document.removeEventListener('keydown', abcdKeys); abcdKeys = null; return; }
      if (e.metaKey || e.ctrlKey || e.altKey || (e.target.closest && e.target.closest('input, textarea, select, [class*="cz-"]'))) return;
      const i = LETTERS.indexOf(e.key.toUpperCase()); if (i < 0) return;
      const b = $$(sel, box)[i]; if (b && !b.disabled) { e.preventDefault(); b.click(); }
    };
    document.addEventListener('keydown', abcdKeys);
  }
  const answerModeSwitch = (mode) => `<div class="seg ans-switch" role="tablist" aria-label="How to answer"><button role="tab" aria-selected="${mode === 'abcd'}" data-am="abcd">A B C D</button><button role="tab" aria-selected="${mode === 'type'}" data-am="type">Type it</button></div>`;
  function defaultAnswerMode(mode) {
    const p = profile();
    if (mode === 'check' || mode === 'review' || mode === 'exam') return 'type';
    return (p && p.prefs.answerMode) || 'abcd';
  }

  function drawResponse(S) {
    const q = S.q, box = $('#resp');
    const pb = $('#pass'); if (pb) pb.hidden = !!S.done;
    if (S.done) {
      box.innerHTML = `<div class="next-row"><button class="btn primary big" id="next">${S.plan && S.i + 1 >= S.plan.length ? 'See summary' : 'Next question'}</button></div>`;
      if (S.exam && S.offered) { const fb = $('#fb'); if (fb) fb.insertAdjacentHTML('beforeend', `<div class="offer">${S.offered}</div>`); S.offered = null; }
      $('#next').onclick = () => { S.i++; S.examScored = false; nextQuestion(S); };
      setTimeout(() => $('#next') && $('#next').focus(), 30);
      return;
    }
    if (q.responseType === 'tap-fill') {
      const stage = $('#stage');
      const redraw = () => { stage.innerHTML = VIZ.render(q.visual, { added: S.added, interactive: true }); bind(); };
      const bind = () => {
        $$('[data-cell]', stage).forEach((c) => (c.onclick = () => { const idx = +c.dataset.cell; const v = q.visual; S.added = idx < v.have + S.added ? Math.max(0, idx - v.have) : idx - v.have + 1; redraw(); }));
        $$('[data-scatter]', stage).forEach((c) => (c.onclick = () => { S.added = Math.max(0, Math.min(8, S.added + +c.dataset.scatter)); redraw(); }));
      };
      bind();
      box.innerHTML = `<div class="tap-actions"><button class="btn round big good" id="tick" aria-label="Done — check my answer">✓</button></div>`;
      $('#tick').onclick = () => submit(S, String(S.added), S.added === q.answer.target ? { status: 'correct' } : { status: 'incorrect', message: S.added + q.visual.have > 5 ? 'Too many! Take some away.' : 'Not five yet. Count again.' });
      return;
    }
    if (q.responseType === 'pick') {
      box.innerHTML = pickPad(q.pickMin || 0, q.pickMax || 10);
      $$('[data-pick]', box).forEach((b) => (b.onclick = () => {
        $$('[data-pick]', box).forEach((x) => x.classList.remove('right', 'wrong'));
        const r = MARK.mark(b.dataset.pick, q.answer);
        b.classList.add(r.status === 'correct' ? 'right' : 'wrong');
        submit(S, b.dataset.pick, r);
      }));
      return;
    }
    if (q.answer.type === 'trace') {
      box.innerHTML = `<div class="tr-wrap"><div id="pad"></div><div class="small" id="tfb" aria-live="polite"></div><div class="row center"><button class="btn ghost sm" id="redo">↺ Start again</button></div></div>`;
      let fails = 0;
      const mount = () => FMG.trace.mount($('#pad'), q.answer.letter, { guide: q.answer.guide, onStroke: (nn, of, ok, why) => {
        if (ok) { $('#tfb').textContent = nn < of ? `Lovely! Now stroke ${nn + 1} of ${of}.` : ''; return; }
        fails++; $('#tfb').textContent = why === 'start' ? 'Start at the green dot.' : 'Nearly! Follow the line, starting at the green dot.';
        if (fails === 1 && S.att.firstCorrect == null) { S.att.firstCorrect = false; S.att.firstResponse = `trace ${q.answer.letter}: stroke missed`; commitAttempt(S.att); }
      }, onDone: () => submit(S, `trace ${q.answer.letter}`, { status: 'correct', message: fails ? '' : 'Every stroke right first time!' }) });
      mount();
      $('#redo').onclick = () => mount();
      return;
    }
    if (q.answer.type === 'text') {
      if (!S.ansMode) S.ansMode = defaultAnswerMode(S.mode);
      const mode = S.qAnsMode || S.ansMode;
      const opts = q.choices.map((c) => ({ html: esc(c.label), typed: c.label, correct: c.id === q.answer.correct }));
      if (mode === 'abcd') {
        box.innerHTML = `${abcdHtml(opts, q.choiceKind)}<div class="ans-foot">${answerModeSwitch('abcd')}<span class="small muted">${S.mode === 'check' || S.mode === 'review' ? 'Typed answers count more towards Secure.' : 'Tap an answer, or press A, B, C or D.'}</span></div>`;
        $$('[data-abcd]', box).forEach((b) => (b.onclick = () => {
          const o = opts[+b.dataset.abcd];
          if (S.att.firstCorrect == null) S.att.responseType = 'choice';
          b.classList.add(o.correct ? 'right' : 'wrong'); if (!o.correct) b.disabled = true;
          submit(S, LETTERS[+b.dataset.abcd] + ': ' + o.typed, o.correct ? { status: 'correct' } : { status: 'incorrect' });
        }));
        bindLetterKeys(box, '[data-abcd]');
      } else {
        box.innerHTML = textBox() + `<div class="ans-foot">${answerModeSwitch('type')}${q.preferType ? '<span class="small muted">This step asks you to type. A B C D is still there if you need it.</span>' : ''}</div>`;
        const inp = $('#ans'); setTimeout(() => inp.focus({ preventScroll: true }), 30);
        const go2 = () => { const r = MARK.mark(inp.value, q.answer); if (r.status === 'unclear') { showFb(r.message, 'info'); return; } submit(S, inp.value, r); };
        $('#go').onclick = go2; inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go2(); });
      }
      bindAnswerSwitch(S, box);
      return;
    }
    if (q.answer.type === 'choice' && q.choices) {
      const thumbs = q.choices.length === 2 && q.choices[0].label.length < 4;
      box.innerHTML = thumbs ? `<div class="choices thumbs">${q.choices.map((c) => `<button class="choice" data-c="${c.id}" ${c.aria ? `aria-label="${c.aria}"` : ''}>${esc(c.label)}</button>`).join('')}</div>`
        : `<div class="abcd ${q.choiceKind === 'pic' ? 'pics' : ''}">${q.choices.map((c, i) => `<button type="button" class="abcd-opt" data-c="${c.id}" aria-label="${LETTERS[i] || ''}: ${esc(c.aria || c.label)}"><span class="abcd-l" aria-hidden="true">${LETTERS[i] || i + 1}</span><span class="abcd-v">${esc(c.label)}</span></button>`).join('')}</div>`;
      $$('[data-c]', box).forEach((b) => (b.onclick = () => { const ok = b.dataset.c === q.answer.correct; b.classList.add(ok ? 'right' : 'wrong'); if (!ok) b.disabled = true; const c = q.choices.find((x) => x.id === b.dataset.c); submit(S, `${LETTERS[q.choices.indexOf(c)] || ''}: ${c ? c.label : b.dataset.c}`, ok ? { status: 'correct' } : { status: 'incorrect' }); }));
      if (!thumbs) bindLetterKeys(box, '[data-c]');
      return;
    }
    const part = q.parts ? q.parts[S.part] : null;
    const spec = part ? part.answer : q.answer;
    const opts = abcdOptions(spec, (q.seed || 0) + S.part * 101 + S.i * 7, (part ? part.prompt || '' : '') + q.prompt);
    if (!S.ansMode) S.ansMode = defaultAnswerMode(S.mode);
    if (opts && S.ansMode === 'abcd') {
      box.innerHTML = `${abcdHtml(opts)}<div class="ans-foot">${answerModeSwitch('abcd')}<span class="small muted">${S.mode === 'check' || S.mode === 'review' ? 'Typed answers count more towards Secure.' : 'Tap an answer, or press A, B, C or D.'}</span></div>`;
      $$('[data-abcd]', box).forEach((b) => (b.onclick = () => {
        const o = opts[+b.dataset.abcd];
        if (S.att.firstCorrect == null) S.att.responseType = 'choice';
        b.classList.add(o.correct ? 'right' : 'wrong');
        if (!o.correct) b.disabled = true;
        let r = { status: 'correct' };
        if (!o.correct) { r = MARK.mark(o.typed, spec); if (r.status !== 'incorrect') r = { status: 'incorrect', message: r.message && r.status !== 'correct' ? r.message : null }; }
        submit(S, LETTERS[+b.dataset.abcd] + ': ' + o.typed, r);
      }));
      bindLetterKeys(box, '[data-abcd]');
      bindAnswerSwitch(S, box);
      return;
    }
    box.innerHTML = answerBox(spec.type === 'solutions' ? 'x = …' : spec.pi ? 'e.g. 14π' : 'Your answer', { pi: spec.pi }) + (opts ? `<div class="ans-foot">${answerModeSwitch('type')}</div>` : '');
    if (opts) bindAnswerSwitch(S, box);
    const inp = $('#ans');
    bindPreview(inp);
    bindKeypad(box, inp);
    const go2 = () => {
      const r = MARK.mark(inp.value, spec);
      if (r.status === 'unclear') { showFb(r.message, 'info'); return; } // never recorded as a mathematical error
      submit(S, inp.value, r);
    };
    $('#go').onclick = go2;
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go2(); });
  }

  function bindAnswerSwitch(S, box) {
    $$('[data-am]', box).forEach((b) => (b.onclick = () => {
      if ((S.qAnsMode || S.ansMode) === b.dataset.am) return;
      S.ansMode = b.dataset.am; S.qAnsMode = null; S.ansModeChosen = true;
      if (S.mode !== 'check' && S.mode !== 'review' && S.mode !== 'exam') updateProfile((x) => { x.prefs.answerMode = S.ansMode; });
      drawResponse(S);
      if (S.ansMode === 'type') $('#ans')?.focus();
    }));
  }
  function answerText(q, part) {
    try {
      const a = part ? part.answer : q.answer;
      if (a.type === 'number') return qTxt(Q.of(a.answer)) + (a.pi ? 'π' : '');
      if (a.type === 'solutions') return (Array.isArray(a.answer) ? a.answer : [a.answer]).map((x) => qTxt(Q.of(x))).join(' or ');
      if ((a.type === 'choice' || a.type === 'text') && q.choices) { const c = q.choices.find((x) => x.id === a.correct); return c ? c.label : ''; }
      if (a.type === 'trace') return `the letter ${a.letter}`;
    } catch (e) { /* ignore */ }
    return '';
  }
  function showFb(msg, kind) {
    if (FMG.buddy) FMG.buddy.react(kind);
    if (kind === 'good' && FMG.app.ctx && FMG.app.ctx.screen === 'question') FMG.app.ctx.answered = true; $('#fb').innerHTML = `<div class="fb ${kind}">${msg}</div>`; }

  function submit(S, response, r) {
    const q = S.q, att = S.att;
    const ok = r.status === 'correct';
    const multiPart = q.parts && S.part < q.parts.length - 1;
    if (att.firstCorrect == null) { att.firstResponse = response; att.firstCorrect = ok; }
    if (r.tag && !att.tags.includes(r.tag)) att.tags.push(r.tag);
    att.finalResponse = response; att.finalCorrect = ok;
    S.tries++;
    if (ok && multiPart) {
      // GCSE parts: each part is marked; part (a) correctness is the first response for the record
      commitAttempt(att);
      S.part++; S.tries = 0;
      showFb('✓ Correct. Now the next part.', 'good');
      setTimeout(() => drawQuestion(S, S.plan && S.plan.length), 700);
      return;
    }
    commitAttempt(att);
    if (S.exam && (ok || S.tries >= 2) && !S.examScored) { S.examScored = true; const note = S.exam.onResult(S, ok && S.tries === 1 && att.hints === 0 && !att.solutionShown); if (note) S.offered = note; }
    if (ok) {
      S.done = true;
      const o = EV.outcome(att);
      S.results[S.i] = o;
      const pp = profile(), young = pp.prefs.ui === 'playful' || pp.route === 'eyfs' || pp.route === 'ks1';
      S.run = att.firstCorrect ? (S.run || 0) + 1 : 0;
      const praise = young ? ['Brilliant! ⭐', 'You did it! ⭐', 'Super! ⭐'] : ['Correct ✓', 'Nicely done ✓', 'That’s right ✓'];
      const cheer = FMG.celebrate ? FMG.celebrate.correct({ streak: S.run, name: pp.nickname, young }) + (young ? ' ⭐' : ' ✓') : praise[S.i % praise.length];
      const msg = cheer + (S.run >= 2 ? ` <span class="streak-pill">${S.run} in a row</span>` : '') + (o === 'supported' ? ' <span class="muted small">(with help)</span>' : '') + (r.message ? ` <span class="small">${r.message}</span>` : '');
      showFb(msg, 'good');
      speakIfOn(msg.replace(/<[^>]+>/g, ''));
        adapt(S, o === 'independent');
      drawResponse(S); drawHelp(S);
      return;
    }
    // Wrong: specific prompt first, then smaller hint, then worked explanation on request.
    S.run = 0;
    const pq = profile(), yq = pq.prefs.ui === 'playful' || pq.route === 'eyfs' || pq.route === 'ks1';
    const generic = S.tries === 1 ? (FMG.celebrate ? FMG.celebrate.nearly({ young: yq }) : 'Not quite — have another go.') : 'Still not right. Try a hint, or press “I don’t understand” and we’ll look at it together.';
    showFb((r.message ? r.message + ' ' : '') + (r.message ? '' : generic), 'try');
    if (S.mode === 'check' || S.mode === 'review' || S.mode === 'exam') {
      // Only the first answer counts; offer the solution and move on after one retry.
      if (S.tries >= 2) { S.done = true; S.results[S.i] = EV.outcome(att); drawResponse(S); }
    } else if (S.tries === 1) adapt(S, false);
    drawHelp(S);
  }

  /* Adaptation on the six-step ladder. Endless: 4 right in a row (first try, no help) moves up a step by itself,
     with a "stay" option. Practice offers the next step after 3. Two tricky ones offer an easier step. Never forced down. */
  function adapt(S, success) {
    if (S.mode !== 'practice' && S.mode !== 'endless') return;
    if (success) { S.streak.good++; S.streak.bad = 0; } else { S.streak.bad++; S.streak.good = 0; }
    const st = S.step, nm = (i) => esc(GEN.stepInfo(S.skillId, i).name);
    const go = (to) => { S.step = to; S.levelNow = GEN.stepInfo(S.skillId, to).level; S.streak.good = 0; S.streak.bad = 0; saved(saveStep(S.skillId, to)); };
    let offer = null;
    if (S.mode === 'endless' && S.streak.good >= 4 && st < 5) {
      go(st + 1);
      offer = `⬆ Stepping up to <b>step ${st + 2}: ${nm(st + 1)}</b>! <button class="linkbtn" id="easier">Stay on ${nm(st)}</button>`;
      S.backTo = st;
      speakIfOn(`Stepping up! ${GEN.stepInfo(S.skillId, st + 1).name}.`);
    } else if (S.mode === 'practice' && S.streak.good >= 3 && st < 5) {
      offer = `Three in a row on your own! <button class="linkbtn" id="harder">Try step ${st + 2}: ${nm(st + 1)}</button> or keep going.`;
      S.streak.good = 0;
    } else if (S.streak.bad >= 2) {
      offer = `This one’s tricky. <a class="linkbtn" href="#/learn/${S.skillId}">See the lesson again</a>${st > 0 ? ` or <button class="linkbtn" id="easier">go back to ${nm(st - 1)}</button>` : ''}.`;
      S.backTo = st - 1;
      S.streak.bad = 0;
    }
    S.offered = null;
    if (!offer) return;
    const qw = $('.qwrap');
    const old = qw.querySelector('.offer'); if (old) old.parentNode.removeChild(old);
    qw.querySelector('.qtop').insertAdjacentHTML('afterend', fixLinks(`<div class="offer">${offer}</div>`));
    const box = qw.querySelector('.offer');
    const chip = () => { const c = $('.step-chip'); if (c) c.textContent = `${S.step + 1}/6 · ${GEN.stepInfo(S.skillId, S.step).name}`; };
    const h = $('#harder'), e = $('#easier');
    if (h) h.onclick = () => { go(st + 1); box.parentNode && box.parentNode.removeChild(box); chip(); };
    if (e) e.onclick = () => { if (S.backTo >= 0) go(S.backTo); box.parentNode && box.parentNode.removeChild(box); chip(); };
    chip();
  }

  function drawHelp(S) {
    const q = S.q, att = S.att, box = $('#help');
    const hints = q.hints || [];
    let html = '';
    if (S.shownHints && S.shownHints.length) html += S.shownHints.map((h) => `<div class="hint">💡 ${h}</div>`).join('');
    const btns = [];
    if (!S.done && S.hintIdx < hints.length) btns.push(`<button class="btn ghost sm" id="hint">${S.hintIdx === 0 ? 'Hint' : 'Another hint'}</button>`);
    btns.push(`<button class="btn ghost sm und-btn" id="und" aria-expanded="${!!S.undOpen}">${S.undOpen ? 'Explain it differently' : 'I don’t understand'}</button>`);
    if (S.tries > 0 || S.done) btns.push(`<button class="btn ghost sm" id="sol">${S.showSol ? 'Hide explanation' : 'Explain it'}</button>`);
    if ((S.mode === 'check' || S.mode === 'review') && !S.done && S.tries === 0) btns.push(`<button class="btn ghost sm" id="nt">Not taught yet</button>`);
    const tool = FMG.tools && FMG.tools.suggest ? (() => { try { return FMG.tools.suggest(S.skillId, (CUR.skill(S.skillId) || {}).topic); } catch (e) { return null; } })() : null;
    if (tool && tool.id && S.mode !== 'check' && S.mode !== 'review') btns.push(`<a class="btn ghost sm tool-btn" href="${toHash('/tool/' + tool.id + (tool.preset ? '/' + tool.preset : ''))}">${svgTools()}<span>${esc(tool.label || 'Explore with a tool')}</span></a>`);
    html += `<div class="help-btns">${btns.join('')}</div>`;
    if (S.showSol) html += explainPanel(S);
    box.innerHTML = html;
    bindExplain(S);
    const ub = $('#und');
    if (ub) ub.onclick = () => {
      const ubox = $('#undbox');
      if (S.undOpen && ubox) { const nx = $('[data-und-next]', ubox); if (nx) { nx.click(); return; } }
      if (!S.done) { att.hints++; att.understandHelp = (att.understandHelp || 0) + 1; commitAttempt(att); }
      S.undOpen = true;
      mountUnderstand(ubox, () => understandWays(S.skillId, (q._raw || {}).key), () => { S.undOpen = false; drawHelp(S); });
      drawHelp(S);
      ubox.scrollIntoView({ block: 'start', behavior: 'smooth' });
    };
    const h = $('#hint');
    if (h) h.onclick = () => {
      const hint = hints[S.hintIdx++];
      S.shownHints = (S.shownHints || []).concat(hint.text);
      att.hints++;
      if (hint.reveals && att.firstCorrect == null) att.revealingHelpBeforeFirst = true;
      commitAttempt(att); // a hint is recorded even if the learner leaves
      if (hint.visualStage && q.visual) { S.visualStage = hint.visualStage; $('#stage').innerHTML = VIZ.render(q.visual, { stage: hint.visualStage, added: S.added, interactive: q.responseType === 'tap-fill' }); if (q.responseType === 'tap-fill') drawResponse(S); }
      speakIfOn(hint.speak || hint.text);
      drawHelp(S);
    };
    const so = $('#sol');
    if (so) so.onclick = () => {
      if (!att.solutionShown) { att.solutionShown = true; if (att.firstCorrect == null) att.revealingHelpBeforeFirst = true; commitAttempt(att); }
      S.showSol = !S.showSol;
      if (!S.done && S.showSol && (S.mode === 'check' || S.mode === 'review')) { S.done = true; S.results[S.i] = EV.outcome(att); drawResponse(S); }
      drawHelp(S);
    };
    const nt = $('#nt');
    if (nt) nt.onclick = () => { att.notTaught = true; commitAttempt(att); S.results[S.i] = 'not-taught'; S.i++; nextQuestion(S); };
  }

  /* Explanation panel: several ways to understand the same question. */
  function explainData(q) {
    const e = q.explain || {};
    const steps = e.steps || q.solution || [];
    const tabs = [{ id: 'steps', name: 'Step by step' }];
    const pic = e.pic || q.visual;
    const pics = (e.pics && e.pics.length ? e.pics : pic ? [pic] : []).filter(Boolean);
    if (pics.length) tabs.push({ id: 'pic', name: pics.length > 1 ? `Pictures (${pics.length})` : 'Picture' });
    if (e.alt && e.alt.length) tabs.push({ id: 'alt', name: 'Another way' });
    if (e.check && e.check.length) tabs.push({ id: 'check', name: 'Check it' });
    if (e.mistakes && e.mistakes.length) tabs.push({ id: 'mis', name: 'Watch out' });
    const rule = e.rule || ((q.hints || [])[0] || {}).text;
    if (rule) tabs.push({ id: 'rule', name: 'Key idea' });
    const walk = q._raw && Array.isArray(q._raw.walk) && q._raw.walk.length ? q._raw.walk : null;
    return { walk, steps, pic, pics, alt: e.alt, check: e.check, mistakes: e.mistakes || [], rule, tabs };
  }
  function explainPanel(S) {
    const d = explainData(S.q);
    S.exTab = d.tabs.some((t) => t.id === S.exTab) ? S.exTab : 'steps';
    if (S.exStep == null) S.exStep = 1;
    let body = '';
    if (S.exTab === 'steps' && d.walk) {
      const W = d.walk, n = Math.min(S.exStep, W.length);
      let v = S.q.visual; for (let i = 0; i < n; i++) if (W[i].see) v = W[i].see;
      body = `<div class="ex-walk">${v ? `<figure class="lsn-vis">${VIZ.render(v, {})}<figcaption>After step ${n}</figcaption></figure>` : ''}
        <ol class="lsn-steps">${W.slice(0, n).map((w, i) => `<li class="lsn-step ${i === n - 1 ? 'cur' : 'past'}" style="--d:${i}"><span class="lsn-num" aria-hidden="true">${i + 1}</span><div class="lsn-body">${w.do ? `<div class="lsn-do">${w.do}</div>` : ''}<div class="lsn-math">${w.math}</div>${w.why ? `<div class="lsn-why"><span class="why-tag">Why?</span> ${w.why}</div>` : ''}</div></li>`).join('')}</ol></div>
        <div class="ex-ctl">${n < W.length ? `<button class="btn primary sm" data-exnext>Next step (${n}/${W.length})</button><button class="btn ghost sm" data-exall>Show all</button>` : `<span class="small muted">All ${W.length} steps shown.</span>${W.length > 1 ? '<button class="btn ghost sm" data-exrestart>Start again</button>' : ''}`}</div>`;
    } else if (S.exTab === 'steps') {
      const n = Math.min(S.exStep, d.steps.length);
      body = `<ol class="worked big">${d.steps.slice(0, n).map((x, i) => `<li class="${i === n - 1 ? 'new' : ''}">${x}</li>`).join('')}</ol>
        <div class="ex-ctl">${n < d.steps.length ? `<button class="btn primary sm" data-exnext>Next step (${n}/${d.steps.length})</button><button class="btn ghost sm" data-exall>Show all</button>` : `<span class="small muted">All ${d.steps.length} steps shown.</span>${d.steps.length > 1 ? '<button class="btn ghost sm" data-exrestart>Start again</button>' : ''}`}</div>`;
    } else if (S.exTab === 'pic') {
      const st = S.q.visual && S.q.visual.type === 'fraction-bars' ? { stage: 'combined' } : S.q.visual && S.q.visual.type === 'balance' ? { stage: 'solved' } : {};
      const k = Math.min(S.exPic || 0, d.pics.length - 1), cur = d.pics[k];

      body = `${sw}<div class="ex-pic">${VIZ.render(cur, cur === S.q.visual ? st : {})}</div><p class="small muted">${d.steps.length ? d.steps[d.steps.length - 1] : ''}</p>`;
    } else if (S.exTab === 'alt') body = `<p class="small muted">A different method that gives the same answer:</p><ol class="worked big">${d.alt.map((x) => `<li>${x}</li>`).join('')}</ol>`;
    else if (S.exTab === 'check') body = `<p class="small muted">How to be sure your answer is right:</p><ol class="worked big">${d.check.map((x) => `<li>${x}</li>`).join('')}</ol>`;
    else if (S.exTab === 'mis') body = `<ul class="mistakes">${d.mistakes.map((m) => `<li><span class="mis-val">✗ ${esc(m.value)}</span><span>${m.message}</span></li>`).join('')}</ul>`;

        <button class="iconbtn ex-say" data-exsay aria-label="Read this explanation aloud">${svgSpeaker()}</button></div>

  function bindExplain(S) {
    const box = $('#help'); if (!box || !S.showSol) return;
    const redraw = () => { const ex = $('.explain', box); if (ex) { ex.outerHTML = explainPanel(S); bindExplain(S); } };
    $$('[data-extab]', box).forEach((b) => (b.onclick = () => { S.exTab = b.dataset.extab; redraw(); $(`[data-extab="${S.exTab}"]`)?.focus({ preventScroll: true }); }));
    $$('[data-expic]', box).forEach((b) => (b.onclick = () => { S.exPic = +b.dataset.expic; redraw(); $(`[data-expic="${S.exPic}"]`)?.focus({ preventScroll: true }); }));
    const nx = $('[data-exnext]', box); if (nx) nx.onclick = () => { S.exStep++; redraw(); $('[data-exnext]')?.focus({ preventScroll: true }); };
    const al = $('[data-exall]', box); if (al) al.onclick = () => { S.exStep = 99; redraw(); };
    const rs = $('[data-exrestart]', box); if (rs) rs.onclick = () => { S.exStep = 1; redraw(); };
    const sy = $('[data-exsay]', box); if (sy) sy.onclick = () => speech.say(($('.ex-body', box) || {}).textContent || '');
  }

  /* ================= Exams =================
     The English exams screen, phonics check, SATs-style paper, reading texts and GCSE papers are in english-screens.js
     (FMG.examHub.page); per-skill exam ladders in exam-ladder.js. */
  route(/^#\/exams$/, () => (FMG.examHub ? FMG.examHub.page() : go('#/home')));

  function askConfirm(msg, action, onYes) {
    const o = document.createElement('div');

  /* ================= Session summary ================= */
  function summary(S) {
    speech.stop();
    const atts = attemptsOf(profile().id).filter((a) => a.sessionId === S.id);
    const c = EV.countOutcomes(atts);
    if (FMG.celebrate && c.total > 0 && c.firstCorrect > 0) setTimeout(() => FMG.celebrate.finish({ correct: c.firstCorrect, total: c.total }), 250);
    const tags = EV.misconceptions(atts);
    const st = EV.skillState(attemptsOf(profile().id), S.skillId);
    const k = CUR.skill(S.skillId);
    const playful = profile().prefs.ui === 'playful';
    let next;
    if (S.mode === 'check' && st.readiness.ready) next = 'You’re ready to try the next skill — and a review will check this one later.';
    else if (c.incorrect + c.supported > c.independent) next = 'Have another look at the lesson, then try a short practice.';
    else if (S.mode === 'practice' || S.mode === 'endless') next = 'Try a Check (5 fresh questions) to show what you can do.';
    else next = 'Great work. Come back another day for a review.';
    shell(`
      <section class="summary center">
        <div class="sum-badge">${playful ? '🌟' : '✓'}</div>
        <h1>${c.total ? (playful ? 'Well done!' : 'Session complete') : 'See you soon'}</h1>

        <div class="card soft left"><h3>Next small step</h3><p>${esc(next)}</p></div>
        <div class="row center"><a class="btn ghost" href="#/skill/${k.id}">Back to skill</a>${S.exam ? `<a class="btn ghost" href="#/exams/ladder/${S.exam.home}">Exam ladder</a>` : ''}<a class="btn primary" href="#/home">Home</a></div>
        <p class="small muted">${playful ? 'Time for a break? Find three things at home that start with the same sound!' : ''}</p>

  const MISC = {

    multiplied: 'Multiplied instead of added the fractions.',
    'not-simplified': 'Right value, but the question asked for the simplest form.',
    'inverse-sign': 'Inverse operations: to undo + 5, subtract 5 from both sides.',
    'stopped-early': 'Stopped one step early: after finding 3x, divide to find x.',
    'multiplied-instead': 'Multiplied instead of dividing to undo the coefficient.',

  /* ================= Parent area ================= */

  /* A simple supervision gate (not secure sign-in): hold the button for 3 seconds. Keyboard: hold Space or Enter. */
  function parentGate(tab) {
    shell(`<section class="center narrow-box"><h1>Grown-ups only</h1><p class="muted">Press and hold the button for 3 seconds.</p>
      <button class="btn primary big hold-btn" id="hold" aria-describedby="holdtip"><span class="hold-fill" aria-hidden="true"></span><span class="hold-txt">Hold to open</span></button>
      <p class="small muted" id="holdtip">Keyboard: hold Space or Enter. This is a simple supervision gate on this device, not secure sign-in.</p></section>`, { back: profile() ? '#/home' : '#/', cls: 'narrow' });
    const b = $('#hold'), fill = $('.hold-fill', b), txt = $('.hold-txt', b);
    let t0 = 0, raf = 0, timer = 0;
    const stop = () => { clearTimeout(timer); cancelAnimationFrame(raf); t0 = 0; fill.style.width = '0%'; txt.textContent = 'Hold to open'; };
    const tick = () => { if (!t0) return; const f = Math.min(1, (Date.now() - t0) / 3000); fill.style.width = `${f * 100}%`; raf = requestAnimationFrame(tick); };
    const start = () => { if (t0) return; t0 = Date.now(); txt.textContent = 'Keep holding…'; tick(); timer = setTimeout(() => { parentOk = true; parentDashboard(tab || 'progress'); }, 3000); };
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); start(); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, stop));
    b.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); start(); } });
    b.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') stop(); });
    b.addEventListener('contextmenu', (e) => e.preventDefault());
    b.focus();
  }

  let parentChild = null;
  function parentDashboard(tab) {
    const db = store.get();
    if (!parentChild || !db.profiles.find((p) => p.id === parentChild)) parentChild = (profile() || db.profiles[0] || {}).id;
    const child = db.profiles.find((p) => p.id === parentChild);
    const tabs = [['progress', 'Progress'], ['attempts', 'History'], ['learners', 'Learners & settings'], ['voice', 'Voice & sounds'], ['backup', 'Backup'], ['coverage', 'Coverage']];
    let body = '';
    if (tab === 'progress' && child) body = parentProgress(child);
    if (tab === 'attempts' && child) body = parentAttempts(child);
    if (tab === 'learners') body = parentLearners();
    if (tab === 'backup') body = parentBackup();
    if (tab === 'coverage') body = parentCoverage();
    if (tab === 'voice') body = FMG.englishScreens ? FMG.englishScreens.voicePanel() : '';

      <section class="parent-head"><h1>Parent dashboard</h1>
        ${db.profiles.length ? `<div class="seg" role="tablist" aria-label="Choose child">${db.profiles.map((p) => `<button role="tab" aria-selected="${p.id === parentChild}" data-child="${p.id}">${esc(p.nickname)}</button>`).join('')}</div>` : ''}

      <nav class="tabs" aria-label="Parent sections">${tabs.map(([id, n]) => `<a href="#/parent/${id}" class="${tab === id ? 'on' : ''}" ${tab === id ? 'aria-current="page"' : ''}>${n}</a>`).join('')}</nav>
      <div class="parent-body">${body}</div>`, { back: profile() ? '#/home' : '#/', title: 'Parent area', cls: 'wide' });
    $$('[data-child]').forEach((b) => (b.onclick = () => { parentChild = b.dataset.child; parentDashboard(tab); }));

  }

  function parentProgress(child) {
    const atts = attemptsOf(child.id);
    const released = CUR.allSkills().filter((k) => k.status === 'released');
    const rows = released.map((k) => {
      const st = EV.skillState(atts, k.id);
      return st.levels.map((l) => {
        if (l.status === 'not-started') return '';
        const elig = l.assessed;
        return `<tr><td>${esc(k.name)}</td><td>${GEN.LEVEL_NAMES[l.level]}</td><td><span class="pill status-${l.status}">${EV.STATUS_LABEL[l.status]}</span>${l.needsReview ? ' <span class="pill warn">Needs review</span>' : ''}${l.pendingReview ? ' <span class="pill">Pending review</span>' : ''}</td>
          <td>${elig.total ? `${elig.independent} / ${elig.total}` : '—'}<div class="small muted">Check & Review</div></td>
          <td>${l.counts.firstCorrect} ✓ · ${l.counts.firstWrong} ✗<div class="small muted">help used ${l.counts.helpUsed}×</div></td>
          <td>${l.secureDate ? FMG.prettyDate(l.secureDate) : '—'}${l.retainedDate ? `<div class="small muted">retained ${FMG.prettyDate(l.retainedDate)}</div>` : ''}</td>
          <td>${l.reviewDue ? FMG.prettyDate(l.reviewDue) : '—'}</td>
          <td class="small">${l.status === 'secure' || l.status === 'retained' ? 'Met' : esc(l.window.rule.reasons.slice(0, 2).join('; '))}</td></tr>`;
      }).join('');
    }).join('');
    const tags = EV.misconceptions(atts);
    const actions = nextActions(child, atts);
    const heat = CUR.TOPICS.map((t) => {
      const rel = t.skills.filter((k) => k.status === 'released');
      const best = rel.map((k) => EV.skillState(atts, k.id).status);
      const lvl = best.includes('retained') ? 4 : best.includes('secure') ? 3 : best.includes('practising') ? 2 : best.includes('learning') ? 1 : 0;
      return `<div class="heat h${lvl} ${rel.length ? '' : 'na'}" title="${esc(t.name)}"><span>${t.num}</span><small>${esc(t.child)}</small></div>`;
    }).join('');
    const week = weekly(atts);
    return `
      <div class="pgrid">
        <section class="card"><h2 class="h3">Next actions</h2>${actions.length ? `<ol class="actions">${actions.map((a) => `<li><b>${esc(a.title)}</b><div class="small muted">${esc(a.why)}</div></li>`).join('')}</ol>` : '<p class="muted">No activity yet.</p>'}</section>
        <section class="card"><h2 class="h3">This week</h2><div class="week">${week.map((d) => `<div class="wd"><div class="wbar" style="height:${Math.min(100, d.n * 6)}%" title="${d.n} questions"></div><span>${d.label}</span></div>`).join('')}</div><p class="small muted">${week.reduce((s, d) => s + d.n, 0)} questions answered in the last 7 days.</p></section>
      </div>
      <section class="card"><h2 class="h3">Topic map</h2><div class="heatmap">${heat}</div><p class="small muted">Shaded by best skill status. Grey topics have no released content yet.</p></section>
      <section class="card"><h2 class="h3">Skills (${esc(child.nickname)})</h2>
        ${rows ? `<div class="table-wrap"><table><thead><tr><th>Skill</th><th>Level</th><th>Status</th><th>Independent demonstration</th><th>First responses</th><th>Secure</th><th>Review due</th><th>Secure rule</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">No activity yet.</p>'}
        <p class="small muted">Independent demonstration counts committed Check/Review tasks, including supported work in the total. Supported work is not counted as wrong. Policy ${EV.POLICY_VERSION} (proposed, not yet approved).</p>
      </section>
      <section class="card"><h2 class="h3">Misconceptions noticed</h2>${tags.length ? `<ul>${tags.map((t) => `<li>${esc(MISC[t.tag] || FMG.MISC_EXTRA[t.tag] || t.tag)} <span class="muted small">×${t.count}, last ${FMG.prettyDate(t.last)}</span> — <a href="#/learn/${t.skillId}">repair lesson</a></li>`).join('')}</ul>` : '<p class="muted">None recorded.</p>'}</section>`;
  }
  function nextActions(child, atts) {
    const out = [];
    for (const k of CUR.allSkills().filter((x) => x.status === 'released')) {
      const st = EV.skillState(atts, k.id);
      if (st.pendingReview) out.push({ title: `Review ${k.name}`, why: `Review due ${FMG.prettyDate(st.reviewDue)} after Secure on ${FMG.prettyDate(st.secureDate)}.` });
      else if (st.needsReview) out.push({ title: `Repair ${k.name}`, why: 'A retention check was not met; earlier achievement is kept.' });
      else if (st.status === 'practising') out.push({ title: `Check ${k.name}`, why: `${st.window.independent}/10 independent so far: ${st.window.rule.reasons[0] || ''}.` });
      else if (st.status === 'learning') out.push({ title: `Practise ${k.name}`, why: 'Lesson or supported work recorded; no independent success yet.' });
    }
    if (!out.length) { const k = CUR.allSkills().find((x) => x.status === 'released' && CUR.suitability(x, child.route) === 'suitable'); if (k) out.push({ title: `Start ${k.name}`, why: `Suitable for ${CUR.STAGES[CUR.stageIndex(child.route)].name}.` }); }

  function weekly(atts) {

      ${atts.map((a) => `<tr><td>${FMG.prettyDate(a.date)}</td><td>${esc((CUR.skill(a.skillId) || {}).childName || a.skillId)}<div class="small muted">${GEN.LEVEL_NAMES[a.level] || ''}</div></td><td>${esc(a.origin)}</td><td>${esc(a.kind)}</td><td>${a.firstResponse == null ? '—' : esc(a.firstResponse)} ${a.firstCorrect === true ? '✓' : a.firstCorrect === false ? '✗' : ''}</td><td>${a.hints ? a.hints + ' hint' + (a.hints > 1 ? 's' : '') : ''}${a.solutionShown ? ' · solution' : ''}</td><td><span class="pill o-${EV.outcome(a)}">${EV.outcome(a)}</span></td></tr>`).join('')}
    </tbody></table></div><p class="small muted">Showing the latest 60. Template and seed are stored with each attempt so any question can be reproduced.</p></section>`;

        <button class="btn ghost sm danger" data-reset="${p.id}">Reset progress…</button>
      </div>`).join('')}
      <div class="row"><input id="newname" placeholder="New learner nickname" maxlength="20" aria-label="New learner nickname"><select id="newroute" aria-label="Starting point">${CUR.STAGES.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="btn primary" id="addl">Add learner</button></div>
      <p class="small muted">Nicknames only — no dates of birth or emails needed. Starting points suggest where to begin; any learner can explore any topic.</p></section>`;

    const sum = CUR.coverageSummary();

    return `<section class="card"><h2 class="h3">What is ready (honest status)</h2>
      <p>This is <b>Phase 1 (Foundation)</b> of the new Family English: the Family Maths framework with all the existing English content moved in as skills. It does <b>not</b> claim complete coverage. Writing (topics 19–23) and modern texts (topic 27) are planned for later phases; their skills are listed as planned.</p>
      <div class="table-wrap"><table><thead><tr><th>Stage</th><th>Released skills</th><th>Planned skills</th></tr></thead><tbody>${CUR.STAGES.map((s) => `<tr><td>${esc(s.route)}</td><td>${sum[s.id].released}</td><td>${sum[s.id].planned}</td></tr>`).join('')}</tbody></table></div>
      <h3>Topics</h3>
      <div class="table-wrap"><table><thead><tr><th>Topic</th><th>Ready</th><th>Planned</th><th>Ready skills</th></tr></thead><tbody>${rows}</tbody></table></div>
      <h3>Where the content comes from</h3>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>Source</th><th>Locator</th><th>Objective (paraphrase)</th><th>Content</th><th>Review</th></tr></thead><tbody>${CUR.REGISTER.map((r) => `<tr><td>${esc(r.id)}</td><td>${esc(r.authority)}</td><td>${esc(r.locator)}</td><td>${esc(r.text)}</td><td>${esc(r.content)}</td><td>${esc(r.review)}</td></tr>`).join('')}</tbody></table></div>
      <p class="small muted">All texts are written for this app or are out of copyright. Exam-style questions are original practice, not official papers. See docs/english-design.md in the Family English Game folder.</p></section>`;
  }

  function bindParent(tab) {
    if (tab === 'learners') {
      $$('[data-lp]').forEach((row) => {
        const pid = row.dataset.lp;
        $$('[data-f]', row).forEach((inp) => inp.addEventListener('change', () => {
          const f = inp.dataset.f;
          const val = inp.type === 'checkbox' ? inp.checked : inp.value;
          const res = store.commit((d) => {
            const p = d.profiles.find((x) => x.id === pid);
            if (f === 'nickname') p.nickname = String(val).trim() || p.nickname;
            else if (f === 'route') p.route = val;
            else if (f === 'practiceCount') p.prefs.practiceCount = +val;
            else p.prefs[f] = val;
          });
          saved(res); applyPrefs();
        }));
        const rb = $('[data-reset]', row);
        rb.onclick = () => {
          const p = store.get().profiles.find((x) => x.id === pid);
          const n = attemptsOf(pid).length;
          askConfirm(`Delete all ${n} recorded attempts for ${p.nickname}? This can’t be undone. Consider making a backup first.`, 'Delete progress', () => {
            saved(store.commit((d) => { d.attempts = d.attempts.filter((a) => a.profileId !== pid); }));
            parentDashboard('learners');
          });
        };
      });
      $('#addl').onclick = () => {
        const name = $('#newname').value.trim(); if (!name) return $('#newname').focus();
        const n = store.get().profiles.length;
        const route = $('#newroute').value;
        saved(store.commit((d) => d.profiles.push(newProfile(name, route, n, route === 'eyfs' || route === 'ks1' ? 'playful' : 'calm'))));
        parentDashboard('learners');
      };
    }
    if (tab === 'backup') {
      $('#export').onclick = () => {
        const data = JSON.stringify(store.exportBackup(), null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `family-english-backup-${FMG.today()}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        $('#importbox').innerHTML = `<div class="card soft"><p class="small">If no file downloaded (some embedded pages block downloads), copy this text and save it as a .json file:</p><textarea id="bk" class="bk" readonly rows="6">${esc(data)}</textarea><div class="row"><button class="btn ghost sm" id="copybk">Copy backup text</button></div></div>`;
        $('#copybk').onclick = () => { const t = $('#bk'); (navigator.clipboard ? navigator.clipboard.writeText(data) : Promise.reject()).then(() => ($('#copybk').textContent = 'Copied'), () => { t.focus(); t.select(); }); };
      };
      $('#import').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        let obj; try { obj = JSON.parse(await f.text()); } catch (err) { $('#importbox').innerHTML = '<div class="fb try">That file isn’t valid JSON.</div>'; return; }
        const pv = store.previewImport(obj);
        if (!pv.ok) { $('#importbox').innerHTML = `<div class="fb try">${pv.errors.map(esc).join('<br>')}</div>`; return; }
        $('#importbox').innerHTML = `<div class="card soft"><p>Backup contains ${pv.profiles} learners (${pv.newProfiles} new) and ${pv.attempts} attempts (${pv.newAttempts} new, ${pv.duplicates} already here and will be skipped).</p>
          <div class="row"><button class="btn primary" id="merge">Merge into this device</button><button class="btn ghost danger" id="replace">Replace everything on this device</button></div></div>`;
        $('#merge').onclick = () => { saved(store.applyImport(obj, 'merge')); parentDashboard('backup'); };
        $('#replace').onclick = () => askConfirm('Replace ALL learners and progress on this device with the backup? This can’t be undone.', 'Replace everything', () => { saved(store.applyImport(obj, 'replace')); parentDashboard('backup'); });
      };
    }
  }

  /* ================= Extension hooks =================
     Other files (loaded before app.js) can push [regex, fn] into FMG.extRoutes; fn is called with the route's
     captured groups, after FMG.app is ready. FMG.app exposes the shell helpers they need. */
  FMG.app = { route, shell, go, render, esc, $, $$, profile, store, saved, speech, toHash, startSession, updateProfile, speakIfOn, attemptsOf, LETTERS, answerModeSwitch, textBox };
  (FMG.extRoutes || []).forEach(([re, fn]) => route(re, fn));
  FMG.extRoutes = { push: ([re, fn]) => route(re, fn) };

  /* ================= Boot ================= */
  ensureDefaultProfiles();
  applyPrefs();
  if (speech.ok) try { speechSynthesis.getVoices(); } catch (e) { /* ignore */ }
  render();
})(window);

</script>
