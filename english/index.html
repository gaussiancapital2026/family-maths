.flnav .btn{min-width:90px;font-size:1.8rem}

  <script>
/* Family Maths Game — core utilities (namespace, seeded RNG, exact rationals, dates, ids).
   Classic script (no modules) so the app opens straight from a folder with no server. */
(function (root) {
  'use strict';
  const FMG = (root.FMG = root.FMG || {});

  /* ---------- Seeded random (mulberry32) ---------- */
  function rng(seed) {
    let a = seed >>> 0;
    const next = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.int = (lo, hi) => lo + Math.floor(next() * (hi - lo + 1));
    next.pick = (arr) => arr[Math.floor(next() * arr.length)];
    next.shuffle = (arr) => {
      const a2 = arr.slice();
      for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; }
      return a2;
    };
    return next;
  }
  function newSeed() { return (Math.random() * 2 ** 31) >>> 0; }

  /* ---------- Exact rational arithmetic ---------- */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
  function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }

  class Q {
    constructor(n, d = 1) {
      if (!Number.isInteger(n) || !Number.isInteger(d)) throw new Error('Q needs integers');
      if (d === 0) throw new Error('Zero denominator');
      if (d < 0) { n = -n; d = -d; }
      const g = gcd(n, d);
      this.n = n / g; this.d = d / g;
      this.rawN = n; this.rawD = d; // as written (sign-normalised), for form checks
    }
    static of(x) { return x instanceof Q ? x : new Q(x, 1); }
    add(o) { o = Q.of(o); return new Q(this.n * o.d + o.n * this.d, this.d * o.d); }
    sub(o) { o = Q.of(o); return new Q(this.n * o.d - o.n * this.d, this.d * o.d); }
    mul(o) { o = Q.of(o); return new Q(this.n * o.n, this.d * o.d); }
    div(o) { o = Q.of(o); return new Q(this.n * o.d, this.d * o.n); }
    eq(o) { o = Q.of(o); return this.n === o.n && this.d === o.d; }
    cmp(o) { o = Q.of(o); return this.n * o.d - o.n * this.d; }
    isInt() { return this.d === 1; }
    valueOf() { return this.n / this.d; }
    toString() { return this.d === 1 ? String(this.n) : `${this.n}/${this.d}`; }
    toMixed() {
      if (this.d === 1 || Math.abs(this.n) < this.d) return this.toString();
      const w = Math.trunc(this.n / this.d), r = Math.abs(this.n % this.d);
      return `${w} ${r}/${this.d}`;
    }
  }

  /* ---------- Dates (Europe/London calendar days) ---------- */
  const clock = { offsetMs: 0, now() { return Date.now() + this.offsetMs; } };
  const londonFmt = (typeof Intl !== 'undefined')
    ? new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' })
    : null;
  function londonDate(ms) { return londonFmt ? londonFmt.format(new Date(ms)) : new Date(ms).toISOString().slice(0, 10); }
  function dayNumber(isoDate) { const [y, m, d] = isoDate.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }
  function addDays(isoDate, n) { return new Date((dayNumber(isoDate) + n) * 864e5).toISOString().slice(0, 10); }
  function daysBetween(a, b) { return dayNumber(b) - dayNumber(a); }
  function prettyDate(iso) {
    try { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); } catch (e) { return iso; }
  }

  /* ---------- IDs ---------- */
  function uid(prefix) {
    const r = (root.crypto && root.crypto.randomUUID) ? root.crypto.randomUUID().replace(/-/g, '').slice(0, 16)
      : Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    return `${prefix}_${r}`;
  }

  /* ---------- Small helpers ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function fracHTML(q) {
    q = Q.of(q);
    if (q.d === 1) return `<span class="num">${q.n < 0 ? '−' + Math.abs(q.n) : q.n}</span>`;
    const sign = q.n < 0 ? '−' : '';
    return `<span class="frac" aria-label="${sign}${Math.abs(q.n)} over ${q.d}">${sign}<span class="fr"><span>${Math.abs(q.n)}</span><span>${q.d}</span></span></span>`;
  }
  function fracTxt(n, d) { return `<span class="frac" aria-label="${n} over ${d}"><span class="fr"><span>${n}</span><span>${d}</span></span></span>`; }

  Object.assign(FMG, { rng, newSeed, gcd, lcm, Q, clock, londonDate, dayNumber, addDays, daysBetween, prettyDate, uid, esc, fracHTML, fracTxt });
  FMG.today = () => londonDate(clock.now());
})(typeof window !== 'undefined' ? window : globalThis);

</script>

    const measure = strokes.map((d) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); svg.appendChild(p); p.style.display = 'none'; const len = p.getTotalLength(), pts = []; for (let k = 0; k <= len; k += 3) { const q = p.getPointAtLength(k); pts.push([q.x, q.y]); } return { len, pts }; });
    let cur = 0, drawn = [], down = false;
    const showMark = () => {
      if (cur >= strokes.length) { mark.innerHTML = ''; return; }
      const [x0, y0] = measure[cur].pts[0], [x1, y1] = measure[cur].pts[Math.min(4, measure[cur].pts.length - 1)];
      const ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI;
      mark.innerHTML = `<circle cx="${x0}" cy="${y0}" r="5.5" class="tr-start"/><path d="M0 -3 L6 0 L0 3 Z" class="tr-arrow" transform="translate(${x0 + 9 * Math.cos(ang * Math.PI / 180)} ${y0 + 9 * Math.sin(ang * Math.PI / 180)}) rotate(${ang})"/>`;
      el.querySelectorAll('.tr-guide').forEach((g) => g.classList.toggle('now', +g.dataset.s === cur));
    };
    const pt = (e) => { const r = svg.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * 100, ((e.clientY - r.top) / r.height) * 120]; };
    const path = (ps) => ps.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');

    svg.addEventListener('pointermove', (e) => { if (!down) return; e.preventDefault(); drawn.push(pt(e)); ink.setAttribute('d', path(drawn)); });
    const up = () => {
      if (!down) return; down = false;
      const m = measure[cur], d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
      const startOk = d2(drawn[0], m.pts[0]) < 16 ** 2;
      const covered = m.pts.filter((p) => drawn.some((q) => d2(p, q) < 10 ** 2)).length / m.pts.length;
      const stray = drawn.filter((q) => !m.pts.some((p) => d2(p, q) < 16 ** 2)).length / drawn.length;
      const tiny = m.len < 6; // a dot: a tap near it is enough

      ink.setAttribute('d', '');
      if (ok) {
        doneG.insertAdjacentHTML('beforeend', `<path d="${strokes[cur]}" class="tr-good"/>`);

        if (cur >= strokes.length && opts.onDone) opts.onDone();

  <script>
/* Family English — screens. Phonics (Little Wandle order), reading, tricky words, handwriting, phonics check practice,
   a reading ladder and toddler flashcards. Same rules as Family Maths: A–D options with a Type it switch, natural voices only. */
(function (root) {
  'use strict';
  const FMG = root.FMG, E = FMG.english, P = E.P, esc = FMG.esc, V = FMG.voice, SND = FMG.sounds, T = FMG.trace;
  const $ = (s, el = document) => el.querySelector(s);

  const app = document.getElementById('app');
  const store = FMG.createStore(); store.load();
  const BANDS = { tiny: 'Flashcards (age 1–3)', little: 'Reading and writing (age 4–7)', big: 'Reading and writing (age 7+)' };

  /* ---------- Profiles ---------- */
  const COLOURS = ['#e0602a', '#0a6fd6', '#5847eb', '#0b8a8a', '#d6336c'];
  function ensureProfiles() {
    if (store.get().profiles.length) return;
    store.commit((d) => { d.profiles = [['Tiny explorer', 'tiny'], ['Little explorer', 'little'], ['Big explorer', 'big']].map(([n, b], i) => ({ id: FMG.uid('p'), nickname: n, band: b, colour: COLOURS[i], prefs: { speech: true }, createdAt: Date.now() })); });
  }
  ensureProfiles();
  let pid = null; try { pid = sessionStorage.getItem('fe.profile'); } catch (e) { /* ignore */ }
  const profile = () => store.get().profiles.find((p) => p.id === pid);
  const setProfile = (id) => { pid = id; try { sessionStorage.setItem('fe.profile', id); } catch (e) { /* ignore */ } };
  const attemptsOf = (id) => store.get().attempts.filter((a) => a.profileId === id);
  const statesOf = (p) => E.itemStates(attemptsOf(p.id));
  const tiny = () => profile() && profile().band === 'tiny';
  const say = (t) => V.say(t);
  const sayIfOn = (t) => { const p = profile(); if (p && p.prefs.speech !== false) say(t); };
  function saved(res) { if (res && !res.ok) { const b = $('#savebar'); if (b) { b.textContent = res.error; b.classList.add('show'); } } }

  /* ---------- Routing ---------- */
  const routes = []; const route = (re, fn) => routes.push([re, fn]);
  let cleanup = null, guard = null;
  function render() {
    V.stop(); if (cleanup) { const c = cleanup; cleanup = null; c(); }
    guard = null;
    const h = location.hash || '#/';
    if (!profile() && !/^#\/(parent.*)?$/.test(h)) { if (h !== '#/') { location.hash = '#/'; return; } }

  }
  window.addEventListener('hashchange', render);
  document.addEventListener('click', (e) => { const a = e.target.closest && e.target.closest('a[href^="#"]'); if (!a || !guard) return; const g = guard(); if (g && !confirm(g)) { e.preventDefault(); } else guard = null; }, true);

  function shell(inner, o = {}) {
    const p = profile();
    app.innerHTML = `<header class="top">
        ${o.back ? `<a class="tbtn" href="${o.back}" aria-label="Back">‹ <span>${esc(o.backText || 'Back')}</span></a>` : `<a class="brand" href="${p ? '#/home' : '#/'}"><span class="logo" aria-hidden="true">Aa</span><span>Family English</span></a>`}
        <div class="sp"></div>
        ${p ? `<a class="who" href="#/" title="Change learner"><span class="av" style="background:${p.colour}">${esc(p.nickname[0])}</span><span class="wn">${esc(p.nickname)}</span></a>` : ''}
        <a class="tbtn" href="#/parent" aria-label="Grown-ups">👪<span>Grown-ups</span></a></header>
      <div id="savebar" class="savebar" role="status"></div>
      <main class="page ${o.cls || ''}">${inner}</main>`;
    $$('[data-say]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); say(b.dataset.say); }));
    $$('[data-snd]').forEach((b) => (b.onclick = async (e) => { e.preventDefault(); if (!(await SND.play(b.dataset.snd))) say(b.dataset.ex); }));
  }
  const bar = (pct) => `<span class="bar"><span style="width:${pct}%"></span></span>`;
  const gchip = (g) => `<button class="gchip" data-snd="${esc(g)}" data-ex="${esc(P.G[g][0])}" title="Hear it">${esc(E.show(g))}<small>${P.G[g][1]} ${esc(P.G[g][0])}</small></button>`;
  const soundButtons = (w, uid) => `<button class="sbw" data-say="${esc(w)}">${E.split(w, uid).map((g) => `<span class="sb ${E.show(g).length > 1 || g.includes('-') ? 'dash' : 'dot'}">${esc(g.includes('-') ? g[0] + '…e' : E.show(g))}</span>`).join('')}</button>`;

  /* ---------- Who is learning ---------- */
  route(/^#\/?$/, () => {
    const ps = store.get().profiles;
    shell(`<div class="center hero"><h1>Who is learning?</h1><p class="muted">Tap your name.</p></div>
      <div class="whos">${ps.map((p) => `<button class="whob" data-p="${p.id}"><span class="av big" style="background:${p.colour}">${esc(p.nickname[0])}</span><b>${esc(p.nickname)}</b><small>${esc(BANDS[p.band] || '')}</small></button>`).join('')}</div>
      <p class="center small muted">Grown-ups can rename learners in the Grown-ups area.</p>`);
    $$('[data-p]').forEach((b) => (b.onclick = () => { setProfile(b.dataset.p); location.hash = '#/home'; }));
  });

  /* ---------- Home ---------- */
  route(/^#\/home$/, () => {
    const p = profile();
    if (p.band === 'tiny') return cardsHome();
    const states = statesOf(p);
    const next = P.UNITS.find((u) => !E.unitProgress(u, states).star) || P.UNITS[0];
    const stars = P.UNITS.filter((u) => E.unitProgress(u, states).star).length;
    shell(`<section class="hero"><h1>Hello, ${esc(p.nickname)}! 📚</h1><p class="muted">Let’s read and write.</p>
        <a class="nextcard" href="#/unit/${next.id}"><span class="eyebrow">Next: ${esc(E.stageOf(next.stage).name)}</span><b>${esc(next.title)}</b><span>${next.gr.length ? next.gr.map((g) => esc(E.show(g))).join('  ') : esc(E.wordsOf(next).slice(0, 4).join(', '))}</span><span class="go">Start ›</span></a></section>
      <div class="tiles">
        <a class="tile t-read" href="#/phonics"><span>🔤</span><b>Phonics</b><small>Sounds, words and sentences · ${stars}/${P.UNITS.length} ⭐</small></a>
        <a class="tile t-write" href="#/write"><span>✏️</span><b>Handwriting</b><small>Trace every letter</small></a>
        <a class="tile t-tricky" href="#/play/tricky"><span>🧩</span><b>Tricky words</b><small>Words to know by heart</small></a>
        <a class="tile t-ladder" href="#/ladder"><span>🪜</span><b>Reading ladder</b><small>Climb from Phase 2 to Phase 5</small></a>
        <a class="tile t-check" href="#/check"><span>📝</span><b>Phonics check</b><small>Year 1 check practice: 40 words</small></a>
        <a class="tile t-cards" href="#/cards"><span>🃏</span><b>Flashcards</b><small>Pictures and words</small></a>
      </div>
      <p class="small muted center">Coming next: spelling and grammar (KS1–KS2), reading comprehension, then English Language and Literature up to GCSE.</p>`);
  });

  route(/^#\/phonics$/, () => {
    const p = profile(), states = statesOf(p);
    shell(`<h1>🔤 Phonics</h1><p class="muted">In the order most English schools teach it (Little Wandle). Tap a lesson to learn its sounds, read its words and practise.</p>
      ${P.STAGES.map((s) => `<section class="stage"><h2>${esc(s.name)} <small>${esc(s.when)}</small></h2><p class="small muted">${esc(s.desc)}</p>
        <div class="units">${E.stageUnits(s.id).map((u) => { const pr = E.unitProgress(u, states); return `<a class="unit ${pr.star ? 'star' : ''}" href="#/unit/${u.id}"><b>${esc(u.title)}</b>${pr.star ? '<span class="st">⭐</span>' : ''}${bar(pr.pct)}</a>`; }).join('')}</div>
        <div class="row"><a class="btn ghost sm" href="#/play/${s.id}">Mixed practice: ${esc(s.name)}</a></div></section>`).join('')}`, { back: '#/home', backText: 'Home' });
  });

  route(/^#\/unit\/(u\d+)$/, (id) => {
    const u = E.unit(id); if (!u) { location.hash = '#/phonics'; return; }
    const p = profile(), pr = E.unitProgress(u, statesOf(p));
    const letters = u.gr.filter((g) => g.length === 1 && T.L[g]);
    const ws = E.wordsOf(u), tr = E.trickyOf(u);
    shell(`<span class="eyebrow">${esc(E.stageOf(u.stage).name)} · ${esc(E.stageOf(u.stage).when)}</span><h1>${esc(u.title)}</h1>
      ${u.gr.length ? `<h2 class="h2">New sounds</h2><p class="small muted">Tap a sound to hear it.${SND.count() ? '' : ' (A grown-up can record the pure sounds in the Grown-ups area; until then you hear the example word.)'}</p><div class="gchips">${u.gr.map(gchip).join('')}</div>` : ''}
      <div class="row actions"><a class="btn primary big" href="#/play/${u.id}">▶ Practise</a>${letters.length ? `<a class="btn ghost" href="#/write/${letters.join('')}">✏️ Write ${letters.join(' ')}</a>` : ''}</div>
      ${ws.length ? `<h2 class="h2">Read these words</h2><p class="small muted">Say each sound under the dots and dashes, then blend them. Tap a word to hear it.</p><div class="words">${ws.map((w) => soundButtons(w, u.id)).join('')}</div>` : ''}
      ${tr.length ? `<h2 class="h2">Tricky words</h2><div class="words">${tr.map((t) => `<button class="sbw tricky" data-say="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
      <p class="small muted">Progress: ${pr.secure} of ${pr.n} things known well${pr.star ? ' ⭐' : ''}.</p>`, { back: '#/phonics', backText: 'Phonics' });
  });

  /* ---------- Questions ---------- */
  function qHtml(q, typing) {
    const big = q.sentence ? `<p class="sentence">${esc(q.sentence)}</p>` : q.big ? `<div class="qbig">${esc(q.big)}</div>` : '';
    return `<div class="qcard">
      ${q.pic ? `<div class="qpic" aria-hidden="true">${q.pic}</div>` : ''}${big}
      <p class="prompt">${esc(q.prompt)}</p>
      <div class="qtools">${q.typable ? `<div class="seg" role="radiogroup" aria-label="How to answer"><button role="radio" aria-checked="${!typing}" data-tm="0">A B C D</button><button role="radio" aria-checked="${typing}" data-tm="1">Type it</button></div>` : ''}
        ${q.hear ? `<button class="btn sm ghost" id="hear">🔊 Hear it</button>` : ''}<button class="btn sm ghost" id="sayq">🗣️ Read it</button></div>
      ${typing ? `<form class="type-row" id="tf" autocomplete="off"><input id="ans" class="type-in" placeholder="Type your answer" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer"><button class="btn primary">Check</button></form>`
        : `<div class="abcd ${q.kind === 'pic' ? 'pics' : ''}">${q.options.map((o, i) => `<button class="opt" data-opt="${i}"><span class="l">${o.letter}</span><span class="v">${esc(o.value)}</span></button>`).join('')}</div>`}
      <div id="fb" aria-live="polite"></div></div>`;
  }
  /* Run a set of questions. o: { qs | next(), label, back, mode, onEnd(results), ladder } */
  function runRound(o) {
    const p = profile(), S = { i: 0, res: [], typeMode: null, sess: FMG.uid('s') };
    let ended = false; guard = () => (!ended && S.res.length && o.qs ? 'Leave this round? Your answers so far are saved.' : null);
    const draw = (q) => {
      q = q || (o.qs ? o.qs[S.i] : o.next());
      if (!q) { o.onEnd && o.onEnd(S.res); return; }
      const typing = q.typable && (S.typeMode != null ? S.typeMode : p.band === 'big' && /spell|tricky/.test(q.qt));
      const top = o.qs ? `<div class="qprog">${o.qs.map((x, k) => `<span class="${k < S.i ? (S.res[k] && S.res[k].ok ? 'good' : 'done') : k === S.i ? 'cur' : ''}"></span>`).join('')}</div>` : `<span class="small muted">${S.res.filter((r) => r.ok).length} right · ${S.res.length} answered</span>`;
      shell(`<div class="qtop"><span class="qmode">${esc(o.label)}</span>${top}</div>${o.above ? o.above() : ''}${qHtml(q, typing)}
        <div class="qnav"><a class="btn ghost" href="${o.back}">Stop</a><button class="btn primary big" id="next" hidden>${o.qs && S.i === o.qs.length - 1 ? 'See how I did' : 'Next ›'}</button></div>`, { back: o.back, cls: 'focus' });
      if (o.bind) o.bind(draw);
      $$('[data-tm]').forEach((b) => (b.onclick = () => { S.typeMode = b.dataset.tm === '1'; draw(q); }));
      $('#sayq').onclick = () => say(q.speak || q.prompt);
      const hb = $('#hear'); if (hb) hb.onclick = () => say(q.hear);
      if (q.hear) setTimeout(() => sayIfOn(q.speak || q.hear), 250); else if (p.band === 'little') setTimeout(() => sayIfOn(q.speak || q.prompt), 250);
      const done = (ok, given, idx) => {
        S.res.push({ q, ok });
        saved(store.upsertAttempt({ id: FMG.uid('a'), profileId: p.id, c: q.item, unit: q.unit, qt: q.qt, ok, mode: o.mode, day: FMG.today(), at: Date.now(), sess: S.sess, given: String(given || '').slice(0, 40), typed: typing }));
        $$('[data-opt]').forEach((b) => { b.disabled = true; const i = +b.dataset.opt; if (i === q.answerIndex) b.classList.add('right'); else if (i === idx) b.classList.add('wrong'); });
        const right = q.options[q.answerIndex].value;
        const moved = o.after ? o.after(ok) : '';
        $('#fb').innerHTML = `<div class="fb ${ok ? 'good' : ''}"><b>${ok ? rng1(['🎉 Yes!', '⭐ Well done!', '👏 Brilliant!', '✅ That’s right!']) : 'Nearly!'}</b> ${ok ? '' : `The answer is <b>${esc(right)}</b>.`}<p>${esc(q.why || '')}</p>${moved || ''}</div>`;
        if (!ok) sayIfOn(`Nearly. The answer is ${right}.`); else if (p.band === 'little') sayIfOn('Yes!');
        const nx = $('#next'); nx.hidden = false; nx.focus();
        nx.onclick = () => { S.i++; if (o.qs && S.i >= o.qs.length) { ended = true; o.onEnd(S.res); } else draw(); };
      };
      if (typing) { const f = $('#tf'), inp = $('#ans'); inp.focus(); f.onsubmit = (e) => { e.preventDefault(); const v = inp.value.trim(); if (!v) return; inp.disabled = true; $('button', f).disabled = true; done(E.matchTyped(v, q), v, -1); }; }
      else $$('[data-opt]').forEach((b) => (b.onclick = () => done(+b.dataset.opt === q.answerIndex, q.options[+b.dataset.opt].value, +b.dataset.opt)));
    };
    const key = (e) => { const i = 'abcd'.indexOf((e.key || '').toLowerCase()); const b = $(`[data-opt="${i}"]`); if (i >= 0 && b && !b.disabled && !/input/i.test(e.target.tagName)) b.click(); else if (e.key === 'Enter' && $('#next') && !$('#next').hidden && document.activeElement !== $('#next')) $('#next').click(); };
    document.addEventListener('keydown', key); cleanup = () => document.removeEventListener('keydown', key);
    draw();
  }
  const rng1 = (a) => a[Math.floor(Math.random() * a.length)];
  function results(res, back, again, title) {
    const right = res.filter((r) => r.ok).length, wrong = res.filter((r) => !r.ok);
    shell(`<div class="center end"><div class="end-e">${right === res.length ? '🌟' : right >= res.length * 0.7 ? '🎉' : '🌱'}</div><h1>${right} out of ${res.length}</h1><p class="muted">${esc(title || '')}</p></div>
      ${wrong.length ? `<h2 class="h2">Look at these again</h2><ul class="review">${wrong.map((r) => `<li>${r.q.pic ? r.q.pic + ' ' : ''}${esc(r.q.prompt)} <b>${esc(r.q.options[r.q.answerIndex].value)}</b><br><small class="muted">${esc(r.q.why || '')}</small></li>`).join('')}</ul>` : ''}
      <div class="row center"><a class="btn primary" href="${again}" id="again">Go again</a><a class="btn ghost" href="${back}">Done</a></div>`, { back });
    $('#again').onclick = (e) => { e.preventDefault(); render(); };
    sayIfOn(`${right} out of ${res.length}. ${right === res.length ? 'Amazing!' : 'Well done!'}`);
  }
  route(/^#\/play\/([\w]+)$/, (target) => {
    const p = profile(), rng = FMG.rng(FMG.newSeed());
    let items, label, back;
    if (/^u\d+$/.test(target)) { const u = E.unit(target); items = E.itemsOf(u); label = u.title; back = `#/unit/${u.id}`; }
    else if (/^p\d$/.test(target)) { items = E.stageItems(target); label = `${E.stageOf(target).name} mixed`; back = '#/phonics'; }
    else if (target === 'tricky') { items = P.UNITS.flatMap((u) => E.trickyOf(u).map((t) => `t:${u.id}:${t}`)); label = 'Tricky words'; back = '#/home'; }
    else { location.hash = '#/home'; return; }
    const qs = E.buildSet(items, rng, { band: p.band, count: p.band === 'little' ? 8 : 10, states: statesOf(p) });
    runRound({ qs, label, back, mode: 'practice', onEnd: (res) => results(res, back, location.hash, label) });
  });

  /* ---------- Reading ladder ---------- */
  route(/^#\/ladder$/, () => {
    const p = profile(), rng = FMG.rng(FMG.newSeed()), key = `fe.ladder.${p.id}`;
    let st = { r: 0, streak: 0, miss: 0 }; try { const s = JSON.parse(localStorage.getItem(key) || 'null'); if (s) st = Object.assign(st, { r: s.r }); } catch (e) { /* ignore */ }
    let msg = '';
    const keep = () => { try { localStorage.setItem(key, JSON.stringify({ r: st.r })); } catch (e) { /* ignore */ } };
    runRound({ label: '🪜 Reading ladder', back: '#/home', mode: 'ladder',
      next: () => E.ladderQuestion(st, rng, p.band),
      above: () => `<div class="rungs">${P.STAGES.map((s, i) => `<button class="rung ${i === st.r ? 'cur' : ''}" data-rung="${i}">${esc(s.name)}<small>${esc(s.when)}</small></button>`).join('')}</div>
        <p class="level"><span class="badge">${esc(P.STAGES[st.r].name)}</span> ${esc(P.STAGES[st.r].desc)} <small class="muted">· ${E.UP - (st.streak || 0)} right in a row to climb</small></p>${msg ? `<p class="moved">${msg}</p>` : ''}`,
      bind: (draw) => $$('[data-rung]').forEach((b) => (b.onclick = () => { st = { r: +b.dataset.rung, streak: 0, miss: 0 }; msg = ''; keep(); draw(); })),
      after: (ok) => { const r = E.ladderStep(st, ok); st = r.st; keep(); msg = r.moved > 0 ? `⬆️ Up to ${P.STAGES[st.r].name}! Brilliant reading.` : r.moved < 0 ? `⬇️ Back to ${P.STAGES[st.r].name} for a bit more practice.` : ''; return msg ? `<p class="moved">${msg}</p>` : ''; },
    });
  });

  /* ---------- Phonics screening check practice ---------- */
  route(/^#\/check$/, () => {
    const p = profile(), past = ((store.get().exams || {})[p.id] || { results: [] }).results.filter((r) => r.kind === 'check').slice(-5).reverse();
    shell(`<h1>📝 Phonics check practice</h1>
      <p>In June of Year 1, every child in England reads 40 words to their teacher: <b>20 real words and 20 alien words</b> (made-up words they read using phonics). The pass mark has been <b>32 out of 40</b> every year so far.</p>
      <p class="muted">How to do it: sit with your child. They read each word aloud; you tap <b>✓</b> if they read it right or <b>✗</b> if not. Alien words are shown with an alien 👽: any sensible phonics reading counts. The app cannot hear your child, so a grown-up marks.</p>
      <div class="row"><a class="btn primary big" href="#/check/go">Start the 40 words</a></div>
      ${past.length ? `<h2 class="h2">Past tries</h2><ul class="review">${past.map((r) => `<li>${esc(FMG.prettyDate ? FMG.prettyDate(r.day) : r.day)}: <b>${r.right}/40</b> ${r.right >= 32 ? '✅ at the pass mark' : '🌱 not yet'}</li>`).join('')}</ul>` : ''}`, { back: '#/home', backText: 'Home' });
  });
  route(/^#\/check\/go$/, () => {
    const p = profile(), chk = E.screeningCheck(FMG.rng(FMG.newSeed())), marks = [];
    guard = () => (marks.length && marks.length < 40 ? 'Leave the phonics check? This try will not be saved.' : null);
    const draw = () => {
      const i = marks.length;
      if (i >= 40) return finish();
      const w = chk.words[i];
      shell(`<div class="qtop"><span class="qmode">Phonics check · ${i < 20 ? 'Section 1' : 'Section 2'}</span><span class="small muted">Word ${i + 1} of 40</span></div>
        <div class="qcard center"><div class="chk-word">${w.alien ? '<span class="alien" title="Alien word">👽</span>' : ''}${esc(w.w)}</div>
        <p class="small muted">${w.alien ? 'An alien word: read it with your sounds.' : 'A real word.'}</p>
        <div class="row center"><button class="btn mark yes" id="y">✓ Read it right</button><button class="btn mark no" id="n">✗ Not yet</button></div></div>
        <div class="qnav"><a class="btn ghost" href="#/check">Stop</a>${i ? '<button class="btn ghost" id="undo">↶ Undo last</button>' : ''}</div>`, { back: '#/check', cls: 'focus' });
      $('#y').onclick = () => { marks.push(true); draw(); }; $('#n').onclick = () => { marks.push(false); draw(); };
      const u = $('#undo'); if (u) u.onclick = () => { marks.pop(); draw(); };
    };
    const finish = () => {
      guard = null;
      const right = marks.filter(Boolean).length, missed = chk.words.filter((_, i) => !marks[i]);
      saved(store.commit((d) => { d.exams = d.exams || {}; const m = d.exams[p.id] = d.exams[p.id] || { results: [] }; m.results = (m.results || []).concat({ id: FMG.uid('x'), kind: 'check', right, n: 40, day: FMG.today(), at: Date.now(), missed: missed.map((x) => x.w) }).slice(-100); }));
      shell(`<div class="center end"><div class="end-e">${right >= 32 ? '🏆' : '🌱'}</div><h1>${right} out of 40</h1><p>${right >= 32 ? 'That is at the pass mark (32). Brilliant reading!' : `The pass mark is 32, so ${32 - right} more to go. Keep practising the sounds below.`}</p></div>
        ${missed.length ? `<h2 class="h2">Words to practise</h2><div class="words">${missed.map((x) => `<span class="sbw ${x.alien ? 'tricky' : ''}">${x.alien ? '👽 ' : ''}${esc(x.w)}</span>`).join('')}</div>` : ''}
        <div class="row center"><a class="btn primary" href="#/check">Done</a><a class="btn ghost" href="#/ladder">Reading ladder</a></div>`, { back: '#/check' });
    };
    draw();
  });

  /* ---------- Handwriting ---------- */
  route(/^#\/write$/, () => {
    shell(`<h1>✏️ Handwriting</h1><p class="muted">Print letters first, as in Reception and Year 1. Start at the green dot and follow the arrow. A finger works; an Apple Pencil is even better. Joined handwriting comes later, from Year 2.</p>
      ${T.FAMILIES.map((f) => `<section class="stage"><h2>${esc(f.name)}</h2><div class="letters">${f.letters.split(' ').map((l) => `<a class="letter" href="#/write/${l}">${l}</a>`).join('')}</div><div class="row"><a class="btn ghost sm" href="#/write/${f.letters.replace(/ /g, '')}">Write them all</a></div></section>`).join('')}
      <section class="stage"><h2>The whole alphabet</h2><div class="row"><a class="btn primary" href="#/write/abcdefghijklmnopqrstuvwxyz">a to z</a></div></section>`, { back: '#/home', backText: 'Home' });
  });
  route(/^#\/write\/([a-z]+)$/, (letters) => {
    const p = profile(); let i = 0, tries = 0;
    const draw = (guide) => {
      const l = letters[i], def = T.L[l]; if (!def) { i++; if (i < letters.length) draw(true); return; }
      shell(`<div class="qtop"><span class="qmode">✏️ Write ${esc(l)}</span><span class="small muted">${letters.length > 1 ? `Letter ${i + 1} of ${letters.length}` : ''}</span></div>
        <div class="qcard center"><p class="prompt">${esc(def[1])}</p><div class="row center"><button class="btn sm ghost" id="sayl">🗣️ Say it</button><button class="btn sm ghost" id="redo">↺ Start again</button>${guide ? '<button class="btn sm ghost" id="noguide">🙈 Try without the grey letter</button>' : '<button class="btn sm ghost" id="withguide">👀 Show the grey letter</button>'}</div>
        <div id="pad"></div><div id="tfb" aria-live="polite" class="small"></div></div>
        <div class="qnav"><a class="btn ghost" href="#/write">Stop</a><button class="btn primary big" id="next" hidden>${i === letters.length - 1 ? 'Finished' : 'Next letter ›'}</button></div>`, { back: '#/write', cls: 'focus' });
      $('#sayl').onclick = () => say(`${l}. ${def[1]}`); $('#redo').onclick = () => draw(guide);
      const ng = $('#noguide'); if (ng) ng.onclick = () => draw(false); const wg = $('#withguide'); if (wg) wg.onclick = () => draw(true);
      if (p.band === 'little') sayIfOn(def[1]);
      T.mount($('#pad'), l, { guide, onStroke: (n, of, ok, why) => {
        if (ok) { $('#tfb').textContent = n < of ? `Lovely! Now stroke ${n + 1} of ${of}.` : ''; return; }
        tries++; $('#tfb').textContent = why === 'start' ? 'Start at the green dot.' : 'Nearly! Follow the grey line, starting at the green dot.';
      }, onDone: () => {
        $('#tfb').innerHTML = '<b>🎉 Beautiful!</b>'; sayIfOn('Beautiful!');
        saved(store.upsertAttempt({ id: FMG.uid('a'), profileId: p.id, c: `h:${l}`, qt: 'trace', ok: true, mode: guide ? 'trace' : 'write', day: FMG.today(), at: Date.now(), tries }));
        tries = 0; const nx = $('#next'); nx.hidden = false; nx.onclick = () => { i++; if (i >= letters.length) location.hash = '#/write'; else draw(true); };
      } });
    };
    draw(true);
  });

  /* ---------- Flashcards ---------- */
  function cardsHome() {
    shell(`<div class="center hero"><h1>${tiny() ? '👶 ' : ''}Flashcards</h1><p class="muted">Tap a set. Tap a card to hear its word.</p></div>
      <div class="tiles cards">${P.CARDS.map((c) => `<a class="tile" href="#/cards/${c.id}"><span>${c.e}</span><b>${esc(c.name)}</b><small>${c.cards.length} cards</small></a>`).join('')}</div>
      <h2 class="h2 center">Games</h2><div class="tiles cards">${P.CARDS.map((c) => `<a class="tile game" href="#/find/${c.id}"><span>🔎</span><b>Find the ${esc(c.name.toLowerCase())}</b></a>`).join('')}</div>`, tiny() ? {} : { back: '#/home', backText: 'Home' });
  }
  route(/^#\/cards$/, cardsHome);
  route(/^#\/cards\/(\w+)$/, (cid) => {
    const set = P.CARDS.find((c) => c.id === cid); if (!set) { location.hash = '#/cards'; return; }
    let i = 0;
    const draw = () => {
      const [w, e] = set.cards[i];
      shell(`<div class="flash" id="card" role="button" tabindex="0" aria-label="${esc(w)}"><div class="fpic">${e}</div><div class="fword">${esc(w)}</div></div>
        <div class="row center flnav"><button class="btn big ghost" id="prev" ${i ? '' : 'disabled'}>‹</button><span class="muted">${i + 1} / ${set.cards.length}</span><button class="btn big primary" id="nx">${i < set.cards.length - 1 ? '›' : '↺'}</button></div>`, { back: '#/cards', backText: 'Sets', cls: 'focus' });
      $('#card').onclick = () => { say(w); $('#card').classList.remove('pop'); void $('#card').offsetWidth; $('#card').classList.add('pop'); };
      $('#prev').onclick = () => { i--; draw(); }; $('#nx').onclick = () => { i = (i + 1) % set.cards.length; draw(); };
      setTimeout(() => say(w), 200);
    };
    let sx = null; const ts = (e) => { sx = e.touches[0].clientX; }, te = (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) { const b = dx < 0 ? $('#nx') : $('#prev'); if (b && !b.disabled) b.click(); } };
    document.addEventListener('touchstart', ts); document.addEventListener('touchend', te);
    cleanup = () => { document.removeEventListener('touchstart', ts); document.removeEventListener('touchend', te); };
    draw();
  });
  route(/^#\/find\/(\w+)$/, (cid) => {
    const set = P.CARDS.find((c) => c.id === cid); if (!set) { location.hash = '#/cards'; return; }
    const rng = FMG.rng(FMG.newSeed()), n = tiny() ? 2 : 4; let score = 0, turns = 0;
    const draw = () => {
      const pick = rng.shuffle(set.cards).slice(0, n), target = rng.pick(pick);
      shell(`<div class="center"><h1 class="findq">Where is the <b>${esc(target[0])}</b>?</h1><button class="btn sm ghost" id="again">🔊 Say it again</button></div>
        <div class="findgrid n${n}">${pick.map((c, k) => `<button class="findc" data-k="${k}" aria-label="${esc(c[0])}">${c[1]}</button>`).join('')}</div>
        <p class="center muted">${score} ⭐</p>`, { back: '#/cards', backText: 'Sets', cls: 'focus' });
      const ask = () => say(`Where is the ${target[0]}?`); ask(); $('#again').onclick = ask;
      $$('[data-k]').forEach((b) => (b.onclick = () => {
        const c = pick[+b.dataset.k];
        if (c === target) { score++; turns++; b.classList.add('right'); say(rng1(['Yes! The ' + c[0] + '!', 'Well done! ' + c[0] + '!', 'Clever! That is the ' + c[0] + '.'])); setTimeout(draw, 1800); }
        else { b.classList.add('nope'); say(`That is the ${c[0]}. Where is the ${target[0]}?`); setTimeout(() => b.classList.remove('nope'), 700); }
      }));
    };
    draw();
  });

  /* ---------- Grown-ups ---------- */
  route(/^#\/parent$/, () => {
    const ps = store.get().profiles, all = Object.keys(P.G);
    shell(`<h1>👪 Grown-ups</h1>
      <section class="stage"><h2>Learners</h2>${ps.map((p) => `<div class="prow"><span class="av" style="background:${p.colour}">${esc(p.nickname[0])}</span><input value="${esc(p.nickname)}" data-name="${p.id}" aria-label="Name"><select data-band="${p.id}">${Object.entries(BANDS).map(([k, v]) => `<option value="${k}" ${p.band === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select><label class="small"><input type="checkbox" data-speech="${p.id}" ${p.prefs.speech !== false ? 'checked' : ''}> Read aloud</label></div>`).join('')}
        <div class="row"><button class="btn primary" id="savep">Save</button><button class="btn ghost" id="addp">Add a learner</button></div></section>
      <section class="stage"><h2>Voice</h2><p class="small">Words and sentences are read by: <b>${esc(V.kind())}</b>. On iPad, a much more natural voice is in Settings › Accessibility › Spoken Content › Voices › English: download an “Enhanced” or “Premium” voice.</p></section>
      <section class="stage"><h2>Record the pure sounds (${SND.count()}/${all.length})</h2>
        <p class="small">Phonics uses <b>pure sounds</b> (“mmm”, not “muh”). Computer voices cannot say them properly, so record each one in your own voice: tap ● and say the sound (it records for 1.6 seconds). Recordings stay on this device. ${SND.canRecord() ? '' : '<b>This browser cannot record sound.</b>'}</p>
        <div class="recs">${all.map((g) => `<div class="rec"><b>${esc(E.show(g))}</b><small>${esc(P.G[g][2])} · ${esc(P.G[g][0])}</small><span>${SND.has(g) ? `<button class="btn sm ghost" data-play="${esc(g)}">▶</button><button class="btn sm ghost" data-del="${esc(g)}">🗑</button>` : ''}<button class="btn sm rec-b" data-rec="${esc(g)}" ${SND.canRecord() ? '' : 'disabled'}>●</button></span></div>`).join('')}</div></section>
      <section class="stage"><h2>Progress backup</h2><div class="row"><button class="btn ghost" id="exp">Save a backup file</button></div></section>
      <p class="small muted">${esc(E.VERSION)} · Phonics order follows Little Wandle Letters and Sounds Revised; check your school’s own chart.</p>`, { back: profile() ? '#/home' : '#/', backText: 'Back' });
    $('#savep').onclick = () => { saved(store.commit((d) => d.profiles.forEach((p) => { const n = $(`[data-name="${p.id}"]`); if (n && n.value.trim()) p.nickname = n.value.trim().slice(0, 24); const b = $(`[data-band="${p.id}"]`); if (b) p.band = b.value; const s = $(`[data-speech="${p.id}"]`); if (s) p.prefs.speech = s.checked; }))); render(); };
    $('#addp').onclick = () => { saved(store.commit((d) => d.profiles.push({ id: FMG.uid('p'), nickname: 'New learner', band: 'little', colour: COLOURS[d.profiles.length % COLOURS.length], prefs: { speech: true }, createdAt: Date.now() }))); render(); };
    $$('[data-play]').forEach((b) => (b.onclick = () => SND.play(b.dataset.play)));
    $$('[data-del]').forEach((b) => (b.onclick = async () => { await SND.del(b.dataset.del); render(); }));
    $$('[data-rec]').forEach((b) => (b.onclick = async () => { try { b.textContent = '🎙️'; b.disabled = true; const blob = await SND.record(1600); await SND.put(b.dataset.rec, blob); render(); } catch (e) { b.textContent = '●'; b.disabled = false; alert('Could not record: please allow the microphone.'); } }));
    $('#exp').onclick = () => { const blob = new Blob([JSON.stringify(store.exportBackup(), null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `family-english-backup-${FMG.today()}.json`; a.click(); };
  });

  FMG.app = { store, profile, render };
  SND.load().then(render);
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<a href="../" class="fam-home" aria-label="Back to Family Learning apps">⌂ Apps</a>
<style>.fam-home{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;padding:.5rem .8rem;border-radius:999px;
background:rgba(20,20,40,.82);color:#fff;font:600 14px/1 -apple-system,system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
@media print{.fam-home{display:none}}</style>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(function(){});</script>
</body>
