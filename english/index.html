/* Family Maths — clean, calm, touch-friendly. Light & dark. 44px targets. */
.exam-modes { display: flex; gap: .5rem; flex-wrap: wrap; margin: -.2rem 0 .8rem; }
:root {
  --bg: #f6f6fa; --surface: #ffffff; --surface-2: #f0f0f6; --ink: #15152a; --muted: #6b6b84; --line: #e4e4ee;
  --primary: #5847eb; --primary-2: #4a39dc; --on-primary: #fff; --primary-soft: #efedff;
  --good: #0e9a66; --good-bg: #e5f6ee; --warn: #b97800; --warn-bg: #fff4dc; --bad: #d23f3f; --bad-bg: #fdeaea; --info-bg: #edf2ff;
  --c1: #5847eb; --c2: #ff8a5b; --c2-line: #c4532a;
  --t-number: #5847eb; --t-fdp: #0f9d76; --t-shape: #e0702f; --t-algebra: #2e7ce0; --t-data: #c63f8f;
  --radius: 20px; --radius-sm: 12px; --border: 1px solid var(--line);
  --shadow: 0 1px 2px rgba(21, 21, 42, .04), 0 4px 16px -6px rgba(21, 21, 42, .08);
  --shadow-lg: 0 2px 4px rgba(21, 21, 42, .04), 0 16px 36px -14px rgba(21, 21, 42, .18);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", "Nunito", var(--font);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e18; --surface: #161726; --surface-2: #1e1f31; --ink: #f0f0f8; --muted: #9c9bb8; --line: #2a2b40;
    --primary: #8f84ff; --primary-2: #7f73ff; --on-primary: #0f0e1d; --primary-soft: #23214a;
    --good: #3fd39a; --good-bg: #12332a; --warn: #ffc24a; --warn-bg: #33290f; --bad: #ff7b7b; --bad-bg: #3a1a1e; --info-bg: #1c2443;
    --c1: #8f84ff; --c2: #ff9c73; --c2-line: #ffd2bf;
    --t-number: #8f84ff; --t-fdp: #3fd3a6; --t-shape: #ff9c63; --t-algebra: #6aa8ff; --t-data: #ff7ec4;
    --shadow: 0 1px 0 rgba(255, 255, 255, .02) inset, 0 6px 20px -12px rgba(0, 0, 0, .7);
    --shadow-lg: 0 18px 40px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0d0e18; --surface: #161726; --surface-2: #1e1f31; --ink: #f0f0f8; --muted: #9c9bb8; --line: #2a2b40;
    --primary: #8f84ff; --primary-2: #7f73ff; --on-primary: #0f0e1d; --primary-soft: #23214a;
    --good: #3fd39a; --good-bg: #12332a; --warn: #ffc24a; --warn-bg: #33290f; --bad: #ff7b7b; --bad-bg: #3a1a1e; --info-bg: #1c2443;
    --c1: #8f84ff; --c2: #ff9c73; --c2-line: #ffd2bf;
    --t-number: #8f84ff; --t-fdp: #3fd3a6; --t-shape: #ff9c63; --t-algebra: #6aa8ff; --t-data: #ff7ec4;
    --shadow: 0 1px 0 rgba(255, 255, 255, .02) inset, 0 6px 20px -12px rgba(0, 0, 0, .7);

  }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; }
a { color: var(--primary); text-decoration: none; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -.015em; margin: 0 0 .4em; font-family: var(--font-round); }
h1 { font-size: clamp(1.6rem, 3.2vw, 2.2rem); font-weight: 750; }
.h2 { font-size: 1.15rem; font-weight: 700; margin: 1.2em 0 .6em; }
.h3, h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0 0 .6em; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.center { text-align: center; }
.left { text-align: left; }
.pad { padding: 1rem 0; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 10px; }
.skip { position: absolute; left: -999px; top: 0; background: var(--surface); padding: .6rem 1rem; z-index: 99; }
.skip:focus { left: 1rem; }
.ic { width: 22px; height: 22px; flex: none; }
button { font: inherit; color: inherit; }

/* ---------- Top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: .75rem; padding: .6rem max(1rem, env(safe-area-inset-left)); height: 64px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.brand { display: flex; align-items: center; gap: .55rem; color: var(--ink); font-weight: 750; font-family: var(--font-round); font-size: 1.05rem; }
.logo { width: 30px; height: 30px; }
.logo rect { fill: var(--primary); }
.logo path { stroke: var(--on-primary); stroke-width: 3; stroke-linecap: round; fill: none; }
.topbar-title { flex: 1; text-align: center; font-weight: 650; color: var(--muted); font-size: .95rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.topbar-right { display: flex; align-items: center; gap: .4rem; }
.iconbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); }
.who { display: flex; align-items: center; gap: .5rem; padding: 4px 12px 4px 4px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); font-weight: 600; min-height: 44px; }
.av { --av: var(--primary); display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--av); color: #fff; font-weight: 750; font-family: var(--font-round); flex: none; }
.av.xl { width: 84px; height: 84px; font-size: 2.2rem; border-radius: 28px; }
.av.add { background: var(--surface-2); color: var(--muted); }
@media (max-width: 560px) { .who-name, .brand span { display: none; } }

.savebar { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); opacity: 0; transition: .25s; z-index: 40; padding: .5rem 1rem; border-radius: 99px; font-size: .86rem; font-weight: 600; pointer-events: none; }
.savebar.show { opacity: 1; transform: translate(-50%, 0); }
.savebar.ok { background: var(--ink); color: var(--bg); }
.savebar.err { background: var(--bad); color: #fff; pointer-events: auto; }

/* ---------- Page ---------- */
.page { max-width: 1120px; margin: 0 auto; padding: 1.4rem max(1rem, env(safe-area-inset-left)) 4rem; }
.page.narrow { max-width: 760px; }
.page.focus { max-width: 860px; }
.page.wide { max-width: 1240px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 1.2rem 1.3rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
.card.soft { background: var(--surface-2); box-shadow: none; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin: .8rem 0; }
.row.center { justify-content: center; }
.note { background: var(--warn-bg); color: var(--ink); border-radius: var(--radius-sm); padding: .7rem 1rem; margin-top: .8rem; font-size: .93rem; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 46px; padding: .6rem 1.15rem; border-radius: 14px; border: 0; cursor: pointer; font-weight: 650; text-decoration: none; transition: transform .12s, background .2s, box-shadow .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--primary) 70%, transparent); }
.btn.primary:hover { background: var(--primary-2); }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1.5px var(--primary); }
.btn.ghost.due { box-shadow: inset 0 0 0 2px var(--warn); }
.btn.sm { min-height: 44px; padding: .4rem .9rem; font-size: .92rem; }
.btn.big { min-height: 56px; padding: .8rem 1.8rem; font-size: 1.08rem; }
.btn.danger { color: var(--bad); }
.btn.round { width: 76px; height: 76px; border-radius: 50%; padding: 0; font-size: 2rem; }
.btn.good { background: var(--good); color: #fff; box-shadow: 0 10px 22px -8px color-mix(in srgb, var(--good) 80%, transparent); }
.btn[disabled] { opacity: .4; cursor: default; }
.linkbtn { background: none; border: 0; color: var(--primary); font-weight: 650; cursor: pointer; padding: .2rem; min-height: 32px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Profiles ---------- */
.hero { padding: 2.5rem 0 1.5rem; }
.hero-mark .logo { width: 56px; height: 56px; margin-bottom: .6rem; }
.profiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1rem; }
.profile-card { display: flex; flex-direction: column; align-items: center; gap: .4rem; padding: 1.6rem 1rem 1.3rem; background: var(--surface); border-radius: 24px; border: 0; box-shadow: var(--shadow); cursor: pointer; transition: transform .18s, box-shadow .18s; color: var(--ink); }
.profile-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.pc-name { font-weight: 750; font-size: 1.2rem; font-family: var(--font-round); margin-top: .4rem; }
.pc-sub { color: var(--muted); font-size: .88rem; }
.profile-card.add { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }

/* ---------- Home ---------- */
.hello { margin: .6rem 0 1rem; }
.cta-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1.4rem; }
.cta-card { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.3rem; border-radius: var(--radius); color: var(--on-primary);
  background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 60%, #ff7aa8)); box-shadow: var(--shadow-lg); transition: transform .18s; }
.cta-card:hover { transform: translateY(-2px); }
.cta-card.review { background: linear-gradient(135deg, #f0a020, #ef6b4a); color: #fff; }
.cta-card .muted { color: inherit; opacity: .85; }
.eyebrow { font-size: .76rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; opacity: .85; }
.cta-title { font-weight: 750; font-size: 1.2rem; font-family: var(--font-round); }
.cta-go { font-size: 1.6rem; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 255, 255, .2); flex: none; }
.skill-head .eyebrow { color: var(--primary); }

.dir-tools { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; margin-bottom: .7rem; }
.seg { display: inline-flex; background: var(--surface-2); padding: 4px; border-radius: 14px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: .5rem 1rem; border-radius: 11px; font-weight: 650; color: var(--muted); cursor: pointer; min-height: 40px; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.search { flex: 1; min-width: 220px; display: flex; align-items: center; gap: .5rem; background: var(--surface); border-radius: 14px; padding: 0 .9rem; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--muted); }
.search:focus-within { box-shadow: inset 0 0 0 2px var(--primary); }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-height: 46px; font: inherit; color: var(--ink); }
.chips { display: flex; gap: .45rem; overflow-x: auto; padding: .2rem 0 .8rem; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); border-radius: 99px; padding: .4rem .95rem; font-size: .88rem; font-weight: 600; color: var(--muted); cursor: pointer; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.chips.static { flex-wrap: wrap; overflow: visible; padding: .4rem 0 0; }
.chips.static .chip { cursor: default; min-height: 30px; padding: .2rem .7rem; font-size: .8rem; }
.group-h { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 1.6rem 0 .7rem; font-family: var(--font); font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1rem; }
.topic-card { --tint: var(--t-number); position: relative; display: flex; flex-direction: column; gap: .35rem; padding: 1.1rem 1.15rem 1rem; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); color: var(--ink); transition: transform .18s, box-shadow .18s; min-height: 190px; }
.topic-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.topic-card.is-planned { opacity: .86; }
.tc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .3rem; }
.tc-icon { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; color: var(--tint); background: color-mix(in srgb, var(--tint) 13%, var(--surface)); }
.tc-icon.lg { width: 64px; height: 64px; border-radius: 20px; }
.tc-icon.lg .ic { width: 32px; height: 32px; }
.tc-name { font-weight: 720; font-size: 1.06rem; font-family: var(--font-round); line-height: 1.25; }
.tc-desc { color: var(--muted); font-size: .88rem; line-height: 1.4; }
.tc-range { margin-top: auto; }
.tc-prog { display: flex; flex-direction: column; gap: .3rem; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--tint); border-radius: 99px; }
.empty { padding: 2rem; text-align: center; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .74rem; font-weight: 700; padding: .22rem .6rem; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.live { background: var(--good-bg); color: var(--good); }
.pill.planned { background: var(--surface-2); color: var(--muted); }
.pill.later { background: var(--warn-bg); color: var(--warn); }
.pill.tier { background: var(--info-bg); color: var(--t-algebra); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.subtle { font-weight: 500; }
.pill.status-learning { background: var(--info-bg); color: var(--t-algebra); }
.pill.status-practising { background: var(--warn-bg); color: var(--warn); }
.pill.status-secure { background: var(--good-bg); color: var(--good); }
.pill.status-retained { background: var(--good); color: #fff; }
.pill.o-independent { background: var(--good-bg); color: var(--good); }
.pill.o-supported { background: var(--info-bg); color: var(--t-algebra); }
.pill.o-incorrect { background: var(--bad-bg); color: var(--bad); }

/* ---------- Topic ---------- */
.topic-head { --tint: var(--t-number); display: flex; gap: 1.1rem; align-items: flex-start; margin: .6rem 0 1rem; }
.two-col { display: grid; grid-template-columns: 1fr 320px; gap: 1.4rem; align-items: start; }
@media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } }
.skill-list { display: flex; flex-direction: column; gap: .6rem; }
.skill-row { display: flex; align-items: center; gap: 1rem; padding: .95rem 1.1rem; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); color: var(--ink); min-height: 64px; transition: transform .15s; }
a.skill-row:hover { transform: translateX(3px); }
.skill-row.is-planned { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.skill-row.is-planned .sk-name { color: var(--muted); }
.sk-main { flex: 1; min-width: 0; }
.sk-name { font-weight: 650; }
.sk-badges { display: flex; gap: .3rem; flex-wrap: wrap; justify-content: flex-end; }
.chev { font-size: 1.6rem; color: var(--muted); }

/* ---------- Skill ---------- */
.objective { font-size: 1.08rem; color: var(--muted); max-width: 60ch; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; background: var(--surface-2); padding: 5px; border-radius: 16px; margin: 1.2rem 0; max-width: 560px; }
.lvl { border: 0; background: transparent; border-radius: 12px; padding: .5rem .4rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; min-height: 52px; }
.lvl[aria-checked="true"] { background: var(--surface); box-shadow: var(--shadow); }
.lvl-name { font-weight: 700; }
.lvl-st { color: var(--muted); }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 640px) { .modes { grid-template-columns: 1fr; } }
.mode-card { display: flex; flex-direction: column; gap: .2rem; padding: 1.3rem 1.3rem 1.2rem; border-radius: 22px; color: #fff; min-height: 150px; box-shadow: var(--shadow-lg); transition: transform .18s; position: relative; overflow: hidden; }
.mode-card::after { content: ""; position: absolute; right: -30px; bottom: -40px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255, 255, 255, .12); }
.mode-card:hover { transform: translateY(-3px); }
.mode-card.learn { background: linear-gradient(140deg, #5b4cf0, #8b5cf6); }
.mode-card.practice { background: linear-gradient(140deg, #0f9d76, #2bc48f); }
.mode-card.endless { background: linear-gradient(140deg, #e8743b, #f2a541); }
.mode-ic { width: 44px; height: 44px; border-radius: 14px; background: rgba(255, 255, 255, .2); display: grid; place-items: center; margin-bottom: auto; }
.mode-ic .ic { width: 26px; height: 26px; }
.mode-name { font-size: 1.35rem; font-weight: 780; font-family: var(--font-round); margin-top: .8rem; }
.mode-sub { opacity: .9; font-size: .92rem; }
.support-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0 1.4rem; }
.progress-card .pc-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.meter { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin: .6rem 0 .8rem; }
.meter span { height: 10px; border-radius: 4px; background: var(--surface-2); }
.meter span.tried { background: color-mix(in srgb, var(--warn) 40%, var(--surface-2)); }
.meter span.on { background: var(--good); }
.ok-text { color: var(--good); font-weight: 600; }
.warn-text { color: var(--warn); font-weight: 600; }

/* ---------- Lesson & question ---------- */
.lesson, .qwrap { display: flex; flex-direction: column; gap: .9rem; }
.steps, .qprog { display: flex; gap: 6px; }
.steps span, .qprog span { flex: 1; height: 6px; border-radius: 99px; background: var(--line); transition: background .3s; }
.steps span.done, .qprog span.done { background: color-mix(in srgb, var(--primary) 45%, var(--line)); }
.qprog span.good { background: var(--good); }
.steps span.cur, .qprog span.cur { background: var(--primary); }
.phase { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 750; color: var(--primary); }
.lesson-text { font-size: clamp(1.3rem, 2.8vw, 1.8rem); font-weight: 650; font-family: var(--font); letter-spacing: -.01em; line-height: 1.4; }
.lesson .speak, .qcard .speak { align-self: flex-start; background: var(--surface); box-shadow: var(--shadow); color: var(--primary); }
.stage { display: flex; justify-content: center; align-items: center; min-height: 40px; }
.stage:empty { display: none; }
.lesson .stage, .qcard .stage { background: var(--surface); border-radius: var(--radius); padding: 1.1rem; box-shadow: var(--shadow); }
.lesson-nav { display: flex; gap: .6rem; justify-content: space-between; flex-wrap: wrap; margin-top: .4rem; }
.lesson-nav #next, .end-actions { margin-left: auto; }
.end-actions { display: flex; gap: .6rem; flex-wrap: wrap; }
.offscreen { margin-top: .8rem; font-size: 1rem; font-weight: 500; background: var(--surface-2); border-radius: 14px; padding: .7rem 1rem; }
.qtop { display: flex; align-items: center; gap: .8rem; }
.qtop .qprog { flex: 1; }
.qmode { font-weight: 700; font-size: .92rem; white-space: nowrap; }
.qcount { flex: 1; text-align: center; font-weight: 750; color: var(--muted); }
.qcard { background: var(--surface-2); border-radius: 26px; padding: clamp(1rem, 3vw, 1.8rem); display: flex; flex-direction: column; gap: 1rem; }
.prompt { font-size: clamp(1.15rem, 2.4vw, 1.45rem); font-weight: 600; line-height: 1.5; }
.prompt.big { font-size: clamp(1.6rem, 4vw, 2.2rem); font-family: var(--font-round); text-align: center; }
.part-label { margin-top: .8rem; font-size: 1.05rem; }
.req { font-size: .95rem; color: var(--warn); font-weight: 650; margin-top: .4rem; }
.gcse-tags { display: flex; gap: .4rem; flex-wrap: wrap; }
.offer { background: var(--info-bg); border-radius: 14px; padding: .6rem 1rem; font-size: .95rem; }
.eq { font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-size: 1.12em; white-space: nowrap; letter-spacing: .01em; }
.eq.big { font-size: 1.6em; font-family: var(--font-round); font-weight: 750; }
.frac { display: inline-flex; align-items: center; vertical-align: middle; font-family: inherit; }
.fr { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; font-size: .86em; margin: 0 .12em; }
.fr > span:first-child { border-bottom: 2px solid currentColor; padding: 0 .2em .06em; }
.fr > span:last-child { padding: .06em .2em 0; }
.box { display: inline-block; min-width: 1.6em; padding: 0 .3em; border: 2px dashed var(--primary); border-radius: 8px; text-align: center; color: var(--primary); }

/* Answer input & keypad */
.answer { display: flex; flex-direction: column; gap: .6rem; }
.ans-row { display: flex; gap: .6rem; }
.ans-input { flex: 1; min-width: 0; min-height: 56px; font-size: 1.35rem; padding: 0 1rem; border-radius: 16px; border: 0; background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); font-family: var(--font); }
.ans-input:focus { outline: 0; box-shadow: inset 0 0 0 2.5px var(--primary); }
.narrow-box { max-width: 420px; margin: 3rem auto; }
.narrow-box .ans-row { margin: 1rem 0; }
.preview { min-height: 1.4em; color: var(--muted); font-size: 1rem; }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 380px; }
.key { min-height: 48px; border: 0; border-radius: 12px; background: var(--surface); box-shadow: 0 1px 0 var(--line); font-size: 1.1rem; font-weight: 600; cursor: pointer; }
.key:active { transform: scale(.95); background: var(--line); }
@media (hover: hover) and (pointer: fine) { .keypad { display: none; } }

.choices { display: grid; gap: .6rem; }
.choice { text-align: left; border: 0; background: var(--surface); padding: .95rem 1.1rem; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--line); cursor: pointer; font-size: 1.02rem; font-weight: 550; min-height: 56px; transition: box-shadow .15s, transform .12s; }
.choice:hover { box-shadow: inset 0 0 0 2px var(--primary); }
.choice.right { box-shadow: inset 0 0 0 3px var(--good); background: var(--good-bg); }
.choice.wrong { box-shadow: inset 0 0 0 3px var(--bad); background: var(--bad-bg); }
.choices.thumbs { grid-template-columns: 1fr 1fr; max-width: 360px; margin: 0 auto; width: 100%; }
.choices.thumbs .choice { font-size: 3rem; text-align: center; min-height: 110px; border-radius: 26px; }

.fb { border-radius: 14px; padding: .75rem 1rem; font-weight: 600; animation: pop .25s ease; }
.fb.good { background: var(--good-bg); color: var(--good); }
.fb.try { background: var(--warn-bg); color: var(--ink); }
.fb.info { background: var(--info-bg); color: var(--ink); }
.help-row { display: flex; flex-direction: column; gap: .5rem; }
.help-btns { display: flex; gap: .5rem; flex-wrap: wrap; }
.hint { background: var(--surface); border-radius: 14px; padding: .7rem 1rem; box-shadow: var(--shadow); }
.solution { background: var(--surface); border-radius: 16px; padding: 1rem 1rem 1rem 2.4rem; margin: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .4rem; }
.next-row { display: flex; justify-content: flex-end; }
.tap-actions { display: flex; justify-content: center; }

/* ---------- Visuals ---------- */
.viz { width: 100%; max-width: 640px; height: auto; display: block; }
.viz text { fill: var(--ink); font-family: var(--font); font-size: 16px; }
.viz .small { font-size: 13px; fill: var(--muted); }
.sfrac text { font-size: 17px; font-weight: 700; }
.sfrac line { stroke: var(--ink); stroke-width: 2; }
.sfrac.hl text { fill: var(--primary); }
.sfrac.hl line { stroke: var(--primary); }
.eqlab { font-size: 20px !important; font-weight: 700; }
.piece-off { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
.piece-on { stroke: var(--ink); stroke-width: 1.5; }
.pa-bg1 { fill: color-mix(in srgb, var(--c1) 70%, var(--surface)); }
.pa-dot { fill: var(--surface); opacity: .55; }
.pa-bg2 { fill: color-mix(in srgb, var(--c2) 80%, var(--surface)); }
.pa-line { stroke: var(--c2-line); stroke-width: 2.4; opacity: .55; }
.fine { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; opacity: .55; }
.bar-outline { fill: none; stroke: var(--ink); stroke-width: 2.4; rx: 4; }
.axis { stroke: var(--ink); stroke-width: 2.5; }
.tick { stroke: var(--muted); stroke-width: 1.5; }
.tick-major { stroke: var(--ink); stroke-width: 2.5; }
.num-lab { font-size: 18px !important; font-weight: 700; }
.jump { fill: none; stroke: var(--c1); stroke-width: 3; }
.jump.j1 { stroke: var(--c2-line); stroke-dasharray: 8 5; }
.jump.unknown { stroke: var(--muted); stroke-dasharray: 4 5; }
.arrowhead { fill: var(--ink); }
.qmark { font-size: 22px !important; font-weight: 800; fill: var(--primary) !important; }
.dot-land { fill: var(--primary); }
.dot-target { fill: var(--good); }
.bag { fill: color-mix(in srgb, var(--c1) 20%, var(--surface)); stroke: var(--c1); stroke-width: 2; }
.bag-lab { font-weight: 800; font-style: italic; fill: var(--c1) !important; font-family: "Cambria Math", serif !important; font-size: 18px !important; }
.bagrow.hl .bag { fill: var(--c1); }
.bagrow.hl .bag-lab { fill: var(--surface) !important; }
.cube { fill: var(--c2); stroke: var(--c2-line); stroke-width: 1.2; transition: opacity .4s; }
.cube.gone { fill: transparent; stroke: var(--muted); stroke-dasharray: 2 2; opacity: .7; }
.cube.hl { fill: var(--good); stroke: var(--good); }
.row-mark { stroke: var(--muted); stroke-width: 2; }
.pan { fill: var(--surface-2); stroke: var(--ink); stroke-width: 2; }
.beam { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
.beam.thin { stroke-width: 2.5; }
.fulcrum { fill: var(--ink); }
.eq-sign { font-size: 34px !important; font-weight: 800; fill: var(--muted) !important; }
.op { font-weight: 800; font-size: 18px !important; fill: var(--primary) !important; }
.shape { fill: color-mix(in srgb, var(--c1) 10%, var(--surface)); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.dim { font-weight: 700; font-family: "Cambria Math", serif !important; font-size: 18px !important; }

/* five-frame */
.frame { display: grid; grid-template-columns: repeat(5, minmax(56px, 92px)); gap: 0; border: 4px solid var(--ink); border-radius: 14px; overflow: hidden; background: var(--surface); }
.frame .cell { aspect-ratio: 1; display: grid; place-items: center; border: 0; border-right: 3px solid var(--ink); background: transparent; padding: 10%; }
.frame .cell:last-child { border-right: 0; }
.frame button.cell { cursor: pointer; }
.frame button.cell.empty:hover { background: var(--surface-2); }
.frame button.cell.empty::after { content: ""; width: 34%; height: 34%; border-radius: 50%; border: 2.5px dashed var(--line); }
.hl-empty .cell.empty { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); }
.frame.toyline { border: 0; gap: 10px; background: transparent; overflow: visible; }
.frame.toyline .cell { border: 2.5px dashed var(--line); border-radius: 18px; background: var(--surface); }
.frame.toyline .cell.have, .frame.toyline .cell.added { border-style: solid; border-color: transparent; }
.ctr { width: 100%; height: 100%; }
.ctr-have circle { fill: var(--c1); }
.ctr-added circle { fill: var(--c2); stroke: var(--c2-line); stroke-width: 2; }
.ctr-stripe { stroke: var(--c2-line); stroke-width: 2.5; opacity: .6; }
.cell.added .ctr, .cell.added .toy { animation: drop .28s cubic-bezier(.3, 1.6, .5, 1); }
.toy { width: 100%; height: 100%; fill: var(--c1); }
.toy .wheel { fill: var(--ink); }
.toy .stem { stroke: var(--good); stroke-width: 3; fill: none; }
.toy .beak { fill: var(--warn); }
.toy.toy-added { fill: var(--c2); }
.two-groups { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; justify-content: center; }
.grp { display: flex; gap: 6px; padding: 10px; border-radius: 18px; background: var(--surface-2); }
.grp .ctr { width: 56px; height: 56px; }
.grp.red .ctr-have circle { fill: #e2483d; }
.grp.yellow .ctr-added circle { fill: #f6c443; stroke: #b98700; }
.grp-plus { font-weight: 700; color: var(--muted); font-size: 1.2rem; }
.scatter-wrap { display: flex; align-items: center; gap: 1.2rem; }
.scatter { max-width: 260px; }
.scatter-ctrl { display: flex; flex-direction: column; gap: .6rem; }
.round-btn { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); font-size: 2rem; font-weight: 700; cursor: pointer; }
.round-btn.plus { background: var(--c2); color: #fff; }

/* ---------- Summary ---------- */
.summary { padding-top: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: .8rem; }
.summary .card { width: 100%; }
.sum-badge { font-size: 3rem; width: 96px; height: 96px; border-radius: 32px; display: grid; place-items: center; background: var(--good-bg); color: var(--good); font-weight: 800; animation: pop .4s ease; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; width: 100%; margin: .6rem 0; }
.stat { background: var(--surface); border-radius: 18px; padding: 1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.stat b { font-size: 2rem; font-family: var(--font-round); }
.stat span { color: var(--muted); font-size: .88rem; }

/* ---------- Parent ---------- */
.parent-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: .6rem; }
.tabs { display: flex; gap: .3rem; border-bottom: 1.5px solid var(--line); margin-bottom: 1.2rem; overflow-x: auto; }
.tabs a { padding: .7rem 1rem; color: var(--muted); font-weight: 650; border-bottom: 2.5px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
.tabs a.on { color: var(--ink); border-color: var(--primary); }
.pgrid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1rem; }
@media (max-width: 820px) { .pgrid { grid-template-columns: 1fr; } }
.actions { padding-left: 1.2rem; margin: 0; display: flex; flex-direction: column; gap: .6rem; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: .5rem .6rem; border-bottom: 1.5px solid var(--line); }
td { padding: .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.heatmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.heat { border-radius: 12px; padding: .5rem .6rem; min-height: 64px; display: flex; flex-direction: column; background: var(--surface-2); }
.heat span { font-weight: 800; font-size: .8rem; color: var(--muted); }
.heat small { font-size: .74rem; line-height: 1.2; }
.heat.na { opacity: .5; background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 6px, transparent 6px, transparent 10px); }
.heat.h1 { background: var(--info-bg); }
.heat.h2 { background: var(--warn-bg); }
.heat.h3 { background: var(--good-bg); }
.heat.h4 { background: var(--good); color: #fff; }
.heat.h4 span { color: #fff; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 120px; align-items: end; }
.wd { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; font-size: .78rem; color: var(--muted); }
.wbar { width: 100%; max-width: 30px; background: var(--primary); border-radius: 6px 6px 3px 3px; min-height: 3px; }
.learner { display: flex; flex-wrap: wrap; gap: .8rem 1rem; align-items: end; padding: 1rem 0; border-bottom: 1px solid var(--line); }
.learner label { display: flex; flex-direction: column; font-size: .8rem; color: var(--muted); font-weight: 600; gap: .25rem; }
.learner label.tog { flex-direction: row; align-items: center; color: var(--ink); font-size: .9rem; min-height: 44px; }
.learner input:not([type]), .learner select, .row input, .row select { min-height: 44px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1.5px var(--line); background: var(--surface); padding: 0 .8rem; font: inherit; color: var(--ink); }
.learner input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--primary); }

/* ---------- Overlay ---------- */
.overlay { position: fixed; inset: 0; background: rgba(18, 17, 32, .45); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 50; animation: fade .2s; }
.dialog { background: var(--surface); border-radius: 24px; padding: 1.6rem; width: min(92vw, 380px); box-shadow: var(--shadow-lg); text-align: center; }
.dialog .row { justify-content: center; }

/* ---------- Playful mode (early years) ---------- */
body.playful .prompt { text-align: center; }
body.playful .lesson-text { text-align: center; font-family: var(--font-round); font-size: clamp(1.6rem, 4vw, 2.3rem); }
body.playful .lesson .speak, body.playful .qcard .speak { align-self: center; width: 64px; height: 64px; border-radius: 22px; }
body.playful .lesson .speak .ic, body.playful .qcard .speak .ic { width: 32px; height: 32px; }
body.playful .tc-name { font-size: 1.2rem; }

/* ---------- Motion ---------- */
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes drop { from { transform: scale(.4) translateY(-18px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { animation: none !important; transition: none !important; }

@media (max-width: 560px) {
  .page { padding-top: 1rem; }
  .frame { grid-template-columns: repeat(5, minmax(48px, 1fr)); width: 100%; }
  .stats { grid-template-columns: repeat(3, 1fr); gap: .5rem; }
  .stat b { font-size: 1.5rem; }
  .btn.round { width: 68px; height: 68px; }
}

.bk { width: 100%; font: 12px/1.4 ui-monospace, Menlo, monospace; border-radius: 12px; border: 0; padding: .7rem; background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.primary.danger-fill { background: var(--bad); color: #fff; box-shadow: none; }
.dialog p { margin-bottom: 1rem; }

/* ---------- Skill library visuals ---------- */
.objrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; }
.objrow span, .objgrid span { width: 52px; height: 52px; display: grid; place-items: center; }
.objgrid { display: grid; grid-template-columns: repeat(6, 56px); grid-auto-rows: 56px; gap: 6px; justify-content: center; }
.objgrid.mixed { grid-template-columns: repeat(6, 52px); grid-auto-rows: 52px; }
.mx-r .ctr-have circle { fill: #e2483d; }
.mx-y .ctr-added circle { fill: #f6c443; stroke: #b98700; }
.frame.ten { grid-template-columns: repeat(5, minmax(44px, 70px)); }
.frame.ten .cell:nth-child(5) { border-right: 0; }
.frame.ten .cell:nth-child(-n+5) { border-bottom: 3px solid var(--ink); }
.arr-dot { fill: var(--c1); }
.viz.arr { max-width: 420px; }
.pencil { fill: color-mix(in srgb, var(--warn) 70%, var(--surface)); stroke: var(--ink); stroke-width: 2; }
.pencil-tip { fill: var(--surface-2); stroke: var(--ink); stroke-width: 2; }
.cube.big { fill: var(--c2); stroke: var(--c2-line); stroke-width: 2; }
.clockface { fill: var(--surface); stroke: var(--ink); stroke-width: 4; }
.clocknum { font-size: 20px !important; font-weight: 700; }
.hand { stroke: var(--ink); stroke-linecap: round; }
.hand.hour { stroke-width: 8; }
.hand.minute { stroke-width: 4.5; stroke: var(--c1); }
.viz.clock { max-width: 240px; }
.viz.poly { max-width: 240px; }
.vtx { fill: var(--ink); }
.dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
.small-dim { font-size: 20px !important; }
.zero { font-weight: 800; fill: var(--ink) !important; }
.rb1 { fill: color-mix(in srgb, var(--c1) 75%, var(--surface)); stroke: var(--ink); stroke-width: 1.5; }
.rb2 { fill: var(--c2); stroke: var(--c2-line); stroke-width: 1.5; }
.tb { fill: color-mix(in srgb, var(--c1) 70%, var(--surface)); }
.pattern { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 2.6rem; line-height: 1; }
.pt { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 16px; background: var(--surface-2); }
.pt-0 { color: #e2483d; } .pt-1 { color: var(--c1); } .pt-2 { color: var(--good); } .pt-3 { color: #f0a020; }
.pt.q { border: 3px dashed var(--primary); color: var(--primary); background: transparent; font-weight: 800; font-size: 2rem; }
.bagshape { fill: var(--surface-2); stroke: var(--ink); stroke-width: 3; }
.bag-r { fill: #e2483d; } .bag-b { fill: #2e7ce0; } .bag-g { fill: #11a06a; }
.barfill { stroke: var(--ink); stroke-width: 1.5; }
.barfill.b0 { fill: var(--c1); } .barfill.b1 { fill: var(--c2); } .barfill.b2 { fill: var(--good); } .barfill.b3 { fill: #f0a020; }
.vec { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; padding: 0 .35em; border-left: 2px solid currentColor; border-right: 2px solid currentColor; border-radius: 8px; line-height: 1.15; font-family: "Cambria Math", serif; }
table.ftab { margin: .6rem 0; width: auto; font-size: 1rem; }
table.ftab th, table.ftab td { border: 1.5px solid var(--line); padding: .35rem .7rem; text-align: center; }
.who-said { margin-top: .8rem; font-size: .98rem; font-weight: 500; background: var(--surface); border-radius: 12px; padding: .6rem .9rem; }
.ex-q { font-weight: 650; margin-bottom: .6rem; }
ol.worked { font-size: .82em; font-weight: 500; margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: .3rem; }
.pickpad { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto; width: 100%; }
.pick { min-height: 64px; border: 0; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); font-size: 1.7rem; font-weight: 800; font-family: var(--font-round); cursor: pointer; transition: transform .1s; }
.pick:hover { box-shadow: inset 0 0 0 2px var(--primary); }
.pick:active { transform: scale(.94); }
.pick.right { background: var(--good-bg); box-shadow: inset 0 0 0 3px var(--good); }
.pick.wrong { background: var(--bad-bg); box-shadow: inset 0 0 0 3px var(--bad); }

/* ---------- Levels: clear selection ---------- */
.lvl { transition: background .15s, color .15s, transform .15s; color: var(--ink); }
.lvl[aria-checked="true"] { background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--primary) 80%, transparent); }
.lvl[aria-checked="true"] .lvl-st { color: color-mix(in srgb, var(--on-primary) 80%, transparent); }
.lvl.pop { animation: pop .25s ease; }
@keyframes pop { 50% { transform: scale(1.05); } }
.lvl-desc { margin: -.6rem 0 1rem; color: var(--muted); max-width: 560px; }
.reduce-motion .lvl.pop { animation: none; }

/* ---------- Explanation panel ---------- */
.explain { margin-top: .8rem; background: var(--surface-2); border-radius: 18px; padding: .6rem .7rem 1rem; }
.ex-tabs { display: flex; gap: .35rem; overflow-x: auto; padding-bottom: .4rem; align-items: center; scrollbar-width: none; }
.ex-tabs::-webkit-scrollbar { display: none; }
.ex-tab { flex: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 650; font-size: .9rem; padding: .45rem .8rem; border-radius: 99px; cursor: pointer; min-height: 38px; }
.ex-tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.ex-say { margin-left: auto; flex: none; }
.ex-body { padding: .4rem .5rem 0; }
ol.worked.big { padding-left: 1.4rem; margin: .4rem 0; }
ol.worked.big li { margin: .45rem 0; font-size: 1.05rem; }
ol.worked.big li.new { animation: fadein .3s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
.ex-ctl { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .6rem; }
.ex-pic { background: var(--surface); border-radius: 14px; padding: .6rem; display: grid; place-items: center; overflow-x: auto; }
.ex-pic svg { max-width: 100%; height: auto; }
ul.mistakes { list-style: none; padding: 0; margin: .3rem 0; display: grid; gap: .5rem; }
ul.mistakes li { display: flex; gap: .7rem; align-items: baseline; background: var(--bad-bg); border-radius: 12px; padding: .55rem .8rem; }
.mis-val { font-weight: 750; color: var(--bad); white-space: nowrap; }
.key-idea { font-size: 1.15rem; background: var(--surface); border-radius: 14px; padding: .9rem 1rem; }

/* ---------- Exams ---------- */
.cta-card.exam { --tint: var(--primary); }
.exam-group { margin: 1.4rem 0; }
.exam-group.mine { background: color-mix(in srgb, var(--primary) 8%, transparent); border-radius: 20px; padding: .4rem 1rem 1rem; }
.paper-card { display: flex; flex-direction: column; gap: .3rem; background: var(--surface); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow); color: var(--ink); }
.paper-card:hover { transform: translateY(-2px); }
.pp-title { font-weight: 750; font-size: 1.05rem; }

/* =====================================================================
   Update 3: slick & clean layer (overrides the rules above).
   One focal task per screen, quiet surfaces with hairline borders,

   ===================================================================== */
body { font-size: 16px; letter-spacing: -.003em; }

.card.soft { border-color: transparent; }
a, button, .btn, .chip, .topic-card, .skill-row, .paper-card, .profile-card, .cta-card { transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease); }

/* Top bar: thinner, quieter */
.topbar { height: 60px; gap: .5rem; border-bottom: var(--border); background: color-mix(in srgb, var(--bg) 86%, transparent); }

/* Buttons */

.btn .ic { width: 18px; height: 18px; }

/* Profile picker */

.profile-card.add { border: 1.5px dashed var(--line); box-shadow: none; }

/* Home: calm action cards — one filled, the rest quiet */
.hello { margin: .8rem 0 1.2rem; }
.hello h1 { font-size: clamp(1.8rem, 3.4vw, 2.4rem); }
.cta-row { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .8rem; margin-bottom: 1.8rem; }
.cta-card { --tint: var(--primary); background: var(--surface); color: var(--ink); border: var(--border); box-shadow: none; padding: 1rem 1.1rem 1rem 1.2rem; min-height: 96px; }
.cta-card:first-child { background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 70%, #b06cff)); color: var(--on-primary); border-color: transparent; box-shadow: 0 14px 30px -18px color-mix(in srgb, var(--primary) 90%, transparent); }
.cta-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--tint) 45%, var(--line)); }

.cta-title { font-size: 1.08rem; letter-spacing: -.01em; }

.cta-go .ic { width: 22px; height: 22px; }
.cta-card:hover .cta-go { transform: translateX(2px); }

.seg { border-radius: 12px; padding: 3px; }
.seg button { border-radius: 9px; min-height: 38px; font-size: .93rem; }
.search { border-radius: 12px; box-shadow: none; border: var(--border); }

.chip { box-shadow: none; border: var(--border); min-height: 36px; font-size: .86rem; }

.grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .8rem; }

/* Skill page */

.lvl { border-radius: 10px; }
.skill-row { border-radius: 14px; }

/* Question screen: one focal task */

.qwrap { gap: 1rem; }
.qtop { gap: .7rem; }
.qmode { font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.qprog { gap: 4px; }
.qprog span { height: 5px; }
.qcard { background: var(--surface); border-radius: 24px; padding: clamp(1.1rem, 3.2vw, 2rem); gap: 1.1rem; }

.key { background: var(--surface-2); box-shadow: none; border-radius: 12px; }
.choice { box-shadow: none; border: 1.5px solid var(--line); border-radius: 14px; }
.choice:hover { box-shadow: none; border-color: var(--primary); }
.choice.right { box-shadow: none; border-color: var(--good); }
.choice.wrong { box-shadow: none; border-color: var(--bad); }
.pick { box-shadow: none; border: 1.5px solid var(--line); }

.fb { border-radius: 14px; }
.help-row { gap: .7rem; }
.help-btns { gap: .45rem; }
.help-btns .btn.sm { min-height: 40px; border-radius: 99px; padding: .35rem .95rem; font-size: .9rem; }

/* Exams & parent */

@media (max-width: 560px) {

/* =====================================================================
   Update 4: Learn screen (accumulating worked examples).
   Working column + sticky evolving diagram; steps never disappear.
   ===================================================================== */
.page.lesson-page { max-width: 1120px; }
.lsn { display: flex; flex-direction: column; gap: 1.1rem; padding-bottom: 6rem; }

/* Stage bar: Big idea · Watch it build · Your turn · Try it · Method card */
.lsn-stages { display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.lsn-stages::-webkit-scrollbar { display: none; }
.lsn-stage { flex: 1 0 auto; display: flex; align-items: center; gap: .5rem; border: var(--border); background: var(--surface); color: var(--muted); border-radius: 99px; padding: .3rem .85rem .3rem .3rem; font: inherit; font-size: .86rem; font-weight: 650; cursor: pointer; min-height: 40px; }
.lsn-stage[disabled] { cursor: default; opacity: .55; }
.lsn-stage .ls-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: .8rem; font-weight: 800; flex: none; }
.lsn-stage.done { color: var(--ink); }
.lsn-stage.done .ls-dot { background: var(--good-bg); color: var(--good); }
.lsn-stage.cur { color: var(--ink); border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent); }
.lsn-stage.cur .ls-dot { background: var(--primary); color: var(--on-primary); }
@media (max-width: 700px) { .lsn-stage:not(.cur) .ls-name { display: none; } .lsn-stage:not(.cur) { flex: none; padding: .3rem; } }

.lsn-kicker { font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--primary); margin-bottom: .4rem; }
.lsn-lead { color: var(--muted); margin: 0; }

/* Big idea */
.lsn-idea { background: var(--surface); border: var(--border); border-radius: 26px; padding: clamp(1.4rem, 4vw, 2.6rem); display: flex; flex-direction: column; gap: .6rem; }
.lsn-big { font-family: var(--font-round); font-size: clamp(1.5rem, 3.4vw, 2.2rem); line-height: 1.25; font-weight: 760; letter-spacing: -.02em; margin: 0; max-width: 30ch; }
.lsn-hook { color: var(--muted); font-size: 1.05rem; margin: .4rem 0 .4rem; }
.lsn-hook-q { color: var(--ink); font-weight: 650; }

/* The board: diagram + working */
.lsn-board { display: grid; grid-template-columns: minmax(0, 45fr) minmax(0, 55fr); gap: 1.2rem; align-items: start; }
.lsn-vis { margin: 0; background: var(--surface); border: var(--border); border-radius: 22px; padding: clamp(.8rem, 2.4vw, 1.4rem); display: flex; flex-direction: column; align-items: center; gap: .5rem; position: sticky; top: 76px; min-height: 120px; justify-content: center; }
.lsn-vis.solo { position: static; background: var(--surface-2); border-color: transparent; }
.lsn-vis svg, .lsn-vis .viz { width: 100%; max-width: 520px; height: auto; }
.lsn-vis > *:not(figcaption) { animation: lsnFade .35s var(--ease); }
.lsn-vis figcaption { font-size: .8rem; font-weight: 650; color: var(--muted); text-align: center; }
.lsn-vis-empty { color: var(--muted); font-size: .9rem; padding: 1rem; text-align: center; }
.lsn-work { display: flex; flex-direction: column; gap: .8rem; min-width: 0; }
.lsn-q { background: var(--surface); border: var(--border); border-radius: 18px; padding: 1rem 1.1rem; font-size: clamp(1.1rem, 2.2vw, 1.3rem); font-weight: 620; line-height: 1.45; }
.lsn-q-tag { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: .25rem; }

/* Steps */
ol.lsn-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; position: relative; }
ol.lsn-steps::before { content: ""; position: absolute; left: 19px; top: 18px; bottom: 18px; width: 2px; background: var(--line); border-radius: 2px; }
.lsn-step { position: relative; display: flex; gap: .85rem; align-items: flex-start; padding: .7rem .9rem .75rem .45rem; border-radius: 16px; background: transparent; border: 1px solid transparent; cursor: pointer; transition: background .2s var(--ease), border-color .2s var(--ease), opacity .2s; }
.lsn-num { position: relative; z-index: 1; flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85rem; background: var(--surface); color: var(--muted); border: 2px solid var(--line); margin-left: 4px; }
.lsn-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: .2rem; }
.lsn-do { font-size: .86rem; font-weight: 650; color: var(--muted); }
.lsn-math { font-size: 1.12rem; font-weight: 600; line-height: 1.5; overflow-x: auto; }
.lsn-math b, .lsn-math strong { color: var(--primary); }
.lsn-why { font-size: .95rem; color: var(--ink); line-height: 1.5; }
.why-tag { display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--t-fdp); background: color-mix(in srgb, var(--t-fdp) 13%, transparent); padding: .1rem .45rem; border-radius: 6px; margin-right: .3rem; vertical-align: 1px; }
.lsn-whyd summary { cursor: pointer; font-size: .8rem; font-weight: 700; color: var(--t-fdp); list-style: none; display: inline-block; padding: .1rem 0; }
.lsn-whyd summary::-webkit-details-marker { display: none; }
.lsn-whyd summary::before { content: "＋ "; }
.lsn-whyd[open] summary::before { content: "− "; }
.lsn-step.past .lsn-math { color: color-mix(in srgb, var(--ink) 78%, var(--muted)); }
.lsn-step.past:hover { background: var(--surface); border-color: var(--line); }
.lsn-step.past .lsn-num { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.lsn-step.cur { background: var(--surface); border-color: color-mix(in srgb, var(--primary) 55%, var(--line)); box-shadow: 0 10px 26px -18px color-mix(in srgb, var(--primary) 80%, transparent); animation: lsnIn .4s var(--ease); cursor: default; }
.lsn-step.cur .lsn-num { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.lsn-step.cur .lsn-math { font-size: 1.24rem; }
.lsn-step.viewing { border-color: var(--t-fdp); background: color-mix(in srgb, var(--t-fdp) 7%, var(--surface)); }
.lsn-step.ghost { cursor: default; opacity: .6; }
.lsn-step.ghost .lsn-num { border-style: dashed; background: transparent; }
.lsn-step.ghost .lsn-do { font-weight: 600; }
.lsn-step.yours { cursor: default; }
.lsn-step.yours #task { margin-top: .4rem; }
.lsn-done-row { margin-left: 46px; padding: .6rem .9rem; border-radius: 14px; background: var(--good-bg); color: var(--good); font-weight: 650; font-size: .92rem; }

/* Try + method card */
.lsn-try { background: var(--surface); border: var(--border); border-radius: 24px; padding: clamp(1.1rem, 3vw, 2rem); display: flex; flex-direction: column; gap: 1rem; }
.lsn-peek summary { cursor: pointer; color: var(--muted); font-weight: 650; font-size: .9rem; }
.lsn-card { background: var(--surface); border: var(--border); border-radius: 26px; padding: clamp(1.2rem, 3.4vw, 2.2rem); display: flex; flex-direction: column; gap: .8rem; }
.lsn-card-title { font-size: clamp(1.4rem, 3vw, 1.9rem); margin: 0; }
.lsn-card-idea { font-size: 1.1rem; color: var(--ink); background: var(--primary-soft); border-radius: 14px; padding: .8rem 1rem; margin: 0; font-weight: 600; }
.lsn-card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; align-items: start; }
ol.lsn-method { counter-reset: m; list-style: none; padding: 0; margin: .4rem 0 0; display: flex; flex-direction: column; gap: .5rem; }
ol.lsn-method li { counter-increment: m; display: flex; gap: .7rem; align-items: baseline; font-size: 1.02rem; line-height: 1.45; }
ol.lsn-method li::before { content: counter(m); flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); font-weight: 800; font-size: .82rem; transform: translateY(-1px); }
ol.lsn-method.mini li { font-size: .92rem; }
ol.lsn-method.mini li::before { width: 22px; height: 22px; }
.lsn-mistake { display: grid; gap: .4rem; border-radius: 16px; padding: .8rem 1rem; background: var(--surface-2); }
.lsn-mistake .mk { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-weight: 800; font-size: .8rem; margin-right: .35rem; }
.lsn-mistake .mk.bad { background: var(--bad-bg); color: var(--bad); }
.lsn-mistake .mk.good { background: var(--good-bg); color: var(--good); }

/* Bottom nav: always reachable */
.lsn-nav { position: sticky; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 6; display: flex; gap: .5rem; justify-content: flex-end; align-items: center; padding: .5rem; margin-top: .4rem; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: var(--border); border-radius: 20px; box-shadow: var(--shadow-lg); }
.lsn-nav #prev { margin-right: auto; }
.lsn-nav .btn.big { min-height: 50px; }
.nav-count { font-size: .8rem; font-weight: 700; opacity: .8; background: rgba(255,255,255,.18); padding: .1rem .45rem; border-radius: 99px; }
.lsn-nav .btn .ic { width: 18px; height: 18px; }

/* Explain panel uses the same step style */

.tb-panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .9rem; }
.tb-panel.tb-flat { box-shadow: var(--shadow); }
.tb-panel[hidden], .tb-field[hidden] { display: none; }
.tb-field { display: flex; flex-direction: column; gap: .4rem; }
.tb-modebar { align-items: flex-start; }
.tb-lab { font-size: .8rem; font-weight: 700; color: var(--muted); }
.tb-inline, .tb-btns { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.tb-seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 4px; border-radius: 14px; background: var(--surface-2); max-width: 100%; }
.tb-seg button { min-height: 40px; min-width: 44px; padding: .4rem .85rem; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font-weight: 650; font-size: .9rem; cursor: pointer; transition: background .18s, color .18s, box-shadow .18s; }
.tb-seg button:hover { color: var(--ink); }
.tb-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tb-btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 44px; padding: .45rem 1rem; border: 0; border-radius: 13px; background: var(--surface-2); color: var(--ink); font-weight: 650; font-size: .93rem; cursor: pointer; transition: background .18s, box-shadow .18s, transform .12s, color .18s; }
.tb-btn:hover { background: color-mix(in srgb, var(--primary) 12%, var(--surface-2)); }
.tb-btn:active { transform: scale(.97); }
.tb-btn.ghost { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); }
.tb-btn.ghost:hover { box-shadow: inset 0 0 0 1.5px var(--primary); }
.tb-btn.accent, .tb-btn[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.tb-btn.accent:hover, .tb-btn[aria-pressed="true"]:hover { background: var(--primary-2); }
.tb-btn.sm { min-height: 40px; padding: .3rem .75rem; font-size: .85rem; }
.tb-btn.big { min-height: 52px; padding: .5rem 1.6rem; font-size: 1.05rem; }
.tb-btn[disabled], .tb-sbtn[disabled] { opacity: .4; cursor: default; }
.tb-jb { min-width: 56px; font-variant-numeric: tabular-nums; }
.tb-jb.neg { color: var(--c2-line); }
.tb-num { display: inline-flex; align-items: center; gap: .4rem; font-size: .88rem; font-weight: 650; color: var(--muted); }
.tb-num input, .tb-numq input, .tb-secrow input { width: 5.2rem; min-height: 44px; padding: .35rem .6rem; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 650; }
.tb-num input:focus, .tb-numq input:focus, .tb-secrow input:focus { outline: none; border-color: var(--primary); }
.tb-stepper { display: inline-flex; align-items: center; gap: .3rem; }
.tb-stepper .tb-lab { margin-right: .2rem; }
.tb-stepper output { min-width: 2.2rem; text-align: center; font-weight: 750; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.tb-sbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink); font-size: 1.3rem; font-weight: 700; cursor: pointer; transition: background .18s; }
.tb-sbtn:hover { background: color-mix(in srgb, var(--primary) 14%, var(--surface-2)); }
.tb-colon { font-weight: 800; font-size: 1.2rem; color: var(--muted); }
.tb-slider { display: flex; flex-direction: column; gap: .15rem; }
.tb-slider output { color: var(--ink); font-weight: 750; font-size: 1rem; margin-left: .3rem; }
.tb-slider input[type=range] { width: 100%; min-height: 44px; accent-color: var(--primary); cursor: pointer; }
.tb-sgroup { display: flex; flex-direction: column; gap: .2rem; padding-left: .7rem; border-left: 4px solid var(--primary); }
.tb-sgroup.c2 { border-left-color: var(--c2); }
.tb-sgroup.c2 input[type=range] { accent-color: var(--c2); }
.tb-fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.05; font-size: .82em; margin: 0 .1em; }
.tb-fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .15em; }
.tb-tablewrap { overflow-x: auto; }
.tb-tablewrap[hidden] { display: none; }
.tb-table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; background: var(--surface); border-radius: var(--radius-sm); overflow: hidden; font-size: .95rem; }
.tb-table th, .tb-table td { padding: .45rem .5rem; text-align: center; border-bottom: 1px solid var(--line); }
.tb-table th { color: var(--muted); font-weight: 700; font-size: .85rem; }
.tb-table tr.c1 td { color: var(--primary); font-weight: 650; }
.tb-table tr.c2 td { color: var(--c2-line); font-weight: 650; }

/* SVG common parts */
.tb-axis { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.tb-tick { stroke: var(--muted); stroke-width: 1.4; }
.tb-tick.major { stroke: var(--ink); stroke-width: 2; }
.tb-tick.whole { stroke: var(--primary); stroke-width: 2.6; }
.tb-svg .tb-tl { font-size: 15px; font-weight: 650; fill: var(--ink); font-variant-numeric: tabular-nums; }
.tb-svg .tb-tl.zero { font-weight: 800; }
.tb-fbar { stroke: var(--ink); stroke-width: 1.4; }
.tb-mark { fill: var(--primary); stroke: var(--surface); stroke-width: 3; cursor: grab; transition: cx .12s, cy .12s; }
.tb-mark-halo { fill: color-mix(in srgb, var(--primary) 16%, transparent); }
.tb-grid { stroke: var(--line); stroke-width: 1; }
.tb-grid.five { stroke: color-mix(in srgb, var(--muted) 35%, var(--line)); }
.tb-svg .tb-axl { font-style: italic; font-weight: 700; font-size: 15px; }
.tb-svg .tb-gl { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.tb-svg .end { text-anchor: end; }
.tb-svg .start { text-anchor: start; }
.tb-pt { stroke: var(--surface); stroke-width: 2.5; fill: var(--primary); }
.tb-pt.c2 { fill: var(--c2); }
.tb-pt.good { fill: var(--good); }
.tb-svg .tb-ptl { font-size: 13px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.tb-svg .tb-ptl.c1 { fill: var(--primary); }
.tb-svg .tb-ptl.c2 { fill: var(--c2-line); }

/* ---------- 1 Number line ---------- */
.tb-arc { fill: none; stroke-width: 2.6; stroke-linecap: round; }
.tb-arc.pos, .tb-arrow.pos { stroke: var(--primary); }
.tb-arc.neg, .tb-arrow.neg { stroke: var(--c2); }
.tb-arrow.pos { fill: var(--primary); }
.tb-arrow.neg { fill: var(--c2); }
.tb-svg .tb-jl { font-size: 14px; font-weight: 750; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.tb-svg .tb-jl.pos { fill: var(--primary); }
.tb-svg .tb-jl.neg { fill: var(--c2-line); }
.tb-endm { fill: var(--surface); stroke: var(--c2); stroke-width: 3.5; }
.tb-pillg rect { fill: var(--primary); }
.tb-svg .tb-pillg text { fill: var(--on-primary); font-weight: 750; font-size: 14px; }
.tb-pillg.end rect { fill: var(--c2); }
.tb-svg .tb-pillg.end text { fill: #fff; }
.tb-nl { cursor: pointer; }

/* ---------- 2 Fraction wall ---------- */
.tb-wallwrap { position: relative; }
.tb-wall { display: flex; flex-direction: column; gap: 3px; }
.tb-wrow { display: grid; grid-template-columns: repeat(var(--d), 1fr); }
.tb-brick { position: relative; height: 40px; border: 0; border-right: 2px solid var(--surface); border-radius: 0; background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: .78rem; cursor: pointer; padding: 0; display: grid; place-items: center; transition: background .18s, color .18s; }
.tb-brick:first-child { border-radius: 9px 0 0 9px; }
.tb-brick:last-child { border-radius: 0 9px 9px 0; border-right: 0; }
.tb-brick:only-child { border-radius: 9px; }
.tb-brick:hover { background: color-mix(in srgb, var(--primary) 18%, var(--surface-2)); }
.tb-brick.on { background: var(--primary); color: var(--on-primary); }
.tb-brick.lu { box-shadow: inset 0 -5px 0 var(--c2); }
.tb-bf { display: inline-flex; flex-direction: column; line-height: 1; font-size: .78rem; }
.tb-bf > span:first-child { border-bottom: 1.3px solid currentColor; padding: 0 .12em 1px; }
.tb-wrow[style*="--d:9"] .tb-bf, .tb-wrow[style*="--d:1"] .tb-bf { font-size: .66rem; }
.tb-guide { position: absolute; top: -8px; bottom: -8px; width: 0; transition: left .15s var(--tb-ease); pointer-events: none; }
.tb-guide[hidden] { display: none; }
.tb-gline { position: absolute; top: 0; bottom: 0; left: -1.5px; width: 3px; background: var(--c2); border-radius: 2px; }
.tb-ghandle { pointer-events: auto; position: absolute; bottom: -38px; left: -22px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--surface); background: var(--c2); cursor: grab; touch-action: none; box-shadow: var(--shadow); }
.tb-ghandle::after { content: ""; position: absolute; inset: 14px 12px; border-left: 2px solid #fff; border-right: 2px solid #fff; }
.tb-t-fractionwall .tb-stagebox.tb-pad { padding-bottom: 3.2rem; overflow: visible; }
.tb-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; text-align: left; }
.tb-stat { display: flex; flex-direction: column; gap: .2rem; padding: .5rem .7rem; border-radius: 12px; background: var(--surface-2); }
.tb-stat b { font-size: 1.15rem; }
.tb-stat.wide { grid-column: 1 / -1; }
.tb-stat.good { background: var(--good-bg); }
@media (max-width: 520px) { .tb-brick { height: 34px; font-size: .7rem; } .tb-bf { font-size: .66rem; } .tb-wrow[style*="--d:1"] .tb-bf { font-size: .55rem; } }

/* ---------- 3 Graph ---------- */
.tb-graph { touch-action: pan-y; cursor: crosshair; }
.tb-curve { fill: none; stroke-width: 3.2; stroke-linecap: round; }
.tb-curve.c1 { stroke: var(--primary); }
.tb-curve.c2 { stroke: var(--c2); }
.tb-pt.big { r: 8; }
.tb-tri { fill: none; stroke: var(--c2); stroke-width: 2.4; stroke-dasharray: 6 5; }
.tb-trace { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
.tb-eqline { font-size: 1.3rem; font-weight: 700; padding: .1rem 0 .1rem .7rem; border-left: 4px solid var(--primary); margin-bottom: .5rem; }
.tb-eqline.c2 { border-left-color: var(--c2); }
.tb-facts { display: flex; flex-direction: column; gap: .45rem; font-size: .98rem; }
.tb-facts .tb-lab { margin-right: .3rem; }
.tb-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: .4rem; background: var(--primary); vertical-align: middle; }
.tb-dot.c2 { background: var(--c2); }
.tb-dot.good { background: var(--good); }

/* ---------- 4 Place value ---------- */
.tb-pv { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: .5rem; }
.tb-pvcol { --pc: var(--t-shape); position: relative; display: flex; flex-direction: column; align-items: stretch; gap: .45rem; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: .7rem .5rem; border-top: 5px solid var(--pc); }
.tb-pv-th { --pc: var(--t-data); } .tb-pv-h { --pc: var(--t-algebra); } .tb-pv-t { --pc: var(--t-fdp); } .tb-pv-o { --pc: var(--t-shape); } .tb-pv-d1 { --pc: var(--primary); } .tb-pv-d2 { --pc: var(--c2); }
.tb-pvcol.after-point::before { content: ""; position: absolute; left: -.42rem; bottom: 4.6rem; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.tb-pvcol header { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.tb-pvcol header b { font-size: 1.15rem; color: var(--pc); font-family: var(--font-round); }
.tb-pvcol header span { font-size: .72rem; color: var(--muted); font-weight: 650; }
.tb-pvitems { display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 4px; min-height: 150px; padding: .4rem .2rem; border-radius: 12px; background: var(--surface-2); transition: box-shadow .2s; }
.tb-pvitems.over { box-shadow: inset 0 0 0 2px var(--warn); }
.tb-item { display: inline-grid; place-items: center; transition: transform .22s var(--tb-ease), opacity .22s; }
.tb-blk { display: block; width: 46px; height: 46px; }
.tb-blk.rod { width: 13px; height: 52px; }
.tb-blk.unit { width: 15px; height: 15px; }
.tb-blk .f { fill: color-mix(in srgb, var(--pc) 75%, var(--surface)); stroke: var(--pc); stroke-width: 1.4; }
.tb-blk .s { fill: none; stroke: color-mix(in srgb, var(--pc) 60%, var(--ink)); stroke-width: 1; }
.tb-blk .s.thin { stroke-width: .5; opacity: .7; }
.tb-ctr { width: 32px; height: 32px; border-radius: 50%; background: var(--pc); color: #fff; font-size: .62rem; font-weight: 800; letter-spacing: -.02em; }
.tb-item.tb-in { animation: tb-pop .25s var(--tb-ease); }
@keyframes tb-pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.tb-item.tb-go-l.tb-out { transform: translateX(-60px) scale(.5); opacity: 0; }
.tb-item.tb-go-r.tb-out { transform: translateX(60px) scale(.5); opacity: 0; }
.tb-pvcount { text-align: center; font-size: 1.6rem; font-weight: 800; font-family: var(--font-round); font-variant-numeric: tabular-nums; }
.tb-pvcount.over { color: var(--warn); }
.tb-pvpm { display: flex; justify-content: center; gap: .35rem; }
.tb-xbtn { width: 100%; font-size: .78rem; line-height: 1.2; padding: .3rem .4rem; }
@media (max-width: 560px) {
  .tb-pv { gap: .3rem; }
  .tb-pvcol { padding: .5rem .25rem; }
  .tb-blk { width: 26px; height: 26px; } .tb-blk.rod { width: 8px; height: 32px; } .tb-blk.unit { width: 10px; height: 10px; }
  .tb-ctr { width: 24px; height: 24px; font-size: .5rem; }
  .tb-pvpm .tb-sbtn { width: 38px; }
  .tb-pvcol header span { display: none; }
}

/* ---------- 5 Bar model ---------- */
.tb-part { fill: var(--tb-soft); stroke: var(--primary); stroke-width: 2; }
.tb-part.p1 { fill: var(--tb-soft2); stroke: var(--c2); }
.tb-part.p2 { fill: var(--good-bg); stroke: var(--good); }
.tb-part.p3, .tb-part.p4 { fill: var(--surface-2); stroke: var(--muted); }
.tb-part.c1 { fill: color-mix(in srgb, var(--primary) 28%, var(--surface)); stroke: var(--primary); }
.tb-part.c2 { fill: color-mix(in srgb, var(--c2) 32%, var(--surface)); stroke: var(--c2); }
.tb-part.q { stroke-dasharray: 6 4; fill: var(--surface); }
.tb-diff { fill: none; stroke: var(--c2); stroke-width: 2; stroke-dasharray: 6 4; }
.tb-brace { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb-svg .tb-bl { font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; }
.tb-svg .tb-bl.sm { font-size: 15px; }
.tb-svg .tb-bl.side { text-anchor: start; fill: var(--muted); font-size: 15px; }
.tb-svg .tb-bl.q { fill: var(--c2-line); font-size: 20px; }
.tb-handle { cursor: ew-resize; }
.tb-handle .hit { fill: transparent; }
.tb-handle circle:not(.hit) { fill: var(--primary); stroke: var(--surface); stroke-width: 3; }
.tb-hline { stroke: var(--primary); stroke-width: 1.5; stroke-dasharray: 3 3; }
.tb-link { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 4; }
.tb-numq { display: inline-flex; align-items: center; gap: .25rem; }
.tb-numq input { width: 4.6rem; }
.tb-q[type=button] { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-weight: 800; font-size: 1.1rem; cursor: pointer; }
.tb-q[aria-pressed="true"] { background: var(--c2); color: #fff; }
.tb-bar { touch-action: pan-y; }

/* ---------- 6 Area model ---------- */
.tb-area { touch-action: manipulation; }
.tb-svg .tb-hl { font-size: 17px; font-weight: 750; }
.tb-svg .tb-hl.c1 { fill: var(--primary); }
.tb-svg .tb-hl.c2 { fill: var(--c2-line); }
.tb-cell { cursor: pointer; outline: none; }
.tb-cell rect { fill: color-mix(in srgb, var(--primary) 10%, var(--surface)); stroke: var(--primary); stroke-width: 1.6; transition: fill .2s; }
.tb-cell.s1 rect { fill: color-mix(in srgb, var(--primary) 18%, var(--surface)); }
.tb-cell.neg rect { fill: color-mix(in srgb, var(--c2) 18%, var(--surface)); stroke: var(--c2); stroke-dasharray: 6 4; }
.tb-cell:hover rect { fill: color-mix(in srgb, var(--primary) 26%, var(--surface)); }
.tb-cell:focus-visible rect { stroke-width: 3.5; stroke: var(--ink); }
.tb-svg .tb-cell text { font-weight: 750; fill: var(--muted); }
.tb-svg .tb-cell.open text { fill: var(--ink); }
.tb-tile { stroke: color-mix(in srgb, var(--muted) 45%, transparent); stroke-width: 1; }

/* ---------- 7 Balance ---------- */
.tb-eqbig { text-align: center; font-size: clamp(1.6rem, 6vw, 2.3rem); font-weight: 800; font-family: var(--font-round); letter-spacing: .01em; }
.tb-stand { fill: none; stroke: var(--muted); stroke-width: 6; stroke-linecap: round; }
.tb-pivot { fill: var(--ink); }
.tb-beam { transform-box: view-box; transform-origin: 240px 69px; transition: transform .25s var(--tb-ease); }
.tb-beam rect { fill: var(--ink); }
.tb-pan { transition: transform .25s var(--tb-ease); }
.tb-string { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.tb-dish { fill: var(--surface-2); stroke: var(--muted); stroke-width: 2; }
.tb-xbox { cursor: pointer; }
.tb-xbox rect { fill: var(--primary); }
.tb-svg .tb-xbox text { fill: var(--on-primary); font-style: italic; font-weight: 800; font-size: 17px; }
.tb-unit { fill: var(--c2); stroke: color-mix(in srgb, var(--c2) 60%, var(--ink)); stroke-width: 1; cursor: pointer; }
.tb-log { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .35rem; font-weight: 650; }
.tb-logi { padding: .2rem .6rem; border-radius: 99px; background: var(--surface-2); }
.tb-logi:last-child { background: var(--tb-soft); color: var(--primary); }
.tb-arrowr { color: var(--muted); }

/* ---------- 8 Angles ---------- */
.tb-prot { fill: color-mix(in srgb, var(--primary) 6%, transparent); stroke: color-mix(in srgb, var(--primary) 50%, var(--line)); stroke-width: 1.5; }
.tb-ptick { stroke: color-mix(in srgb, var(--primary) 55%, var(--muted)); stroke-width: 1; }
.tb-svg .tb-plab { font-size: 10px; fill: var(--muted); }
.tb-svg .tb-plab.inner { font-size: 8.5px; opacity: .75; }
.tb-arcf { fill: color-mix(in srgb, var(--c2) 26%, transparent); stroke: var(--c2); stroke-width: 2; }
.tb-arcf.c0 { fill: color-mix(in srgb, var(--primary) 22%, transparent); stroke: var(--primary); }
.tb-arcf.c2 { fill: color-mix(in srgb, var(--good) 24%, transparent); stroke: var(--good); }
.tb-ray { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.tb-ray.base { stroke: var(--muted); }
.tb-vtx { fill: var(--ink); }
.tb-svg .tb-alab { font-size: 19px; font-weight: 800; paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
.tb-svg .tb-alab.c0 { fill: var(--primary); } .tb-svg .tb-alab.c1 { fill: var(--c2-line); } .tb-svg .tb-alab.c2 { fill: var(--good); }
.tb-c0 { color: var(--primary); } .tb-c1t { color: var(--c2-line); } .tb-c2t { color: var(--good); }
.tb-trifill { fill: color-mix(in srgb, var(--primary) 7%, transparent); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.tb-corner.sel .tb-mark-halo { fill: color-mix(in srgb, var(--primary) 30%, transparent); }
.tb-svg .tb-vl { font-size: 17px; font-weight: 800; fill: var(--muted); }
.tb-ang { cursor: pointer; }

/* ---------- 9 Clock ---------- */
.tb-face { fill: var(--surface); stroke: var(--ink); stroke-width: 4; }
.tb-ctick { stroke: var(--muted); stroke-width: 1.5; }
.tb-ctick.big { stroke: var(--ink); stroke-width: 3; }
.tb-svg .tb-cnum { font-size: 22px; font-weight: 750; font-family: var(--font-round); }
.tb-svg .tb-cnum24 { font-size: 11px; fill: var(--c2-line); font-weight: 700; }
.tb-hand { stroke-linecap: round; transition: none; }
.tb-hand.hour { stroke: var(--ink); stroke-width: 8; }
.tb-hand.min { stroke: var(--primary); stroke-width: 5; }
.tb-cdot { fill: var(--ink); }
.tb-clock { cursor: grab; }

/* ---------- 10 Chance ---------- */
.tb-clstage { display: grid; place-items: center; min-height: 220px; }
.tb-rolls .tb-btn { min-width: 64px; }
.tb-coin { width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--warn) 55%, #fff), var(--warn)); color: #3a2a00; font-size: 3.4rem; font-weight: 800; font-family: var(--font-round); box-shadow: inset 0 0 0 6px color-mix(in srgb, var(--warn) 70%, #000 10%), var(--shadow); }

  <script>
/* Family Maths Game — core utilities (namespace, seeded RNG, exact rationals, dates, ids).
   Classic script (no modules) so the app opens straight from a folder with no server. */
(function (root) {
  'use strict';
  const FMG = (root.FMG = root.FMG || {});

  /* ---------- Seeded random (mulberry32) ---------- */
  function rng(seed) {
    let a = seed >>> 0;
    const next = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.int = (lo, hi) => lo + Math.floor(next() * (hi - lo + 1));
    next.pick = (arr) => arr[Math.floor(next() * arr.length)];
    next.shuffle = (arr) => {
      const a2 = arr.slice();
      for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; }
      return a2;
    };
    return next;
  }
  function newSeed() { return (Math.random() * 2 ** 31) >>> 0; }

  /* ---------- Exact rational arithmetic ---------- */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
  function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }

  class Q {
    constructor(n, d = 1) {
      if (!Number.isInteger(n) || !Number.isInteger(d)) throw new Error('Q needs integers');
      if (d === 0) throw new Error('Zero denominator');
      if (d < 0) { n = -n; d = -d; }
      const g = gcd(n, d);
      this.n = n / g; this.d = d / g;
      this.rawN = n; this.rawD = d; // as written (sign-normalised), for form checks
    }
    static of(x) { return x instanceof Q ? x : new Q(x, 1); }
    add(o) { o = Q.of(o); return new Q(this.n * o.d + o.n * this.d, this.d * o.d); }
    sub(o) { o = Q.of(o); return new Q(this.n * o.d - o.n * this.d, this.d * o.d); }
    mul(o) { o = Q.of(o); return new Q(this.n * o.n, this.d * o.d); }
    div(o) { o = Q.of(o); return new Q(this.n * o.d, this.d * o.n); }
    eq(o) { o = Q.of(o); return this.n === o.n && this.d === o.d; }
    cmp(o) { o = Q.of(o); return this.n * o.d - o.n * this.d; }

    toString() { return this.d === 1 ? String(this.n) : `${this.n}/${this.d}`; }

      if (this.d === 1 || Math.abs(this.n) < this.d) return this.toString();

  const clock = { offsetMs: 0, now() { return Date.now() + this.offsetMs; } };
  const londonFmt = (typeof Intl !== 'undefined')
    ? new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' })
    : null;
  function londonDate(ms) { return londonFmt ? londonFmt.format(new Date(ms)) : new Date(ms).toISOString().slice(0, 10); }
  function dayNumber(isoDate) { const [y, m, d] = isoDate.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }

  function prettyDate(iso) {
    try { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); } catch (e) { return iso; }
  }

  /* ---------- IDs ---------- */
  function uid(prefix) {
    const r = (root.crypto && root.crypto.randomUUID) ? root.crypto.randomUUID().replace(/-/g, '').slice(0, 16)
      : Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    return `${prefix}_${r}`;
  }

  /* ---------- Small helpers ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function fracHTML(q) {
    q = Q.of(q);
    if (q.d === 1) return `<span class="num">${q.n < 0 ? '−' + Math.abs(q.n) : q.n}</span>`;
    const sign = q.n < 0 ? '−' : '';

  }
  function fracTxt(n, d) { return `<span class="frac" aria-label="${n} over ${d}"><span class="fr"><span>${n}</span><span>${d}</span></span></span>`; }

  Object.assign(FMG, { rng, newSeed, gcd, lcm, Q, clock, londonDate, dayNumber, addDays, daysBetween, prettyDate, uid, esc, fracHTML, fracTxt });
  FMG.today = () => londonDate(clock.now());
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* Marking for Family English. Text answers (markText) come first; the Family Maths number marking is kept unchanged
   below it for any numeric answer, and mark() sends text specs to markText so numbers never break English answers.
   Marking: a safe parser (no eval of learner input) with exact rational comparison,
   requested-form checks, units and multiple solutions. Spec section 10. */
(function (root) {
  'use strict';
  const FMG = root.FMG;
  const { Q } = FMG;

  const UNITS = {
    length: { mm: new Q(1, 1000), cm: new Q(1, 100), m: new Q(1), km: new Q(1000) },
    mass: { g: new Q(1, 1000), kg: new Q(1) },
    capacity: { ml: new Q(1, 1000), l: new Q(1) },
    money: { p: new Q(1, 100), '£': new Q(1) },
  };
  const UNIT_ALIASES = { metre: 'm', metres: 'm', meter: 'm', meters: 'm', centimetre: 'cm', centimetres: 'cm', millimetres: 'mm', kilometres: 'km', grams: 'g', kilograms: 'kg', litre: 'l', litres: 'l', millilitres: 'ml', pence: 'p' };

    }

  }

  function withMisconception(result, gotQ, spec) {
    for (const m of spec.misconceptions || []) {
      try { if (gotQ && m.test(gotQ)) return { ...result, tag: m.tag, message: m.message }; } catch (e) { /* ignore */ }
    }

     - capitals, extra spaces, curly and straight apostrophes/quotes, dashes and a final full stop do not matter;

/* Family English — curriculum taxonomy: 8 stages, 5 strands, 27 topic cards and their skills.
